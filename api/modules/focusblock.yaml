openapi: 3.0.3
info:
  title: X Console focus block (B131)
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /focus-block/settings:
    get:
      operationId: getFocusBlockSettings
      tags: [focusblock]
      description: 专注屏蔽的设置，以及每台电脑现在的状态。
      responses:
        "200":
          description: 设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FocusBlockSettings" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    put:
      operationId: putFocusBlockSettings
      tags: [focusblock]
      description: |
        保存设置。需要提升权限，因为名单决定了代理会结束哪些程序。
        网址会整理成域名（去掉协议、端口和路径），程序名去掉 .exe 并转成小写。
        名单里有系统关键程序、路径或写法不对的项，整个请求被拒绝，一项都不保存。
        正在专注时改设置，马上按新设置生效。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FocusBlockSettingsInput" }
      responses:
        "200":
          description: 保存后的设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FocusBlockSettings" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /focus-block/status:
    get:
      operationId: getFocusBlockStatus
      tags: [focusblock]
      description: 现在是不是在屏蔽。番茄钟页的“屏蔽中”小标用它。
      responses:
        "200":
          description: 概要
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FocusBlockStatus" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /focus-block/suggestions:
    get:
      operationId: getFocusBlockSuggestions
      tags: [focusblock]
      description: |
        从电脑时间里分到“娱乐”类的程序，用来一键导入程序名单。
        只看程序本身的类别，浏览器按网页标题分到娱乐类不算。系统关键程序不会出现。
      responses:
        "200":
          description: 建议加入名单的程序名
          content:
            application/json:
              schema:
                type: object
                required: [apps]
                properties:
                  apps:
                    type: array
                    items: { type: string }
        default:
          $ref: "../common.yaml#/components/responses/Error"
components:
  schemas:
    FocusBlockComputer:
      type: object
      required: [id, name, os, online, supported, selected, state, message, sites, killed, refused]
      properties:
        id: { type: string }
        name: { type: string }
        os: { type: string }
        online: { type: boolean }
        supported:
          type: boolean
          description: 代理是不是新到有这个功能。旧版本代理要先更新
        selected:
          type: boolean
          description: 是不是在“要屏蔽的电脑”里
        state:
          type: string
          enum: [off, idle, active, permission, failed, offline, unsupported]
          description: |
            off 没选这台；idle 已选，现在没在专注；active 已生效；
            permission 网站没屏蔽成，因为代理没有改 hosts 文件的权限（程序仍会结束）；
            failed 出错了；offline 代理不在线；unsupported 代理版本太旧
        message:
          type: string
          description: 给人看的一句话，说明状态
        sites:
          type: integer
          description: 已写进 hosts 的名字个数
        killed:
          type: integer
          description: 这次专注里已经结束的程序个数
        refused:
          type: array
          description: 代理没有采用的名单项和原因
          items: { type: string }
        updatedAt: { type: string, format: date-time, nullable: true }
    FocusBlockSettings:
      type: object
      required: [enabled, hostIds, domains, apps, ipv6, blockInBreak, haStart, haEnd, haMessage, computers, maxDomains, maxApps]
      properties:
        enabled:
          type: boolean
          description: 总开关，默认关
        hostIds:
          type: array
          description: 要屏蔽的电脑（已配对的代理）
          items: { type: string }
        domains:
          type: array
          description: 要屏蔽的网站，已经整理成域名
          items: { type: string }
        apps:
          type: array
          description: 要结束的程序名，小写，不带 .exe
          items: { type: string }
        ipv6:
          type: boolean
          description: 同时把名字指向 ::1
        blockInBreak:
          type: boolean
          description: 专注时间到了以后，到你点“完成”之前，是否继续屏蔽。默认不屏蔽
        haStart:
          type: string
          description: 专注开始时在 Home Assistant 里打开的场景或脚本，例如 scene.focus。空表示不用
        haEnd:
          type: string
          description: 屏蔽结束时在 Home Assistant 里打开的场景或脚本。空表示不用
        haMessage:
          type: string
          description: 上一次调用 Home Assistant 的结果。空表示还没有调用过
        computers:
          type: array
          items: { $ref: "#/components/schemas/FocusBlockComputer" }
        maxDomains: { type: integer }
        maxApps: { type: integer }
    FocusBlockSettingsInput:
      type: object
      description: 只传要改的项
      properties:
        enabled: { type: boolean }
        hostIds:
          type: array
          items: { type: string }
        domains:
          type: array
          items: { type: string }
        apps:
          type: array
          items: { type: string }
        ipv6: { type: boolean }
        blockInBreak: { type: boolean }
        haStart: { type: string }
        haEnd: { type: string }
    FocusBlockStatus:
      type: object
      required: [blocking, activeComputers, problemComputers]
      properties:
        blocking:
          type: boolean
          description: 至少有一台电脑的屏蔽已生效
        activeComputers: { type: integer }
        problemComputers:
          type: integer
          description: 选了但没成功的电脑数（权限不足、出错、离线）
