openapi: 3.0.3
info:
  title: X Console core API (M0)
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      tags: [core]
      security: []
      responses:
        "200":
          description: 服务状态
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string }
                  version: { type: string }
  /auth/status:
    get:
      operationId: getAuthStatus
      tags: [auth]
      security: []
      responses:
        "200":
          description: 当前登录状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
  /auth/setup:
    post:
      operationId: setupAccount
      tags: [auth]
      security: []
      description: 仅在还没有用户时可用。创建用户并返回 TOTP 密钥。之后调用 /auth/setup/confirm 开启两步验证，或调用 /auth/setup/skip-totp 跳过。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: 返回 TOTP 密钥
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpEnrollment"
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /auth/setup/confirm:
    post:
      operationId: confirmSetup
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCode"
      responses:
        "204":
          description: 启用两步验证并登录
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /auth/setup/skip-totp:
    post:
      operationId: skipSetupTotp
      tags: [auth]
      security: []
      description: 初始化时跳过两步验证，直接登录。之后可以在设置里开启。要带上刚设的密码，否则设完密码到点跳过之间，任何人都能调这个接口登录。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "204":
          description: 已登录，账号没有两步验证
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      description: 开了两步验证但没带 code 时回 401，错误码 totp_required，不计入失败次数。
      responses:
        "204":
          description: 登录成功，设置会话 Cookie
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "204":
          description: 已退出
  /auth/elevate:
    post:
      operationId: elevate
      tags: [auth]
      description: 再验证一次，之后 5 分钟内可以执行高危操作。开了两步验证时传 code，没开时传 password。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElevateRequest"
      responses:
        "200":
          description: 已提升权限
          content:
            application/json:
              schema:
                type: object
                required: [elevatedUntil]
                properties:
                  elevatedUntil: { type: string, format: date-time }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /auth/totp/enroll:
    post:
      operationId: enrollTotp
      tags: [auth]
      description: 需要提升权限。生成新的密钥，调用 /auth/totp/confirm 之后才生效。
      responses:
        "200":
          description: 新的密钥和 otpauth 地址
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpEnrollment"
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /auth/totp/confirm:
    post:
      operationId: confirmTotp
      tags: [auth]
      description: 输入一次验证码，确认后开启两步验证。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCode"
      responses:
        "204":
          description: 已开启两步验证
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /auth/totp/disable:
    post:
      operationId: disableTotp
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password: { type: string }
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "204":
          description: 已关闭两步验证
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /auth/password:
    post:
      operationId: changePassword
      tags: [auth]
      description: 修改登录密码。成功后其他会话全部退出，当前会话保留。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword: { type: string }
                newPassword: { type: string, minLength: 10 }
      responses:
        "204":
          description: 已修改
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /me/preferences:
    get:
      operationId: getPreferences
      tags: [auth]
      description: 界面偏好（B22），换一台浏览器登录也一样。没保存过时返回默认值 nightMode=auto、accent=ember、language=zh，不带 updatedAt。
      responses:
        "200":
          description: 界面偏好
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    put:
      operationId: putPreferences
      tags: [auth]
      description: 保存界面偏好。整份替换，缺的字段用默认值。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Preferences" }
      responses:
        "200":
          description: 保存后的偏好
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /audit:
    get:
      operationId: listAudit
      tags: [audit]
      parameters:
        - $ref: "../common.yaml#/components/parameters/Limit"
        - $ref: "../common.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: 审计日志，按时间倒序
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }
                  nextCursor: { type: string }
  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      responses:
        "200":
          description: 已配对的代理
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Agent" }
  /agents/pairing-codes:
    post:
      operationId: createPairingCode
      tags: [agents]
      description: 生成一次性配对码，10 分钟内有效。需要提升权限。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind]
              properties:
                name: { type: string }
                kind: { $ref: "#/components/schemas/AgentKind" }
      responses:
        "200":
          description: 配对码
          content:
            application/json:
              schema:
                type: object
                required: [code, expiresAt]
                properties:
                  code: { type: string }
                  expiresAt: { type: string, format: date-time }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /agents/{agentId}:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: revokeAgent
      tags: [agents]
      description: 吊销代理令牌并断开连接。需要提升权限。
      responses:
        "204":
          description: 已吊销
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /agent/pair:
    post:
      operationId: pairAgent
      tags: [agents]
      security: []
      description: 代理程序用配对码换取长期令牌。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairRequest"
      responses:
        "200":
          description: 配对成功
          content:
            application/json:
              schema:
                type: object
                required: [agentId, token]
                properties:
                  agentId: { type: string }
                  token: { type: string }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /agent/install.sh:
    get:
      operationId: getAgentInstallScript
      tags: [agents]
      security: []
      description: |
        Linux 一键安装脚本（B30）。不需要登录，但要带有效的配对码；码无效或过期回 404（不说明原因）。
        脚本里写好面板地址和配对码。用法：curl -fsSL <面板>/api/v1/agent/install.sh?code=XXXX | sudo sh
        按 IP 限流，每分钟 10 次
      parameters:
        - $ref: "#/components/parameters/PairingCode"
      responses:
        "200":
          description: shell 脚本
          content:
            text/x-shellscript:
              schema: { type: string }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /agent/install.ps1:
    get:
      operationId: getAgentInstallPowerShell
      tags: [agents]
      security: []
      description: |
        Windows 一键安装脚本（B30）。用法：irm "<面板>/api/v1/agent/install.ps1?code=XXXX" | iex
        码无效回 404，按 IP 限流
      parameters:
        - $ref: "#/components/parameters/PairingCode"
      responses:
        "200":
          description: PowerShell 脚本
          content:
            text/plain:
              schema: { type: string }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /agent/uninstall.sh:
    get:
      operationId: getAgentUninstallScript
      tags: [agents]
      security: []
      description: Linux 卸载脚本（B30），不需要配对码。只删本机的代理文件和服务，面板上的记录由用户在界面上吊销
      responses:
        "200":
          description: shell 脚本
          content:
            text/x-shellscript:
              schema: { type: string }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /agent/download/{os}/{arch}:
    get:
      operationId: downloadAgent
      tags: [agents]
      security: []
      description: 下载代理程序（B30）。要带有效的配对码，或者已登录。响应头带 X-Checksum-Sha256
      parameters:
        - name: os
          in: path
          required: true
          schema: { type: string, enum: [linux, windows] }
        - name: arch
          in: path
          required: true
          schema: { type: string, enum: [amd64, arm64] }
        - name: code
          in: query
          schema: { type: string }
      responses:
        "200":
          description: 代理程序
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /agent/setup.exe:
    get:
      operationId: downloadAgentSetup
      tags: [agents]
      security: []
      description: |
        Windows 安装程序（B30）。就是 windows/amd64 的代理，下载的文件名是 x-console-agent-setup-<配对码>.exe，
        双击时代理从文件名读出配对码和面板地址（面板地址写在文件末尾的一段数据里），自动配对并装好登录启动
      parameters:
        - $ref: "#/components/parameters/PairingCode"
      responses:
        "200":
          description: 安装程序
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      parameters:
        - name: unread
          in: query
          schema: { type: boolean }
        - $ref: "../common.yaml#/components/parameters/Limit"
        - $ref: "../common.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: 站内通知，按时间倒序
          content:
            application/json:
              schema:
                type: object
                required: [items, unreadCount]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
                  nextCursor: { type: string }
                  unreadCount: { type: integer }
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      responses:
        "204":
          description: 全部标为已读
  /notifications/{notificationId}/read:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: markNotificationRead
      tags: [notifications]
      responses:
        "204":
          description: 已读
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /notifications/{notificationId}:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: deleteNotification
      tags: [notifications]
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
components:
  parameters:
    PairingCode:
      name: code
      in: query
      required: true
      schema: { type: string }
  schemas:
    Preferences:
      type: object
      required: [nightMode, accent, language]
      properties:
        nightMode:
          type: string
          enum: ["on", "off", "auto"]
          description: 夜间模式。auto 跟随系统
        accent:
          type: string
          enum: [ember, violet, mint, ocean, rose, graphite]
          description: 主题色，只在白天生效。ember 是默认的橙色
        language:
          type: string
          enum: [zh, en]
        updatedAt:
          type: string
          format: date-time
          description: 上次保存的时间。从没保存过时不返回，前端会把本地的偏好存上来
    AuthStatus:
      type: object
      required: [setupRequired, authenticated]
      properties:
        setupRequired:
          type: boolean
          description: 还没有用户，需要先走初始化
        authenticated: { type: boolean }
        username: { type: string }
        totpEnabled:
          type: boolean
          description: 是否开了两步验证。只在已登录时返回
        elevatedUntil: { type: string, format: date-time }
    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 10 }
    TotpEnrollment:
      type: object
      required: [secret, otpauthUrl]
      properties:
        secret: { type: string }
        otpauthUrl: { type: string }
    TotpCode:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
        code:
          type: string
          description: 两步验证码。没开两步验证时不传
          x-go-type-skip-optional-pointer: true
    ElevateRequest:
      type: object
      description: 开了两步验证时传 code，没开时传 password
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"
          x-go-type-skip-optional-pointer: true
        password:
          type: string
          x-go-type-skip-optional-pointer: true
    AuditEntry:
      type: object
      required: [id, at, actor, action, target, result]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        target: { type: string }
        result: { type: string }
        detail:
          type: object
          additionalProperties: true
    AgentKind:
      type: string
      enum: [server, desktop]
    Agent:
      type: object
      required: [id, name, kind, os, arch, hostname, version, online, capabilities, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { $ref: "#/components/schemas/AgentKind" }
        os: { type: string }
        arch: { type: string }
        hostname: { type: string }
        version: { type: string }
        online: { type: boolean }
        capabilities:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
    PairRequest:
      type: object
      required: [code, hostname, os, arch, version]
      properties:
        code: { type: string }
        hostname: { type: string }
        os: { type: string }
        arch: { type: string }
        version: { type: string }
        capabilities:
          type: array
          items: { type: string }
    NotificationPriority:
      type: string
      enum: [low, normal, high, urgent]
    Notification:
      type: object
      required: [id, createdAt, kind, title, priority, source]
      properties:
        id: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        kind:
          type: string
          description: 事件类型，例如 reminder.due、server.alert、coding.done
        title: { type: string }
        body: { type: string }
        link:
          type: string
          description: 前端内部路径，例如 /servers/abc
        priority: { $ref: "#/components/schemas/NotificationPriority" }
        source: { type: string, description: 产生通知的模块，例如 reminders }
        readAt: { type: string, format: date-time }
