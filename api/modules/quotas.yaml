openapi: 3.0.3
info:
  title: X Console AI quotas (B110)
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /quotas:
    get:
      operationId: listQuotaAccounts
      tags: [quotas]
      description: 全部 AI 额度账号和各自最近一次读取的结果，按顺序排列。
      responses:
        "200":
          description: 账号列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/QuotaAccount" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: createQuotaAccount
      tags: [quotas]
      description: |
        添加账号。需要提升权限。Claude、Codex、Grok 要给机器（代理）和登录目录，
        DeepSeek 要给 API Key。添加后马上在后台读一次。
        同一个账号（同一台机器、同一个目录，或同一个 Key）已经有了回 409。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuotaAccountInput" }
      responses:
        "201":
          description: 已添加
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotaAccount" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /quotas/hosts:
    get:
      operationId: listQuotaHosts
      tags: [quotas]
      description: 能读额度的机器，也就是声明了 quota 能力的代理。离线的也列出来。
      responses:
        "200":
          description: 机器列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/QuotaHost" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /quotas/reorder:
    post:
      operationId: reorderQuotaAccounts
      tags: [quotas]
      description: 按给出的顺序重排账号。没有列出的账号排在后面，保持原来的顺序。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: integer, format: int64 }
      responses:
        "204":
          description: 已重排
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /quotas/notify:
    get:
      operationId: getQuotaNotify
      tags: [quotas]
      description: 额度通知的开关。四类通知默认都开。
      responses:
        "200":
          description: 当前设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotaNotifySettings" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    put:
      operationId: putQuotaNotify
      tags: [quotas]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuotaNotifySettings" }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotaNotifySettings" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /quotas/{accountId}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    patch:
      operationId: updateQuotaAccount
      tags: [quotas]
      description: 改备注名、机器、目录或 API Key。需要提升权限。改了机器、目录或 Key 会清掉旧的读取结果并重新读。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuotaAccountPatch" }
      responses:
        "200":
          description: 已修改
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotaAccount" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteQuotaAccount
      tags: [quotas]
      description: 删除账号和它的读取记录。不影响机器上的登录。需要提升权限。
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /quotas/{accountId}/refresh:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      operationId: refreshQuotaAccount
      tags: [quotas]
      description: |
        马上读一次。上一次读取成功且在 5 分钟内，或上一次失败但在 30 秒内，
        直接返回上一次的结果，不再请求。读取失败不返回错误，错误写在账号的 error 里。
      responses:
        "200":
          description: 读取后的账号
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotaAccount" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    QuotaKind:
      type: string
      enum: [claude, codex, grok, deepseek]
    QuotaWindow:
      type: object
      required: [name, usedPercent]
      properties:
        name: { type: string, description: "5 小时、7 天、7 天 · 模型名、今日、本月、按量付费" }
        usedPercent: { type: number, format: double, description: 已用百分比，0 到 100 }
        resetsAt: { type: string, format: date-time, nullable: true }
        spanSecs: { type: integer, format: int64, description: 窗口长度，秒，不知道时为 0 }
        model: { type: string, description: 只统计某个模型的窗口，其余为空 }
        aside: { type: boolean, description: 用完也不停账号的窗口，比如按量付费 }
    QuotaBalance:
      type: object
      required: [currency, amount]
      properties:
        currency: { type: string }
        amount: { type: string, description: 原样的数字文本，比如 110.00 }
    QuotaAccount:
      type: object
      required: [id, kind, name, hostId, home, keySet, status, windows, balances, createdAt]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/QuotaKind" }
        name: { type: string }
        hostId: { type: string, description: 机器（代理）编号，DeepSeek 为空 }
        hostName: { type: string }
        hostOnline: { type: boolean }
        home: { type: string, description: 登录目录，空表示这台机器上的默认目录 }
        keySet: { type: boolean, description: DeepSeek 是否已设置 API Key，Key 本身不会返回 }
        balanceLow: { type: string, description: DeepSeek 余额低于这个数时通知，用余额里第一个币种比。空表示不通知 }
        status:
          type: string
          enum: [pending, ok, error]
          description: pending 还没读过，ok 最近一次读取成功，error 最近一次失败
        error: { type: string }
        errorCode:
          type: string
          description: offline、signed_out、unavailable、unsupported、host_missing 之一，或空
        plan: { type: string }
        user: { type: string, description: 账号的邮箱，知道时才有 }
        credits: { type: string }
        windows:
          type: array
          items: { $ref: "#/components/schemas/QuotaWindow" }
        balances:
          type: array
          items: { $ref: "#/components/schemas/QuotaBalance" }
        readAt: { type: string, format: date-time, nullable: true, description: 上一次成功读到数据的时间 }
        triedAt: { type: string, format: date-time, nullable: true, description: 上一次尝试的时间 }
        createdAt: { type: string, format: date-time }
    QuotaAccountInput:
      type: object
      required: [kind, name]
      properties:
        kind: { $ref: "#/components/schemas/QuotaKind" }
        name: { type: string, maxLength: 60 }
        hostId: { type: string }
        home:
          type: string
          description: 绝对路径，或以 ~/ 开头。不能含 ..。空表示默认目录
        apiKey: { type: string, description: 只有 DeepSeek 用 }
        balanceLow: { type: string, description: 只有 DeepSeek 用，数字，空表示不通知 }
    QuotaAccountPatch:
      type: object
      properties:
        name: { type: string, maxLength: 60 }
        hostId: { type: string }
        home: { type: string }
        apiKey: { type: string }
        balanceLow: { type: string, description: 数字，空字符串表示不再通知 }
    QuotaNotifySettings:
      type: object
      required: [low, empty, balance, failed]
      properties:
        low: { type: boolean, description: 窗口剩余 10% 以下 }
        empty: { type: boolean, description: 窗口用完 }
        balance: { type: boolean, description: DeepSeek 余额低于设定的数 }
        failed: { type: boolean, description: 连续读取失败 }
    QuotaHost:
      type: object
      required: [id, name, online]
      properties:
        id: { type: string }
        name: { type: string }
        online: { type: boolean }
