openapi: 3.0.3
info:
  title: X Console inbox (B134)
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /inbox:
    get:
      operationId: listInbox
      tags: [inbox]
      description: |
        status=open（默认）列没处理的条目，旧的在前；status=closed 列最近处理的（已归档和已忽略），新的在前，最多 100 条。
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, closed] }
      responses:
        "200":
          description: 条目
          content:
            application/json:
              schema:
                type: object
                required: [items, openCount]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InboxItem" }
                  openCount: { type: integer, description: 没处理的条数 }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: createInboxItem
      tags: [inbox]
      description: 收一条文字。保存后后台生成建议。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        "201":
          description: 新条目
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxItem" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /inbox/voice:
    post:
      operationId: createInboxVoice
      tags: [inbox]
      description: |
        收一段录音。请求体是音频文件内容，Content-Type 写音频格式（audio/webm、audio/mp4、audio/ogg 等），最多 10 MB。
        服务端转成文字后当文字条目收。没配置 AI 供应商时回 409。
      parameters:
        - name: language
          in: query
          description: ISO-639-1 语言代码，不给就用设置里的
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: 新条目
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxItem" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /inbox/settings:
    get:
      operationId: getInboxSettings
      tags: [inbox]
      responses:
        "200":
          description: 设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxSettings" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    put:
      operationId: putInboxSettings
      tags: [inbox]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InboxSettings" }
      responses:
        "200":
          description: 保存后的设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxSettings" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /inbox/{itemId}:
    parameters:
      - $ref: "#/components/parameters/InboxItemId"
    patch:
      operationId: updateInboxItem
      tags: [inbox]
      description: 改原文。原来的建议作废，重新生成。只能改没处理的条目。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        "200":
          description: 改后的条目
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxItem" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteInboxItem
      tags: [inbox]
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /inbox/{itemId}/suggest:
    parameters:
      - $ref: "#/components/parameters/InboxItemId"
    post:
      operationId: suggestInboxItem
      tags: [inbox]
      description: 重新生成建议，等结果回来再返回。AI 没配置或关了就回 409。
      responses:
        "200":
          description: 带新建议的条目
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxItem" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /inbox/{itemId}/file:
    parameters:
      - $ref: "#/components/parameters/InboxItemId"
    post:
      operationId: fileInboxItem
      tags: [inbox]
      description: |
        归档：按 kind 调用提醒、看板、笔记或稍后读建一个对象。
        reminder 要 title 和 at；card 要 title 和 projectId；note 要 title 或 body；readlater 要 url（http 或 https）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InboxFileInput" }
      responses:
        "200":
          description: 已归档的条目
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxItem" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /inbox/{itemId}/dismiss:
    parameters:
      - $ref: "#/components/parameters/InboxItemId"
    post:
      operationId: dismissInboxItem
      tags: [inbox]
      responses:
        "200":
          description: 已忽略的条目
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxItem" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
components:
  parameters:
    InboxItemId:
      name: itemId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    InboxKind:
      type: string
      enum: [reminder, card, note, readlater, none]
      description: reminder 提醒；card 看板卡片；note 笔记；readlater 稍后读；none 拿不准
    InboxSuggestion:
      type: object
      required: [kind, title, body, at, url, reason]
      properties:
        kind: { $ref: "#/components/schemas/InboxKind" }
        title: { type: string }
        body: { type: string }
        at: { type: string, description: 提醒时间 RFC 3339，没有就是空字符串 }
        url: { type: string }
        reason: { type: string, description: 为什么这么建议，一句话 }
    InboxItem:
      type: object
      required: [id, text, source, status, suggestState, createdAt]
      properties:
        id: { type: integer, format: int64 }
        text: { type: string }
        source:
          type: string
          enum: [web, voice, telegram, telegram_voice, action]
        status: { type: string, enum: [open, filed, dismissed] }
        suggestState:
          type: string
          enum: [off, pending, ready, failed]
          description: off 没有生成（AI 关了或没配置）；pending 正在生成；ready 已有建议；failed 生成失败
        suggestion: { $ref: "#/components/schemas/InboxSuggestion" }
        filedKind: { $ref: "#/components/schemas/InboxKind" }
        filedRef: { type: string, description: 归档后建出的对象编号或 key }
        createdAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
    InboxFileInput:
      type: object
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/InboxKind" }
        title: { type: string }
        body: { type: string }
        at: { type: string }
        url: { type: string }
        projectId: { type: integer, format: int64 }
    InboxSettings:
      type: object
      required: [suggest, reviewReminder, reviewTime, transcribeModel, language, cardProjectId]
      properties:
        cardProjectId: { type: integer, format: int64, description: 归档成看板卡片时默认放进的项目，0 表示没设 }
        suggest: { type: boolean, description: 用 AI 给建议。关掉后只收，不外发 }
        reviewReminder: { type: boolean, description: 每晚提醒清收集箱 }
        reviewTime: { type: string, description: HH:MM }
        transcribeModel: { type: string, description: 转写模型，空表示 whisper-1 }
        language: { type: string, description: 转写语言 ISO-639-1，空表示自动 }
