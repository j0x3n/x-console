openapi: 3.0.3
info:
  title: X Console notes API (M6, B11)
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /notes:
    get:
      operationId: listNotes
      tags: [notes]
      description: |
        没有 q 时置顶在前，然后按更新时间倒序。
        有 q 时按相关度排序，并在 snippet 里返回命中片段。
        q 的每个词都在三个字以上时走全文索引，否则用 LIKE 逐字匹配。
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: tag
          in: query
          schema: { type: string }
        - name: pinned
          in: query
          schema: { type: boolean }
        - name: archived
          in: query
          description: true 时只看已归档的笔记，默认只看未归档的
          schema: { type: boolean }
        - name: hidden
          in: query
          description: |
            B13。true 时只返回隐藏笔记，要先解锁隐藏内容，没解锁时返回空列表。
            不传时只返回普通笔记。隐藏笔记不进全文索引，搜索用 LIKE。
          schema: { type: boolean }
        - $ref: "../common.yaml#/components/parameters/Limit"
        - $ref: "../common.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: 笔记列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/NoteSummary" }
                  nextCursor: { type: string }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: createNote
      tags: [notes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateNote" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /notes/tags:
    get:
      operationId: listNoteTags
      tags: [notes]
      parameters:
        - name: hidden
          in: query
          description: true 时只数隐藏笔记的标签（隐藏空间自己的标签），要先解锁，没解锁时返回空数组
          schema: { type: boolean }
      responses:
        "200":
          description: 未归档笔记用到的标签和数量，按数量倒序
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TagCount" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /notes/tag-colors:
    put:
      operationId: setNoteTagColor
      tags: [notes]
      description: 设置一个标签的颜色。标签名可能带斜杠，所以放在请求体里。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagColorInput" }
      responses:
        "204":
          description: 已保存
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /notes/{noteId}:
    parameters:
      - $ref: "#/components/parameters/NoteId"
    get:
      operationId: getNote
      tags: [notes]
      description: 隐藏笔记在没解锁时返回 404。
      responses:
        "200":
          description: 笔记
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    patch:
      operationId: updateNote
      tags: [notes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateNote" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteNote
      tags: [notes]
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /notes/ai-settings:
    get:
      operationId: getNoteAiSettings
      tags: [notes]
      description: B32。笔记自动起标题、自动加标签。available 为 false 表示没配 AI（没有快速模型也没有 Agent 模型），界面不显示这两个开关。
      responses:
        "200":
          description: 设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteAiSettings" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    put:
      operationId: putNoteAiSettings
      tags: [notes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteAiSettingsInput" }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteAiSettings" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /notes/ai/polish:
    post:
      operationId: polishNoteBody
      tags: [notes]
      description: B40。用快速模型润色、整理 Markdown 正文。只返回结果，不保存。prompt 为空时按内容自动润色。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 60000, description: 最多 20000 字 }
                prompt: { type: string, maxLength: 500, description: 用户自己写的要求，比如“改成要点列表” }
      responses:
        "200":
          description: 润色后的正文
          content:
            application/json:
              schema:
                type: object
                required: [body]
                properties:
                  body: { type: string }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /notes/ai/title:
    post:
      operationId: suggestNoteTitle
      tags: [notes]
      description: B40。根据正文生成一个标题。只返回，不保存。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 60000 }
      responses:
        "200":
          description: 标题
          content:
            application/json:
              schema:
                type: object
                required: [title]
                properties:
                  title: { type: string }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /notes/ai/tags:
    post:
      operationId: suggestNoteTags
      tags: [notes]
      description: B40。根据正文生成最多 3 个标签，优先用已有标签。只返回，不保存。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 60000 }
      responses:
        "200":
          description: 标签
          content:
            application/json:
              schema:
                type: object
                required: [tags]
                properties:
                  tags: { type: array, items: { type: string } }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /notes/{noteId}/suggested-tags:
    parameters:
      - $ref: "#/components/parameters/NoteId"
    delete:
      operationId: dismissNoteSuggestedTags
      tags: [notes]
      description: B32。不要这次的建议标签。内容大改之前不会再建议。
      responses:
        "204":
          description: 已清除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /notes/{noteId}/to-issue:
    parameters:
      - $ref: "#/components/parameters/NoteId"
    post:
      operationId: noteToIssue
      tags: [notes]
      description: 用笔记建一个 Issue。Issue 的关联里会有这条笔记，笔记末尾会加上 Issue 的链接。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId]
              properties:
                projectId: { type: integer, format: int64 }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                required: [issueKey, issueUrl, note]
                properties:
                  issueKey: { type: string }
                  issueUrl: { type: string, description: 站内路径，例如 /projects/XC/12 }
                  note: { $ref: "#/components/schemas/Note" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /notes/{noteId}/to-reminder:
    parameters:
      - $ref: "#/components/parameters/NoteId"
    post:
      operationId: noteToReminder
      tags: [notes]
      description: 用笔记建一个提醒。提醒模块没启用时返回 501 feature_unavailable。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [at]
              properties:
                at: { type: string, format: date-time }
                rrule: { type: string, description: 重复规则，例如 FREQ=DAILY;BYHOUR=9 }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                required: [reminderId]
                properties:
                  reminderId: { type: integer, format: int64 }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /notes/{noteId}/attachments:
    parameters:
      - $ref: "#/components/parameters/NoteId"
    get:
      operationId: listNoteAttachments
      tags: [notes]
      responses:
        "200":
          description: 这条笔记的附件，新的在前
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Attachment" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: uploadNoteAttachment
      tags: [notes]
      description: 上传一个文件，最大 50 MB。类型以服务端检测为准。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: 已上传
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /notes/attachments/{attachmentId}:
    parameters:
      - $ref: "#/components/parameters/AttachmentId"
    get:
      operationId: downloadNoteAttachment
      tags: [notes]
      description: 图片内联显示，其他文件作为附件下载。SVG 一律作为附件。
      responses:
        "200":
          description: 文件内容
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteNoteAttachment
      tags: [notes]
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
components:
  parameters:
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    NoteId:
      name: noteId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    Note:
      type: object
      required: [id, title, body, pinned, tags, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        body: { type: string, description: Markdown }
        pinned: { type: boolean }
        tags:
          type: array
          items: { type: string }
        hidden: { type: boolean, description: B13 隐藏笔记，只在解锁后出现 }
        suggestedTags:
          type: array
          description: B32。AI 建议的标签，用户点了才加上。加上的标签后端自动从这里去掉
          items: { type: string }
        archivedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    NoteSummary:
      type: object
      required: [id, title, excerpt, pinned, tags, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        excerpt: { type: string, description: 正文开头的一段纯文本 }
        snippet:
          type: string
          description: 搜索时的命中片段，命中的部分用 U+E000 和 U+E001 包住
        pinned: { type: boolean }
        tags:
          type: array
          items: { type: string }
        thumbnail:
          type: string
          description: 正文里第一张附件图片的地址，没有图片时不返回
        hidden: { type: boolean, description: B13 隐藏笔记，只在解锁后出现 }
        archivedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Attachment:
      type: object
      required: [id, noteId, name, mime, size, url, createdAt]
      properties:
        id: { type: integer, format: int64 }
        noteId: { type: integer, format: int64 }
        name: { type: string }
        mime: { type: string }
        size: { type: integer, format: int64 }
        url: { type: string, description: 下载地址，例如 /api/v1/notes/attachments/3 }
        createdAt: { type: string, format: date-time }
    CreateNote:
      type: object
      properties:
        title: { type: string }
        body: { type: string }
        pinned: { type: boolean }
        tags:
          type: array
          items: { type: string }
        hidden: { type: boolean, description: 直接建成隐藏笔记，要先解锁 }
    UpdateNote:
      type: object
      properties:
        title: { type: string }
        body: { type: string }
        pinned: { type: boolean }
        archived: { type: boolean }
        hidden: { type: boolean, description: 设为隐藏或取消隐藏，要先解锁 }
        tags:
          type: array
          description: 传了就整体替换
          items: { type: string }
    TagCount:
      type: object
      required: [tag, count]
      properties:
        tag: { type: string }
        count: { type: integer }
        color:
          type: string
          description: 用户给标签设的颜色，形如 #cc7752；没设过时为空，前端按标签名选一个
    TagColorInput:
      type: object
      required: [tag, color]
      properties:
        tag: { type: string, minLength: 1 }
        color:
          type: string
          description: 形如 #cc7752，空字符串表示恢复默认
    NoteAiSettings:
      type: object
      required: [available, autoTitle, autoTags, tagMode]
      properties:
        available: { type: boolean, description: 配了 AI 模型 }
        autoTitle: { type: boolean }
        autoTags: { type: boolean }
        tagMode:
          type: string
          description: suggest 先作为建议显示；apply 直接加上
          enum: [suggest, apply]
    NoteAiSettingsInput:
      type: object
      properties:
        autoTitle: { type: boolean }
        autoTags: { type: boolean }
        tagMode: { type: string, enum: [suggest, apply] }
