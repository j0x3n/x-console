openapi: 3.0.3
info:
  title: X Console credentials ledger (B120)
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /credentials:
    get:
      operationId: listCredentials
      tags: [credentials]
      description: |
        全部条目，按“最急的一项”排：到期日和更换到期日里更近的那个，已过的在最前，两项都没有的在最后。
        概要统计不受 kind、q 的限制，只受 archived 的限制。
      parameters:
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/CredentialKind" }
        - name: q
          in: query
          description: 在名称、平台、账号、用在哪里、权限范围、备注里找
          schema: { type: string }
        - name: archived
          in: query
          description: true 时包含已归档的，默认不含
          schema: { type: boolean }
      responses:
        "200":
          description: 条目列表
          content:
            application/json:
              schema:
                type: object
                required: [items, summary]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Credential" }
                  summary: { $ref: "#/components/schemas/CredentialSummary" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: createCredential
      tags: [credentials]
      description: 只记信息。文字字段里有像密钥本身的内容时回 400。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialInput" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /credentials/{credentialId}:
    parameters:
      - $ref: "#/components/parameters/CredentialId"
    get:
      operationId: getCredential
      tags: [credentials]
      responses:
        "200":
          description: 条目
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    patch:
      operationId: updateCredential
      tags: [credentials]
      description: |
        只改给出的字段。expiresOn 改了或清空，已提醒的记录一起清掉。
        archived 为 true 归档，false 取消归档。字符串字段给空字符串表示清空。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialPatch" }
      responses:
        "200":
          description: 已修改
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteCredential
      tags: [credentials]
      description: 删除条目。需要提升权限。
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /credentials/{credentialId}/rotate:
    parameters:
      - $ref: "#/components/parameters/CredentialId"
    post:
      operationId: rotateCredential
      tags: [credentials]
      description: |
        记一次更换：更换日默认今天，可以同时给新的到期日和新的尾号。创建日期不动，没给的到期日保持原样。
        已提醒的记录清空。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialRotate" }
      responses:
        "200":
          description: 更换后的条目
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
components:
  parameters:
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    CredentialKind:
      type: string
      enum: [api_key, access_token, ssh_key, signing_key, other]
    CredentialStatus:
      type: string
      description: |
        expired 已过期，soon 在这一条最大的提醒天数内到期（没设提醒时 30 天），
        stale 超过更换周期没更换，ok 都没到，none 没有到期日也没设更换周期。
        同时满足多个时按 expired、soon、stale 的顺序取第一个。
      enum: [expired, soon, stale, ok, none]
    CredentialSummary:
      type: object
      required: [total, expired, soon, stale, none]
      properties:
        total: { type: integer }
        expired: { type: integer }
        soon: { type: integer }
        stale: { type: integer }
        none: { type: integer }
    Credential:
      type: object
      required: [id, kind, name, platform, account, usedBy, scopes, hint, createdOn, rotatedOn, expiresOn, rotateEveryDays, remindDays, notes, status, archived, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/CredentialKind" }
        name: { type: string }
        platform: { type: string }
        account: { type: string }
        usedBy:
          type: array
          items: { type: string }
          description: 用在哪台服务器或哪个项目，最多 20 项
        scopes: { type: string }
        hint: { type: string, description: 识别用的尾号或指纹前几位，最多 16 个字符 }
        createdOn: { type: string, description: "创建日期，YYYY-MM-DD，没有为空字符串" }
        rotatedOn: { type: string, description: "上次更换日期，YYYY-MM-DD，没有为空字符串" }
        expiresOn: { type: string, description: "到期日，YYYY-MM-DD，没有为空字符串" }
        rotateEveryDays: { type: integer, description: 超过多少天没更换就提醒，0 表示不设 }
        remindDays:
          type: array
          items: { type: integer }
          description: 到期前多少天提醒，从大到小
        notes: { type: string }
        status: { $ref: "#/components/schemas/CredentialStatus" }
        expiresIn:
          type: integer
          nullable: true
          description: 离到期日还有几天，过期为负数，没有到期日为空
        rotateDueIn:
          type: integer
          nullable: true
          description: 离该更换还有几天，已超过为负数，没设周期为空
        archived: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CredentialInput:
      type: object
      required: [kind, name]
      properties:
        kind: { $ref: "#/components/schemas/CredentialKind" }
        name: { type: string }
        platform: { type: string }
        account: { type: string }
        usedBy:
          type: array
          items: { type: string }
        scopes: { type: string }
        hint: { type: string }
        createdOn: { type: string }
        rotatedOn: { type: string }
        expiresOn: { type: string }
        rotateEveryDays: { type: integer }
        remindDays:
          type: array
          items: { type: integer }
        notes: { type: string }
    CredentialPatch:
      type: object
      properties:
        kind: { $ref: "#/components/schemas/CredentialKind" }
        name: { type: string }
        platform: { type: string }
        account: { type: string }
        usedBy:
          type: array
          items: { type: string }
        scopes: { type: string }
        hint: { type: string }
        createdOn: { type: string }
        rotatedOn: { type: string }
        expiresOn: { type: string }
        rotateEveryDays: { type: integer }
        remindDays:
          type: array
          items: { type: integer }
        notes: { type: string }
        archived: { type: boolean }
    CredentialRotate:
      type: object
      properties:
        rotatedOn: { type: string, description: 默认今天 }
        expiresOn: { type: string, description: 不给就保持原样 }
        hint: { type: string, description: 不给就保持原样 }
