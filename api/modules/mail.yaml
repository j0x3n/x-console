openapi: 3.0.3
info:
  title: X Console mail API (B53)
  version: 0.1.0
  description: |
    邮件：用 IMAP 收 Gmail、阿里企业邮箱等邮箱的信，新邮件实时通知。第一版只收不发。
    密码用主密钥加密存储，接口不返回。
servers:
  - url: /api/v1
paths:
  /mail/accounts:
    get:
      operationId: listMailAccounts
      tags: [mail]
      responses:
        "200":
          description: 邮箱账号
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MailAccount" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: createMailAccount
      tags: [mail]
      description: 添加邮箱。先用填的信息连一次 IMAP 并登录，失败回 400 并写明原因，不保存。要提升权限。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MailAccountInput" }
      responses:
        "201":
          description: 添加好的账号
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailAccount" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /mail/accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    patch:
      operationId: updateMailAccount
      tags: [mail]
      description: 改名称、通知开关，或者换密码（换密码时先验证登录）。改服务器和密码要提升权限。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MailAccountPatch" }
      responses:
        "200":
          description: 改好的账号
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailAccount" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteMailAccount
      tags: [mail]
      description: 删除账号和本地缓存的邮件。邮箱里的信不受影响。要提升权限。
      responses:
        "204": { description: 已删除 }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /mail/accounts/{accountId}/sync:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      operationId: syncMailAccount
      tags: [mail]
      description: 马上同步一次收件箱。同步在后台做，接口立刻返回。
      responses:
        "202": { description: 已开始同步 }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /mail/messages:
    get:
      operationId: listMailMessages
      tags: [mail]
      description: 收件箱里的邮件，新的在前。只同步收件箱。
      parameters:
        - name: accountId
          in: query
          description: 不传表示所有账号
          schema: { type: integer, format: int64 }
        - name: unread
          in: query
          description: true 只看未读
          schema: { type: boolean }
        - name: q
          in: query
          description: 搜发件人和主题
          schema: { type: string, maxLength: 100 }
        - name: category
          in: query
          description: 只看 AI 分拣成这一类的邮件（B136）。没分拣过的邮件不会出现
          schema: { $ref: "#/components/schemas/MailCategory" }
        - name: before
          in: query
          description: 翻页，传上一页最后一封的 date
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: 邮件列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailPage" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /mail/messages/{messageId}:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    get:
      operationId: getMailMessage
      tags: [mail]
      description: 一封邮件的正文。第一次打开时从 IMAP 取，之后用本地缓存。打开不会自动标成已读，前端另外调 PATCH。
      responses:
        "200":
          description: 邮件
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailMessage" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    patch:
      operationId: updateMailMessage
      tags: [mail]
      description: 标记已读、未读、星标。同时改邮箱服务器上的状态。服务器没存上时回 502（B217）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MailMessagePatch" }
      responses:
        "200":
          description: 改好的邮件摘要
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailSummary" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /mail/messages/batch:
    post:
      operationId: batchMailMessages
      tags: [mail]
      description: |
        批量标已读、未读、星标，或删除（B219）。先改邮箱服务器，成功的账号再改本地。
        删除是移到邮箱的“已删除”文件夹；找不到这个文件夹时彻底删除。
        一个账号失败不影响别的账号，失败原因写在 errors 里。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MailBatch" }
      responses:
        "200":
          description: 结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailBatchResult" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /mail/read-all:
    post:
      operationId: markAllMailRead
      tags: [mail]
      description: 把一个邮箱（不传 accountId 就是所有邮箱）的未读邮件全部标成已读（B219）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MailReadAll" }
      responses:
        "200":
          description: 结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailBatchResult" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /mail/messages/{messageId}/attachments/{index}:
    parameters:
      - $ref: "#/components/parameters/MessageId"
      - name: index
        in: path
        required: true
        schema: { type: integer, minimum: 0 }
    get:
      operationId: downloadMailAttachment
      tags: [mail]
      description: 下载附件。正文里 cid 引用的内嵌图片也走这里。
      responses:
        "200":
          description: 文件
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /mail/messages/{messageId}/triage:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    post:
      operationId: triageMailMessage
      tags: [mail]
      description: |
        B136：让 AI 分拣这封邮件。有缓存的正文就用正文，否则用开头的摘要。邮件内容会发给 AI 供应商，
        所以只在用户点按钮或这个邮箱开了自动分拣时做。AI 没配置时回 409。
      responses:
        "200":
          description: 分拣结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailTriage" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /mail/todo:
    get:
      operationId: listMailTodo
      tags: [mail]
      description: |
        B220：今日页用。AI 分拣成“要处理”、还没标成已处理、30 天内收到的邮件，新的在前，最多 20 封。
        decision 为 true 的放进“需要你决定”卡片，其余放进“今天要做”卡片。每封都带 triage。
      responses:
        "200":
          description: 要处理的邮件
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailPage" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /mail/messages/{messageId}/done:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    put:
      operationId: setMailDone
      tags: [mail]
      description: B220：把一封“要处理”的邮件标成已处理（今日页不再显示），或者取消。只改本地，不动邮箱服务器。没分拣过的邮件回 404。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MailDone" }
      responses:
        "204": { description: 已保存 }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /mail/summary:
    get:
      operationId: getMailSummary
      tags: [mail]
      description: 今日页用：未读数和最近几封未读。latest 里分拣过的邮件带 triage（B220）。
      responses:
        "200":
          description: 概要
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailSummaryView" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    MailProvider:
      type: string
      description: gmail 和 aliyun 有预设的服务器地址，other 要自己填
      enum: [gmail, aliyun, other]
    MailAccountStatus:
      type: string
      description: ok 连着；connecting 正在连；error 连不上或登录失败，原因在 lastError
      enum: [ok, connecting, error]
    MailAccount:
      type: object
      required: [id, name, email, provider, imapHost, imapPort, username, notify, status, lastError, unread, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, description: 显示用的名字，比如 个人 Gmail }
        email: { type: string }
        provider: { $ref: "#/components/schemas/MailProvider" }
        imapHost: { type: string }
        imapPort: { type: integer }
        username: { type: string, description: 登录名，一般就是邮箱地址 }
        notify: { type: boolean, description: 新邮件时推送 }
        status: { $ref: "#/components/schemas/MailAccountStatus" }
        lastError: { type: string }
        idle: { type: boolean, description: 服务器支持 IDLE，新邮件几秒内就能收到。不支持时每分钟查一次 }
        lastSyncAt: { type: string, format: date-time }
        unread: { type: integer, description: 收件箱未读数 }
        triage: { type: boolean, description: B136：新邮件用 AI 分拣。邮件的发件人、主题和开头会发给 AI 供应商 }
        createdAt: { type: string, format: date-time }
    MailAccountInput:
      type: object
      required: [name, email, provider, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, maxLength: 200 }
        provider: { $ref: "#/components/schemas/MailProvider" }
        imapHost: { type: string, maxLength: 200, description: provider 是 other 时必填 }
        imapPort: { type: integer, minimum: 1, maximum: 65535, description: 默认 993 }
        username: { type: string, maxLength: 200, description: 默认用 email }
        password: { type: string, minLength: 1, maxLength: 500, description: Gmail 要用应用专用密码 }
        notify: { type: boolean, description: 默认 true }
        triage: { type: boolean, description: 默认 false }
    MailAccountPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        notify: { type: boolean }
        triage: { type: boolean }
        imapHost: { type: string, maxLength: 200 }
        imapPort: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string, maxLength: 200 }
        password: { type: string, minLength: 1, maxLength: 500 }
    MailAddress:
      type: object
      required: [address]
      properties:
        name: { type: string }
        address: { type: string }
    MailSummary:
      type: object
      required: [id, accountId, from, subject, snippet, date, unread, flagged, hasAttachments]
      properties:
        id: { type: integer, format: int64 }
        accountId: { type: integer, format: int64 }
        from: { $ref: "#/components/schemas/MailAddress" }
        subject: { type: string }
        snippet: { type: string, description: 正文开头的纯文字，最多 160 字 }
        date: { type: string, format: date-time }
        unread: { type: boolean }
        flagged: { type: boolean }
        hasAttachments: { type: boolean }
        triage: { $ref: "#/components/schemas/MailTriage" }
    MailCategory:
      type: string
      enum: [action, notice, promo]
      description: action 要处理；notice 通知；promo 营销
    MailTriageDate:
      type: object
      required: [date, text]
      properties:
        date: { type: string, description: YYYY-MM-DD }
        text: { type: string, description: 这个日期是什么事，比如 续费截止 }
    MailTriage:
      type: object
      required: [category, decision, summary, dates]
      properties:
        category: { $ref: "#/components/schemas/MailCategory" }
        decision: { type: boolean, description: B220：要处理的邮件里，需要我做决定的（批准、选方案、答应或拒绝）。只有 category 是 action 时可能为 true }
        doneAt: { type: string, format: date-time, description: B220：标成已处理的时间，没标时不给 }
        summary: { type: string, description: 一句话说明这封邮件要你做什么或讲了什么 }
        dates:
          type: array
          description: 邮件里提到的需要留意的日期，最多 3 个
          items: { $ref: "#/components/schemas/MailTriageDate" }
    MailPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MailSummary" }
        nextBefore: { type: string, format: date-time, description: 还有更早的邮件时给 }
    MailAttachment:
      type: object
      required: [index, name, size, mime]
      properties:
        index: { type: integer }
        name: { type: string }
        size: { type: integer, format: int64 }
        mime: { type: string }
        contentId: { type: string, description: 内嵌图片的 cid，正文里写成 cid:<contentId> }
    MailMessage:
      allOf:
        - $ref: "#/components/schemas/MailSummary"
        - type: object
          required: [to, cc, text, attachments]
          properties:
            to:
              type: array
              items: { $ref: "#/components/schemas/MailAddress" }
            cc:
              type: array
              items: { $ref: "#/components/schemas/MailAddress" }
            html: { type: string, description: 原始 HTML 正文，最多 2 MB。前端放在沙盒 iframe 里显示 }
            text: { type: string, description: 纯文字正文。没有时从 HTML 转 }
            attachments:
              type: array
              items: { $ref: "#/components/schemas/MailAttachment" }
    MailMessagePatch:
      type: object
      properties:
        unread: { type: boolean }
        flagged: { type: boolean }
    MailDone:
      type: object
      required: [done]
      properties:
        done: { type: boolean }
    MailBatchAction:
      type: string
      description: read 标已读；unread 标未读；star 加星标；unstar 去掉星标；delete 删除
      enum: [read, unread, star, unstar, delete]
    MailBatch:
      type: object
      required: [ids, action]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: integer, format: int64 }
        action: { $ref: "#/components/schemas/MailBatchAction" }
    MailReadAll:
      type: object
      properties:
        accountId: { type: integer, format: int64 }
    MailBatchResult:
      type: object
      required: [done, errors]
      properties:
        done: { type: integer, description: 改成功的邮件数 }
        errors:
          type: array
          description: 失败的账号和原因，比如“个人 Gmail：连不上服务器”
          items: { type: string }
    MailSummaryView:
      type: object
      required: [unread, accounts, latest]
      properties:
        unread: { type: integer, description: 所有账号的未读总数 }
        accounts:
          type: array
          items:
            type: object
            required: [id, name, unread, status]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
              unread: { type: integer }
              status: { $ref: "#/components/schemas/MailAccountStatus" }
        latest:
          type: array
          description: 最近 5 封未读
          items: { $ref: "#/components/schemas/MailSummary" }
