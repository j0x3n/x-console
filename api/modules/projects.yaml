openapi: 3.0.3
info:
  title: X Console projects API (M5)
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      parameters:
        - name: archived
          in: query
          description: true 时只返回已归档的项目，默认只返回未归档的
          schema: { type: boolean }
      responses:
        "200":
          description: 项目列表，按名称排序
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: createProject
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProject" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      tags: [projects]
      responses:
        "200":
          description: 项目
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    patch:
      operationId: updateProject
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProject" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: archiveProject
      tags: [projects]
      description: 不会真的删除，只是归档。PATCH archived=false 可以恢复。
      responses:
        "204":
          description: 已归档
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /projects/{projectId}/issues:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: createIssue
      tags: [issues]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateIssue" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /projects/{projectId}/labels:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listLabels
      tags: [labels]
      description: 项目自己的标签加上全局标签
      responses:
        "200":
          description: 标签
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Label" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: createLabel
      tags: [labels]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLabel" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /projects/{projectId}/labels/{labelId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: labelId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: updateLabel
      tags: [labels]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateLabel" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteLabel
      tags: [labels]
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /projects/{projectId}/milestones:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listMilestones
      tags: [milestones]
      responses:
        "200":
          description: 里程碑，按截止日期排序
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Milestone" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: createMilestone
      tags: [milestones]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMilestone" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Milestone" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /projects/{projectId}/milestones/{milestoneId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: milestoneId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: updateMilestone
      tags: [milestones]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMilestone" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Milestone" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteMilestone
      tags: [milestones]
      description: 删除后，属于它的 Issue 不再有里程碑
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /projects/{projectId}/categories:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectCategories
      tags: [categories]
      description: B36。项目里的分类，最多两级。按树的顺序返回：一级分类，然后是它下面的二级分类。
      responses:
        "200":
          description: 分类列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectCategory" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: createProjectCategory
      tags: [categories]
      description: 新分类放在同级的最后。parentId 必须是这个项目的一级分类，否则 400。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectCategory" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectCategory" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /projects/{projectId}/categories/{categoryId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: categoryId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: updateProjectCategory
      tags: [categories]
      description: 改名或调整顺序。afterId、beforeId 是同级里落点上下的分类，和 Issue 拖动一样。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectCategory" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectCategory" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteProjectCategory
      tags: [categories]
      description: 删除分类和它的二级分类。里面的 Issue 变成未分类。
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /issues:
    get:
      operationId: listIssues
      tags: [issues]
      description: |
        跨项目查询 Issue。不带 projectId 时不包含已归档项目的 Issue。
        due：today 今天到期；week 今天起 7 天内到期；overdue 已过期且未完成。日期按服务器时区算。B36 起按 dueAt 算。
      parameters:
        - name: projectId
          in: query
          schema: { type: integer, format: int64 }
        - name: boardId
          in: query
          description: B46。只看这个看板的卡片
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          description: 可以传多个
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/IssueStatus" }
        - name: priority
          in: query
          schema: { type: integer, minimum: 0, maximum: 4 }
        - name: labelId
          in: query
          schema: { type: integer, format: int64 }
        - name: milestoneId
          in: query
          schema: { type: integer, format: int64 }
        - name: categoryId
          in: query
          description: B36。一级分类包含它下面的二级分类；0 表示未分类
          schema: { type: integer, format: int64 }
        - name: due
          in: query
          schema:
            type: string
            enum: [today, week, overdue]
        - name: q
          in: query
          description: 按标题或 key 搜索
          schema: { type: string }
        - name: sort
          in: query
          description: updated 最近更新在前；priority 紧急在前、无优先级最后；due 截止日期近的在前；manual 看板顺序
          schema:
            type: string
            enum: [updated, priority, due, manual]
            default: updated
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - $ref: "../common.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: Issue 列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Issue" }
                  nextCursor: { type: string }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /issues/{key}:
    parameters:
      - $ref: "#/components/parameters/IssueKey"
    get:
      operationId: getIssue
      tags: [issues]
      responses:
        "200":
          description: Issue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    patch:
      operationId: updateIssue
      tags: [issues]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateIssue" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteIssue
      tags: [issues]
      description: 删除后编号不会再用
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /issues/{key}/move:
    parameters:
      - $ref: "#/components/parameters/IssueKey"
    post:
      operationId: moveIssue
      tags: [issues]
      description: 看板拖动。afterKey 是落点上方的 Issue，beforeKey 是落点下方的 Issue，都不传表示放到这一列最后。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveIssue" }
      responses:
        "200":
          description: 移动后的 Issue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /projects/{projectId}/boards:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listBoards
      tags: [boards]
      description: B46。项目的看板，每个带上它的列表。
      parameters:
        - name: archived
          in: query
          description: 包含已归档的看板和列表
          schema: { type: boolean }
      responses:
        "200":
          description: 看板
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Board" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: createBoard
      tags: [boards]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBoard" }
      responses:
        "201":
          description: 新看板
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /boards/starred:
    get:
      operationId: listStarredBoards
      tags: [boards]
      description: B46。标星的看板，侧边栏用。
      responses:
        "200":
          description: 标星的看板
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, projectId, projectKey, projectName, name, icon]
                  properties:
                    id: { type: integer, format: int64 }
                    projectId: { type: integer, format: int64 }
                    projectKey: { type: string }
                    projectName: { type: string }
                    name: { type: string }
                    icon: { type: string }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /boards/{boardId}:
    parameters:
      - { name: boardId, in: path, required: true, schema: { type: integer, format: int64 } }
    patch:
      operationId: updateBoard
      tags: [boards]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateBoard" }
      responses:
        "200":
          description: 改后的看板
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteBoard
      tags: [boards]
      description: 删除看板。里面的卡片移到项目的第一个看板（按状态放进对应列表）。项目只剩这一个看板时不能删。
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /boards/{boardId}/copy:
    parameters:
      - { name: boardId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: copyBoard
      tags: [boards]
      description: 复制看板的列表结构，不复制卡片。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 60 }
      responses:
        "201":
          description: 新看板
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /boards/{boardId}/lists:
    parameters:
      - { name: boardId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: createBoardList
      tags: [boards]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBoardList" }
      responses:
        "201":
          description: 新列表，放在最后
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardList" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /boards/{boardId}/archive:
    parameters:
      - { name: boardId, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: listBoardArchive
      tags: [boards]
      description: 归档的卡片（最多 200 张）和列表。
      responses:
        "200":
          description: 归档内容
          content:
            application/json:
              schema:
                type: object
                required: [issues, lists]
                properties:
                  issues:
                    type: array
                    items: { $ref: "#/components/schemas/Issue" }
                  lists:
                    type: array
                    items: { $ref: "#/components/schemas/BoardList" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /lists/{listId}:
    parameters:
      - { name: listId, in: path, required: true, schema: { type: integer, format: int64 } }
    patch:
      operationId: updateBoardList
      tags: [boards]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateBoardList" }
      responses:
        "200":
          description: 改后的列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardList" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteBoardList
      tags: [boards]
      description: 删除列表。里面还有卡片（包括归档的）时不能删，先移走或归档后再删。
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /lists/{listId}/archive-cards:
    parameters:
      - { name: listId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: archiveListCards
      tags: [boards]
      responses:
        "200":
          description: 归档了几张
          content:
            application/json:
              schema:
                type: object
                required: [archived]
                properties:
                  archived: { type: integer }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /lists/{listId}/move-cards:
    parameters:
      - { name: listId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: moveListCards
      tags: [boards]
      description: 把列表里全部卡片移到另一个列表的末尾。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toListId]
              properties:
                toListId: { type: integer, format: int64 }
      responses:
        "200":
          description: 移了几张
          content:
            application/json:
              schema:
                type: object
                required: [moved]
                properties:
                  moved: { type: integer }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /issues/{key}/archive:
    parameters:
      - $ref: "#/components/parameters/IssueKey"
    post:
      operationId: archiveIssue
      tags: [issues]
      description: B46。归档卡片。看板、提醒页、到期提醒都不再显示。
      responses:
        "200":
          description: 归档后的卡片
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /issues/{key}/restore:
    parameters:
      - $ref: "#/components/parameters/IssueKey"
    post:
      operationId: restoreIssue
      tags: [issues]
      description: B46。恢复归档的卡片，回到原列表末尾；原列表没了就放到看板第一个列表。
      responses:
        "200":
          description: 恢复后的卡片
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /issues/{key}/copy:
    parameters:
      - $ref: "#/components/parameters/IssueKey"
    post:
      operationId: copyIssue
      tags: [issues]
      description: B46。复制卡片：标题加“（副本）”，复制描述、标签、截止时间、检查清单，放在原卡片下面。
      responses:
        "201":
          description: 新卡片
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /issues/{key}/members:
    parameters:
      - $ref: "#/components/parameters/IssueKey"
    put:
      operationId: setIssueMembers
      tags: [issues]
      description: B46。整体替换成员。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [members]
              properties:
                members:
                  type: array
                  maxItems: 20
                  items: { $ref: "#/components/schemas/IssueMember" }
      responses:
        "200":
          description: 改后的卡片
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /issues/{key}/activity:
    parameters:
      - $ref: "#/components/parameters/IssueKey"
    get:
      operationId: listIssueActivity
      tags: [issues]
      description: B46。活动记录，新的在前，最多 200 条。
      responses:
        "200":
          description: 活动
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IssueActivity" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /issues/{key}/comments:
    parameters:
      - $ref: "#/components/parameters/IssueKey"
    get:
      operationId: listComments
      tags: [issues]
      responses:
        "200":
          description: 评论，旧的在前
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Comment" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: createComment
      tags: [issues]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateComment" }
      responses:
        "201":
          description: 已添加
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /issues/{key}/comments/{commentId}:
    parameters:
      - $ref: "#/components/parameters/IssueKey"
      - name: commentId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: deleteComment
      tags: [issues]
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /issues/{key}/links:
    parameters:
      - $ref: "#/components/parameters/IssueKey"
    get:
      operationId: listLinks
      tags: [issues]
      responses:
        "200":
          description: 关联
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IssueLink" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: createLink
      tags: [issues]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateIssueLink" }
      responses:
        "201":
          description: 已添加
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueLink" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /issues/{key}/links/{linkId}:
    parameters:
      - $ref: "#/components/parameters/IssueKey"
      - name: linkId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: deleteLink
      tags: [issues]
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /issues/{key}/checklists:
    parameters:
      - $ref: "#/components/parameters/IssueKey"
    get:
      operationId: listChecklists
      tags: [checklists]
      description: B36。这个 Issue 的检查清单，按 position 排好，条目也排好。
      responses:
        "200":
          description: 清单列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Checklist" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: createChecklist
      tags: [checklists]
      description: 新清单放在最后。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChecklistInput" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checklist" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /issues/{key}/checklists/{checklistId}:
    parameters:
      - $ref: "#/components/parameters/IssueKey"
      - $ref: "#/components/parameters/ChecklistId"
    patch:
      operationId: updateChecklist
      tags: [checklists]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChecklistInput" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checklist" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteChecklist
      tags: [checklists]
      description: 连同条目一起删除。
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /issues/{key}/checklists/{checklistId}/items:
    parameters:
      - $ref: "#/components/parameters/IssueKey"
      - $ref: "#/components/parameters/ChecklistId"
    post:
      operationId: createChecklistItem
      tags: [checklists]
      description: 不传 afterId 时放在最后。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateChecklistItem" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChecklistItem" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /issues/{key}/checklist-items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/IssueKey"
      - $ref: "#/components/parameters/ChecklistItemId"
    patch:
      operationId: updateChecklistItem
      tags: [checklists]
      description: 改文字、勾选、排序。排序用 afterId、beforeId，可以同时传 checklistId 挪到同一个 Issue 的另一个清单。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateChecklistItem" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChecklistItem" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteChecklistItem
      tags: [checklists]
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /issues/{key}/checklist-items/{itemId}/convert:
    parameters:
      - $ref: "#/components/parameters/IssueKey"
      - $ref: "#/components/parameters/ChecklistItemId"
    post:
      operationId: convertChecklistItem
      tags: [checklists]
      description: 条目转成 Issue。新 Issue 在同一个项目、同一个分类，标题是条目文字，状态 todo。原条目删掉。在一个事务里做。
      responses:
        "201":
          description: 新建的 Issue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    IssueKey:
      name: key
      in: path
      required: true
      description: 例如 XC-12
      schema: { type: string }
    ChecklistId:
      name: checklistId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ChecklistItemId:
      name: itemId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    IssueStatus:
      type: string
      enum: [backlog, todo, in_progress, in_review, done, canceled]
    Project:
      type: object
      required: [id, key, name, description, color, icon, createdAt, updatedAt, issueCount, openCount]
      properties:
        id: { type: integer, format: int64 }
        key: { type: string, description: 2 到 5 个大写字母 }
        name: { type: string }
        description: { type: string }
        color: { type: string, description: 例如 "#cc7752"，空表示默认 }
        icon: { type: string, description: lucide 图标名，空表示默认 }
        archivedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        issueCount: { type: integer }
        openCount: { type: integer, description: 未完成也未取消的 Issue 数 }
    CreateProject:
      type: object
      required: [key, name]
      properties:
        key: { type: string, pattern: "^[A-Z]{2,5}$" }
        name: { type: string, minLength: 1 }
        description: { type: string }
        color: { type: string }
        icon: { type: string }
    UpdateProject:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        color: { type: string }
        icon: { type: string }
        archived: { type: boolean, description: false 表示恢复归档 }
    Label:
      type: object
      required: [id, name, color]
      properties:
        id: { type: integer, format: int64 }
        projectId: { type: integer, format: int64, description: 没有表示全局标签 }
        name: { type: string }
        color: { type: string }
    CreateLabel:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        color: { type: string }
        global: { type: boolean, description: true 表示所有项目都能用 }
    UpdateLabel:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        color: { type: string }
    Milestone:
      type: object
      required: [id, projectId, name, createdAt]
      properties:
        id: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        name: { type: string }
        dueDate: { type: string, format: date }
        createdAt: { type: string, format: date-time }
    CreateMilestone:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        dueDate: { type: string, format: date }
    UpdateMilestone:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        dueDate: { type: string, format: date, nullable: true, description: null 表示清除 }
    Issue:
      type: object
      required: [id, key, projectId, projectKey, number, title, description, status, priority, sortOrder, labels, externalSource, externalId, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        key: { type: string, description: 例如 XC-12 }
        projectId: { type: integer, format: int64 }
        projectKey: { type: string }
        number: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string, description: Markdown }
        status: { $ref: "#/components/schemas/IssueStatus" }
        priority: { type: integer, description: 0 无，1 紧急，2 高，3 中，4 低 }
        dueDate: { type: string, format: date, deprecated: true, description: 旧字段，B36 起用 dueAt，下个版本删 }
        dueAt: { type: string, format: date-time, description: B36。截止时间，精确到分钟 }
        dueRemind: { $ref: "#/components/schemas/DueRemind" }
        categoryId: { type: integer, format: int64, description: B36。没有表示未分类 }
        checklistDone: { type: integer, description: B36。所有清单里已完成的条目数 }
        checklistTotal: { type: integer, description: B36。所有清单的条目总数，0 表示没有清单条目 }
        milestoneId: { type: integer, format: int64 }
        sortOrder: { type: number, format: double, description: 看板里同一列的顺序，小的在上 }
        labels:
          type: array
          items: { $ref: "#/components/schemas/Label" }
        externalSource: { type: string, description: 外部来源，例如 linear，空表示本地 }
        externalId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        boardId: { type: integer, format: int64, description: B46。所在看板 }
        listId: { type: integer, format: int64, description: B46。所在列表 }
        archivedAt: { type: string, format: date-time, description: B46。归档时间，没归档时不返回 }
        members:
          type: array
          description: B46。成员：me 是自己，agent 是 B47 的 Agent
          items: { $ref: "#/components/schemas/IssueMember" }
        commentCount: { type: integer, description: B46。评论数 }
    IssueMember:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string, enum: [me, agent] }
        id: { type: string, description: me 时为空串，agent 时是 Agent id }
    CreateIssue:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        status: { $ref: "#/components/schemas/IssueStatus" }
        priority: { type: integer, minimum: 0, maximum: 4 }
        dueDate: { type: string, format: date, deprecated: true }
        dueAt: { type: string, format: date-time, description: B36 }
        dueRemind: { $ref: "#/components/schemas/DueRemind" }
        categoryId: { type: integer, format: int64, description: B36 }
        milestoneId: { type: integer, format: int64 }
        labelIds:
          type: array
          items: { type: integer, format: int64 }
        boardId: { type: integer, format: int64, description: B46。不传用项目的第一个看板 }
        listId: { type: integer, format: int64, description: B46。不传用看板里对应状态的列表，没有就用第一个列表。列表有对应状态时，卡片状态改成它 }
    UpdateIssue:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        status: { $ref: "#/components/schemas/IssueStatus" }
        priority: { type: integer, minimum: 0, maximum: 4 }
        dueDate: { type: string, format: date, nullable: true, deprecated: true, description: null 表示清除 }
        dueAt: { type: string, format: date-time, nullable: true, description: B36。null 表示清除 }
        dueRemind: { $ref: "#/components/schemas/DueRemind" }
        categoryId: { type: integer, format: int64, nullable: true, description: B36。null 表示未分类 }
        milestoneId: { type: integer, format: int64, nullable: true, description: null 表示清除 }
        labelIds:
          type: array
          description: 传了就整体替换
          items: { type: integer, format: int64 }
    DueRemind:
      type: string
      description: B36。到期提醒：none 不提醒，at_due 到期时（默认），15m、1h、1d 提前多久
      enum: [none, at_due, 15m, 1h, 1d]
    ProjectCategory:
      type: object
      required: [id, projectId, name, position, issueCount]
      properties:
        id: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        parentId: { type: integer, format: int64, description: 没有表示一级分类 }
        name: { type: string }
        position: { type: number, format: double, description: 同级里的顺序，小的在前 }
        issueCount: { type: integer, description: 直接归在这个分类下的 Issue 数，不含二级分类 }
    CreateProjectCategory:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        parentId: { type: integer, format: int64 }
    UpdateProjectCategory:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        afterId: { type: integer, format: int64, description: 同级里落点上方的分类 }
        beforeId: { type: integer, format: int64, description: 同级里落点下方的分类 }
    Checklist:
      type: object
      required: [id, issueId, title, position, items]
      properties:
        id: { type: integer, format: int64 }
        issueId: { type: integer, format: int64 }
        title: { type: string }
        position: { type: number, format: double }
        items:
          type: array
          items: { $ref: "#/components/schemas/ChecklistItem" }
    ChecklistInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
    ChecklistItem:
      type: object
      required: [id, checklistId, text, done, position]
      properties:
        id: { type: integer, format: int64 }
        checklistId: { type: integer, format: int64 }
        text: { type: string }
        done: { type: boolean }
        position: { type: number, format: double }
        doneAt: { type: string, format: date-time }
    CreateChecklistItem:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 500 }
        afterId: { type: integer, format: int64, description: 放在这个条目后面 }
    UpdateChecklistItem:
      type: object
      properties:
        text: { type: string, minLength: 1, maxLength: 500 }
        done: { type: boolean }
        checklistId: { type: integer, format: int64, description: 挪到另一个清单 }
        afterId: { type: integer, format: int64 }
        beforeId: { type: integer, format: int64 }
    MoveIssue:
      type: object
      description: B46 起可以只传 listId（可以是别的看板或别的项目的列表），这时 status 不用传，列表有对应状态时卡片状态跟着变。只传 status 时，放进卡片所在看板里对应这个状态的列表。
      properties:
        status: { $ref: "#/components/schemas/IssueStatus" }
        listId: { type: integer, format: int64, description: B46。目标列表 }
        afterKey: { type: string, description: 落点上方的 Issue }
        beforeKey: { type: string, description: 落点下方的 Issue }
    Board:
      type: object
      required: [id, projectId, name, icon, position, starred, createdAt, updatedAt, lists]
      properties:
        id: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        name: { type: string }
        icon: { type: string, description: 一个 emoji，可以为空 }
        position: { type: number, format: double }
        starred: { type: boolean }
        archivedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lists:
          type: array
          items: { $ref: "#/components/schemas/BoardList" }
    BoardList:
      type: object
      required: [id, boardId, name, position, color, wipLimit, collapsed, cardCount]
      properties:
        id: { type: integer, format: int64 }
        boardId: { type: integer, format: int64 }
        name: { type: string }
        position: { type: number, format: double }
        status: { $ref: "#/components/schemas/IssueStatus" }
        color: { type: string }
        wipLimit: { type: integer, description: 0 表示不限 }
        collapsed: { type: boolean }
        archivedAt: { type: string, format: date-time }
        cardCount: { type: integer, description: 没归档的卡片数 }
    CreateBoard:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        icon: { type: string, maxLength: 16 }
        preset: { type: string, enum: [statuses, simple, empty], description: statuses 按 6 个状态建列表（默认）；simple 待处理、进行中、已完成；empty 不建列表 }
    UpdateBoard:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        icon: { type: string, maxLength: 16 }
        starred: { type: boolean }
        archived: { type: boolean }
        afterId: { type: integer, format: int64, description: 排序：放在这个看板后面，0 表示放到最前 }
    CreateBoardList:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        status: { $ref: "#/components/schemas/IssueStatus" }
    UpdateBoardList:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        status: { type: string, nullable: true, enum: [backlog, todo, in_progress, in_review, done, canceled, null], description: null 表示不对应状态 }
        color: { type: string, maxLength: 20 }
        wipLimit: { type: integer, minimum: 0, maximum: 999 }
        collapsed: { type: boolean }
        archived: { type: boolean }
        afterId: { type: integer, format: int64, description: 排序：放在这个列表后面，0 表示放到最前 }
    IssueActivity:
      type: object
      required: [id, at, actor, kind, data]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor: { type: string, description: me、agent:<id>、token:<名字>、automation:<id> }
        kind: { type: string, description: created、moved、status、archived、restored、members、copied、title、due }
        data: { type: object, additionalProperties: true }
    Comment:
      type: object
      required: [id, issueId, body, createdAt]
      properties:
        id: { type: integer, format: int64 }
        issueId: { type: integer, format: int64 }
        body: { type: string, description: Markdown }
        createdAt: { type: string, format: date-time }
    CreateComment:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1 }
    IssueLinkKind:
      type: string
      enum: [pull_request, coding_task, note, url]
    IssueLink:
      type: object
      required: [id, issueId, kind, title, url, ref, createdAt]
      properties:
        id: { type: integer, format: int64 }
        issueId: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/IssueLinkKind" }
        title: { type: string }
        url: { type: string, description: 绝对地址，或站内路径如 /notes/3 }
        ref: { type: string, description: 外部编号，例如 owner/repo#34 }
        createdAt: { type: string, format: date-time }
    CreateIssueLink:
      type: object
      required: [kind, url]
      properties:
        kind: { $ref: "#/components/schemas/IssueLinkKind" }
        title: { type: string }
        url: { type: string, minLength: 1 }
        ref: { type: string }
