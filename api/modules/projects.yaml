openapi: 3.0.3
info:
  title: X Console projects API (M5)
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      parameters:
        - name: archived
          in: query
          description: true 时只返回已归档的项目，默认只返回未归档的
          schema: { type: boolean }
      responses:
        "200":
          description: 项目列表，按名称排序
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: createProject
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProject" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      tags: [projects]
      responses:
        "200":
          description: 项目
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    patch:
      operationId: updateProject
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProject" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: archiveProject
      tags: [projects]
      description: 不会真的删除，只是归档。PATCH archived=false 可以恢复。
      responses:
        "204":
          description: 已归档
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /projects/{projectId}/issues:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: createIssue
      tags: [issues]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateIssue" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /projects/{projectId}/labels:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listLabels
      tags: [labels]
      description: 项目自己的标签加上全局标签
      responses:
        "200":
          description: 标签
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Label" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: createLabel
      tags: [labels]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLabel" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /projects/{projectId}/labels/{labelId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: labelId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: updateLabel
      tags: [labels]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateLabel" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteLabel
      tags: [labels]
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /projects/{projectId}/milestones:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listMilestones
      tags: [milestones]
      responses:
        "200":
          description: 里程碑，按截止日期排序
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Milestone" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: createMilestone
      tags: [milestones]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMilestone" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Milestone" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /projects/{projectId}/milestones/{milestoneId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: milestoneId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: updateMilestone
      tags: [milestones]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMilestone" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Milestone" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteMilestone
      tags: [milestones]
      description: 删除后，属于它的 Issue 不再有里程碑
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /issues:
    get:
      operationId: listIssues
      tags: [issues]
      description: |
        跨项目查询 Issue。不带 projectId 时不包含已归档项目的 Issue。
        due：today 今天到期；week 今天起 7 天内到期；overdue 已过期且未完成。日期按服务器时区算。
      parameters:
        - name: projectId
          in: query
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          description: 可以传多个
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/IssueStatus" }
        - name: priority
          in: query
          schema: { type: integer, minimum: 0, maximum: 4 }
        - name: labelId
          in: query
          schema: { type: integer, format: int64 }
        - name: milestoneId
          in: query
          schema: { type: integer, format: int64 }
        - name: due
          in: query
          schema:
            type: string
            enum: [today, week, overdue]
        - name: q
          in: query
          description: 按标题或 key 搜索
          schema: { type: string }
        - name: sort
          in: query
          description: updated 最近更新在前；priority 紧急在前、无优先级最后；due 截止日期近的在前；manual 看板顺序
          schema:
            type: string
            enum: [updated, priority, due, manual]
            default: updated
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - $ref: "../common.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: Issue 列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Issue" }
                  nextCursor: { type: string }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /issues/{key}:
    parameters:
      - $ref: "#/components/parameters/IssueKey"
    get:
      operationId: getIssue
      tags: [issues]
      responses:
        "200":
          description: Issue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    patch:
      operationId: updateIssue
      tags: [issues]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateIssue" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteIssue
      tags: [issues]
      description: 删除后编号不会再用
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /issues/{key}/move:
    parameters:
      - $ref: "#/components/parameters/IssueKey"
    post:
      operationId: moveIssue
      tags: [issues]
      description: 看板拖动。afterKey 是落点上方的 Issue，beforeKey 是落点下方的 Issue，都不传表示放到这一列最后。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveIssue" }
      responses:
        "200":
          description: 移动后的 Issue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /issues/{key}/comments:
    parameters:
      - $ref: "#/components/parameters/IssueKey"
    get:
      operationId: listComments
      tags: [issues]
      responses:
        "200":
          description: 评论，旧的在前
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Comment" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: createComment
      tags: [issues]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateComment" }
      responses:
        "201":
          description: 已添加
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /issues/{key}/comments/{commentId}:
    parameters:
      - $ref: "#/components/parameters/IssueKey"
      - name: commentId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: deleteComment
      tags: [issues]
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /issues/{key}/links:
    parameters:
      - $ref: "#/components/parameters/IssueKey"
    get:
      operationId: listLinks
      tags: [issues]
      responses:
        "200":
          description: 关联
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IssueLink" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: createLink
      tags: [issues]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateIssueLink" }
      responses:
        "201":
          description: 已添加
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueLink" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /issues/{key}/links/{linkId}:
    parameters:
      - $ref: "#/components/parameters/IssueKey"
      - name: linkId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: deleteLink
      tags: [issues]
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    IssueKey:
      name: key
      in: path
      required: true
      description: 例如 XC-12
      schema: { type: string }
  schemas:
    IssueStatus:
      type: string
      enum: [backlog, todo, in_progress, in_review, done, canceled]
    Project:
      type: object
      required: [id, key, name, description, color, icon, createdAt, updatedAt, issueCount, openCount]
      properties:
        id: { type: integer, format: int64 }
        key: { type: string, description: 2 到 5 个大写字母 }
        name: { type: string }
        description: { type: string }
        color: { type: string, description: 例如 "#cc7752"，空表示默认 }
        icon: { type: string, description: lucide 图标名，空表示默认 }
        archivedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        issueCount: { type: integer }
        openCount: { type: integer, description: 未完成也未取消的 Issue 数 }
    CreateProject:
      type: object
      required: [key, name]
      properties:
        key: { type: string, pattern: "^[A-Z]{2,5}$" }
        name: { type: string, minLength: 1 }
        description: { type: string }
        color: { type: string }
        icon: { type: string }
    UpdateProject:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        color: { type: string }
        icon: { type: string }
        archived: { type: boolean, description: false 表示恢复归档 }
    Label:
      type: object
      required: [id, name, color]
      properties:
        id: { type: integer, format: int64 }
        projectId: { type: integer, format: int64, description: 没有表示全局标签 }
        name: { type: string }
        color: { type: string }
    CreateLabel:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        color: { type: string }
        global: { type: boolean, description: true 表示所有项目都能用 }
    UpdateLabel:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        color: { type: string }
    Milestone:
      type: object
      required: [id, projectId, name, createdAt]
      properties:
        id: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        name: { type: string }
        dueDate: { type: string, format: date }
        createdAt: { type: string, format: date-time }
    CreateMilestone:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        dueDate: { type: string, format: date }
    UpdateMilestone:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        dueDate: { type: string, format: date, nullable: true, description: null 表示清除 }
    Issue:
      type: object
      required: [id, key, projectId, projectKey, number, title, description, status, priority, sortOrder, labels, externalSource, externalId, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        key: { type: string, description: 例如 XC-12 }
        projectId: { type: integer, format: int64 }
        projectKey: { type: string }
        number: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string, description: Markdown }
        status: { $ref: "#/components/schemas/IssueStatus" }
        priority: { type: integer, description: 0 无，1 紧急，2 高，3 中，4 低 }
        dueDate: { type: string, format: date }
        milestoneId: { type: integer, format: int64 }
        sortOrder: { type: number, format: double, description: 看板里同一列的顺序，小的在上 }
        labels:
          type: array
          items: { $ref: "#/components/schemas/Label" }
        externalSource: { type: string, description: 外部来源，例如 linear，空表示本地 }
        externalId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    CreateIssue:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        status: { $ref: "#/components/schemas/IssueStatus" }
        priority: { type: integer, minimum: 0, maximum: 4 }
        dueDate: { type: string, format: date }
        milestoneId: { type: integer, format: int64 }
        labelIds:
          type: array
          items: { type: integer, format: int64 }
    UpdateIssue:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        status: { $ref: "#/components/schemas/IssueStatus" }
        priority: { type: integer, minimum: 0, maximum: 4 }
        dueDate: { type: string, format: date, nullable: true, description: null 表示清除 }
        milestoneId: { type: integer, format: int64, nullable: true, description: null 表示清除 }
        labelIds:
          type: array
          description: 传了就整体替换
          items: { type: integer, format: int64 }
    MoveIssue:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/IssueStatus" }
        afterKey: { type: string, description: 落点上方的 Issue }
        beforeKey: { type: string, description: 落点下方的 Issue }
    Comment:
      type: object
      required: [id, issueId, body, createdAt]
      properties:
        id: { type: integer, format: int64 }
        issueId: { type: integer, format: int64 }
        body: { type: string, description: Markdown }
        createdAt: { type: string, format: date-time }
    CreateComment:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1 }
    IssueLinkKind:
      type: string
      enum: [pull_request, coding_task, note, url]
    IssueLink:
      type: object
      required: [id, issueId, kind, title, url, ref, createdAt]
      properties:
        id: { type: integer, format: int64 }
        issueId: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/IssueLinkKind" }
        title: { type: string }
        url: { type: string, description: 绝对地址，或站内路径如 /notes/3 }
        ref: { type: string, description: 外部编号，例如 owner/repo#34 }
        createdAt: { type: string, format: date-time }
    CreateIssueLink:
      type: object
      required: [kind, url]
      properties:
        kind: { $ref: "#/components/schemas/IssueLinkKind" }
        title: { type: string }
        url: { type: string, minLength: 1 }
        ref: { type: string }
