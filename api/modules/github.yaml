openapi: 3.0.3
info:
  title: X Console GitHub API (M13)
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /github/config:
    get:
      operationId: getGitHubConfig
      tags: [github]
      description: 当前配置。令牌只返回打码后的样子。
      responses:
        "200":
          description: 配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubConfig"
        default:
          $ref: "../common.yaml#/components/responses/Error"
    put:
      operationId: putGitHubConfig
      tags: [github]
      description: |
        保存配置。token 留空表示不改令牌；clearToken 为 true 时删除令牌。
        改令牌或 API 地址需要提升权限，只改仓库列表不需要。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubConfigInput"
      responses:
        "200":
          description: 保存后的配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubConfig"
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /github/test:
    post:
      operationId: testGitHub
      tags: [github]
      description: |
        用令牌读一次 /user。不带请求体时测试已保存的配置；
        带请求体时测试表单里的值，需要提升权限（可能用到已保存的令牌）。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubTestInput"
      responses:
        "200":
          description: 测试结果。令牌不对时 ok 为 false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubTestResult"
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /github/status:
    get:
      operationId: getGitHubStatus
      tags: [github]
      responses:
        "200":
          description: 最近一次同步的结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubStatus"
  /github/sync:
    post:
      operationId: syncGitHub
      tags: [github]
      description: 立即同步一次，等同步结束后返回状态。未配置时返回 412。
      responses:
        "200":
          description: 同步后的状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubStatus"
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /github/available-repos:
    get:
      operationId: listGitHubAvailableRepos
      tags: [github]
      description: |
        B35。令牌能访问的全部仓库（GET /user/repos 分页取全），按最近推送时间倒序。
        结果缓存 10 分钟，refresh=true 时重新取。没有令牌时回 412。
      parameters:
        - name: refresh
          in: query
          schema: { type: boolean }
        - name: connectionId
          in: query
          description: B70。列哪个 Git 账号能访问的仓库（GitHub 或 Forgejo）。不传时用旧的 github.connection_id
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 仓库列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubAvailableRepos" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /github/pulls:
    get:
      operationId: listGitHubPulls
      tags: [github]
      description: 缓存里打开的 PR，按仓库、更新时间排序。未配置时返回 412。
      parameters:
        - name: repo
          in: query
          schema: { type: string }
          description: 只看某个仓库，owner/name
        - $ref: "#/components/parameters/ConnectionQuery"
      responses:
        "200":
          description: PR
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GitHubPull" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /github/runs:
    get:
      operationId: listGitHubRuns
      tags: [github]
      description: 缓存里最近的 workflow runs，新的在前。未配置时返回 412。
      parameters:
        - name: repo
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/ConnectionQuery"
        - $ref: "../common.yaml#/components/parameters/Limit"
      responses:
        "200":
          description: 运行记录
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GitHubRun" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /github/issues:
    get:
      operationId: listGitHubIssues
      tags: [github]
      description: 关注仓库里分配给你或你创建的打开的 Issue。未配置时返回 412。
      parameters:
        - name: repo
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/ConnectionQuery"
      responses:
        "200":
          description: Issue
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GitHubIssue" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /github/repos:
    get:
      operationId: listGitHubWatchedRepos
      tags: [github]
      description: |
        B70。关注的仓库和它们的概况（从缓存出，不现查）。GitHub 和 Forgejo 的都在里面。
        未配置时返回 412。
      responses:
        "200":
          description: 关注的仓库
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WatchedRepo" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /github/commits:
    get:
      operationId: listGitHubCommits
      tags: [github]
      description: |
        B70。默认分支最近的提交，新的在前。不传 repo 时是所有关注仓库的提交按时间混排。
      parameters:
        - name: repo
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/ConnectionQuery"
        - $ref: "../common.yaml#/components/parameters/Limit"
      responses:
        "200":
          description: 提交
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GitHubCommit" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /github/runs/{runId}/jobs:
    get:
      operationId: listGitHubRunJobs
      tags: [github]
      description: |
        B70。一条运行的 job 和步骤。现查，结果在内存里缓存 5 秒。
        服务器不提供步骤详情时（老的 Forgejo）回 501。
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: repo
          in: query
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/ConnectionQuery"
      responses:
        "200":
          description: job 和步骤
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GitHubJob" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /github/notify:
    get:
      operationId: getGitHubNotify
      tags: [github]
      description: B71。仓库事件通知的设置。没保存过时返回默认值
      responses:
        "200":
          description: 通知设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubNotifySettings" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    put:
      operationId: putGitHubNotify
      tags: [github]
      description: B71。整份替换。repos 里没有的仓库跟随 defaults
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitHubNotifySettings" }
      responses:
        "200":
          description: 保存后的设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubNotifySettings" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /github/actions-usage:
    get:
      operationId: getGitHubActionsUsage
      tags: [github]
      description: |
        B109。本月 GitHub Actions 已用的分钟数（按系统倍数折算），结果缓存 10 分钟，refresh=true 时重新取。
        没有 GitHub 账号时回 412 github_not_configured；令牌没有账单读权限时回 403 github_billing_forbidden。
      parameters:
        - name: refresh
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: 本月用量
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubActionsUsage" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
components:
  parameters:
    ConnectionQuery:
      name: connectionId
      in: query
      description: B70。哪个 Git 账号。和 repo 一起定位一个仓库（GitHub 和 Forgejo 上可能有同名仓库）
      schema: { type: integer, format: int64 }
  schemas:
    Forge:
      type: string
      enum: [github, forgejo]
      description: B70。仓库在哪种服务上
    RepoWatch:
      type: object
      required: [connectionId, repo]
      properties:
        connectionId: { type: integer, format: int64 }
        repo: { type: string, description: owner/name }
    WatchedRepo:
      type: object
      required: [connectionId, forge, repo, url, defaultBranch, private, openPulls, openIssues, notifyCustom, notifyOff]
      properties:
        connectionId: { type: integer, format: int64 }
        connectionName: { type: string, description: Git 账号的名字 }
        forge: { $ref: "#/components/schemas/Forge" }
        repo: { type: string, description: owner/name }
        url: { type: string, description: 网页地址 }
        defaultBranch: { type: string }
        private: { type: boolean }
        description: { type: string }
        openPulls: { type: integer }
        openIssues: { type: integer }
        pushedAt: { type: string, format: date-time }
        ci:
          type: object
          description: 默认分支最新一条运行，没有运行时不返回
          required: [status, conclusion]
          properties:
            status: { type: string }
            conclusion: { type: string }
            runId: { type: integer, format: int64 }
            updatedAt: { type: string, format: date-time }
        lastCommit:
          type: object
          required: [sha, message, author, at]
          properties:
            sha: { type: string }
            message: { type: string, description: 第一行 }
            author: { type: string }
            at: { type: string, format: date-time }
        notifyCustom: { type: boolean, description: B71。这个仓库单独设置过通知 }
        notifyOff: { type: boolean, description: B71。单独设置成全部关闭 }
        syncError: { type: string, description: 这个仓库最近一次同步的错误，比如没有权限 }
    GitHubCommit:
      type: object
      required: [connectionId, forge, repo, sha, message, author, url, committedAt, checkState]
      properties:
        connectionId: { type: integer, format: int64 }
        forge: { $ref: "#/components/schemas/Forge" }
        repo: { type: string }
        sha: { type: string, description: 完整的 40 位 }
        message: { type: string, description: 完整的提交信息，前端只显示第一行 }
        author: { type: string, description: 用户名，没有时是 git 里的名字 }
        avatarUrl: { type: string }
        url: { type: string }
        committedAt: { type: string, format: date-time }
        checkState: { $ref: "#/components/schemas/GitHubCheckState" }
        runId: { type: integer, format: int64, description: 对上的那条运行，有时才返回 }
    GitHubStep:
      type: object
      required: [number, name, status, conclusion]
      properties:
        number: { type: integer }
        name: { type: string }
        status: { type: string, description: "queued、in_progress、completed" }
        conclusion: { type: string, description: "success、failure、skipped、cancelled，没结束时为空" }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    GitHubJob:
      type: object
      required: [id, name, status, conclusion, url, steps]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        status: { type: string }
        conclusion: { type: string }
        url: { type: string }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        steps:
          type: array
          items: { $ref: "#/components/schemas/GitHubStep" }
    RepoNotify:
      type: object
      required: [events, ciBranches]
      properties:
        events:
          type: array
          description: |
            开着的事件：ci_started、ci_succeeded、ci_failed、ci_cancelled、ci_recovered、push、
            pr_opened、pr_merged、pr_closed、pr_review、issue_opened、issue_assigned、release
          items: { type: string }
        ciBranches:
          type: string
          enum: [default, all]
          description: CI 事件看哪些分支。default 只看默认分支
    RepoNotifyOverride:
      type: object
      required: [connectionId, repo, notify]
      properties:
        connectionId: { type: integer, format: int64 }
        repo: { type: string }
        notify: { $ref: "#/components/schemas/RepoNotify" }
    GitHubActionsUsage:
      type: object
      required: [month, usedMinutes, includedMinutes, byOS, fetchedAt]
      properties:
        month: { type: string, description: "哪个月，UTC，例如 2026-10" }
        usedMinutes: { type: integer, description: 折算后的已用分钟数（Linux 1 倍，Windows 2 倍，macOS 10 倍） }
        includedMinutes: { type: integer, description: 每月免费分钟数。GitHub 没给时用设置里的值，默认 2000 }
        byOS:
          type: object
          required: [linux, windows, macos]
          description: 按系统分开的折算分钟数
          properties:
            linux: { type: integer }
            windows: { type: integer }
            macos: { type: integer }
        fetchedAt: { type: string, format: date-time, description: 什么时候从 GitHub 取的 }
    GitHubNotifySettings:
      type: object
      required: [defaults, repos]
      properties:
        defaults: { $ref: "#/components/schemas/RepoNotify" }
        repos:
          type: array
          items: { $ref: "#/components/schemas/RepoNotifyOverride" }
        ciQuota:
          type: boolean
          description: B109。本月 CI 时长用到 80% 和 100% 时各发一次通知。默认开；不传时保留原值
    GitHubConfig:
      type: object
      required: [hasToken, token, repos, apiUrl]
      properties:
        hasToken: { type: boolean }
        token: { type: string, description: 打码后的令牌，例如 ••••••••x9Qa }
        repos:
          type: array
          items: { type: string }
          description: 关注的仓库，owner/name
        apiUrl: { type: string, description: "REST API 地址，默认 https://api.github.com" }
        login: { type: string, description: 令牌对应的用户名，同步过才有 }
        connectionId:
          type: integer
          format: int64
          description: B62：GitHub 页面用哪个 Git 账号。B70 起改用 watches，这个字段只为兼容
        watches:
          type: array
          description: B70。关注的仓库，每个带 Git 账号。旧数据由后端换算成这个
          items: { $ref: "#/components/schemas/RepoWatch" }
        ciIncludedMinutes: { type: integer, description: B109。每月免费 CI 分钟数，默认 2000 }
    GitHubConfigInput:
      type: object
      properties:
        token: { type: string, deprecated: true, description: B62 起不用，令牌填在 Git 账号里。留空表示保留原令牌 }
        clearToken: { type: boolean, deprecated: true, description: B62 起不用 }
        repos:
          type: array
          maxItems: 50
          deprecated: true
          description: B70 起改传 watches
          items: { type: string }
        apiUrl: { type: string, deprecated: true, description: B62 起不用。留空表示用默认地址 }
        connectionId:
          type: integer
          format: int64
          deprecated: true
          description: B62：用哪个 Git 账号，只能是 GitHub 类型。传 0 表示不用 Git 账号。B70 起传 watches
        watches:
          type: array
          maxItems: 100
          description: B70。传了就以它为准，repos 和 connectionId 不再用
          items: { $ref: "#/components/schemas/RepoWatch" }
        ciIncludedMinutes:
          type: integer
          minimum: 1
          maximum: 1000000
          description: B109。每月免费 CI 分钟数。只传这一项时只改它，其他配置不动
    GitHubTestInput:
      type: object
      properties:
        token: { type: string, description: 留空表示用已保存的令牌 }
        apiUrl: { type: string }
    GitHubTestResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        message: { type: string, description: 失败原因，给人看 }
        login: { type: string }
        rateLimitRemaining: { type: integer }
    GitHubAvailableRepos:
      type: object
      required: [repos, fetchedAt]
      properties:
        fetchedAt: { type: string, format: date-time, description: 这份列表是什么时候从 GitHub 取的 }
        repos:
          type: array
          items:
            type: object
            required: [fullName, private]
            properties:
              fullName: { type: string, description: owner/name }
              private: { type: boolean }
              description: { type: string }
              pushedAt: { type: string, format: date-time }
    GitHubStatus:
      type: object
      required: [configured, syncing, repoCount]
      properties:
        configured: { type: boolean }
        syncing: { type: boolean }
        repoCount: { type: integer }
        login: { type: string }
        lastSyncAt: { type: string, format: date-time }
        lastError: { type: string, description: 最近一次同步的错误，成功时为空 }
        rateLimitRemaining: { type: integer }
        rateLimitResetAt: { type: string, format: date-time }
        rateLimitLimit: { type: integer, description: B35。每小时的总额度，一般是 5000 }
        syncIntervalSeconds: { type: integer, description: B35。现在的同步间隔。平时 60，剩余额度不足 10% 时 300 }
    GitHubReviewState:
      type: string
      enum: [approved, changes_requested, pending, commented, none]
      description: pending 表示请了评审但还没人评
    GitHubCheckState:
      type: string
      enum: [success, failure, pending, none]
    GitHubPull:
      type: object
      required: [repo, number, title, author, url, headRef, baseRef, draft, state, reviewState, checkState, issueKeys, createdAt, updatedAt]
      properties:
        connectionId: { type: integer, format: int64, description: B70。哪个 Git 账号 }
        forge: { $ref: "#/components/schemas/Forge" }
        repo: { type: string }
        number: { type: integer }
        title: { type: string }
        author: { type: string }
        url: { type: string }
        headRef: { type: string }
        baseRef: { type: string }
        draft: { type: boolean }
        state: { type: string, enum: [open, closed, merged] }
        reviewState: { $ref: "#/components/schemas/GitHubReviewState" }
        checkState: { $ref: "#/components/schemas/GitHubCheckState" }
        issueKeys:
          type: array
          items: { type: string }
          description: 标题或分支里出现、并已关联的本地 Issue，例如 XC-12
        codingTaskId:
          type: integer
          format: int64
          description: 分支是 xc/<任务id>-... 时对应的编码任务
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GitHubRun:
      type: object
      required: [id, repo, name, branch, event, status, conclusion, url, defaultBranch, createdAt, updatedAt]
      properties:
        connectionId: { type: integer, format: int64, description: B70。哪个 Git 账号 }
        forge: { $ref: "#/components/schemas/Forge" }
        id: { type: integer, format: int64 }
        repo: { type: string }
        name: { type: string }
        branch: { type: string }
        event: { type: string }
        status: { type: string, description: "queued、in_progress、completed 等" }
        conclusion: { type: string, description: "success、failure、cancelled 等，没结束时为空" }
        url: { type: string }
        defaultBranch: { type: boolean, description: 是否在默认分支上 }
        headSha: { type: string, description: B70。这条运行对应的提交 }
        stepsDone: { type: integer, description: B70。进行中的运行做完了几步（所有 job 加起来） }
        stepsTotal: { type: integer, description: B70。进行中的运行一共几步 }
        currentStep: { type: string, description: B70。进行中的运行正在跑的步骤名 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GitHubIssueRelation:
      type: string
      enum: [assigned, created, both]
    GitHubIssue:
      type: object
      required: [repo, number, title, url, author, assignees, labels, relation, createdAt, updatedAt]
      properties:
        connectionId: { type: integer, format: int64, description: B70。哪个 Git 账号 }
        forge: { $ref: "#/components/schemas/Forge" }
        repo: { type: string }
        number: { type: integer }
        title: { type: string }
        url: { type: string }
        author: { type: string }
        assignees:
          type: array
          items: { type: string }
        labels:
          type: array
          items: { type: string }
        relation: { $ref: "#/components/schemas/GitHubIssueRelation" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
