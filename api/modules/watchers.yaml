openapi: 3.0.3
info:
  title: X Console watchers (B206)
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /watchers:
    get:
      operationId: listWatchers
      tags: [watchers]
      responses:
        "200":
          description: 全部网站自动化任务，按创建时间
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Watcher" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: createWatcher
      tags: [watchers]
      description: 新建任务。带登录资料或出口代理时需要提升权限。建好后马上开始第一次摸索。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatcherInput" }
      responses:
        "201":
          description: 新任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Watcher" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /watchers/status:
    get:
      operationId: getWatchersStatus
      tags: [watchers]
      description: 浏览器能不能用，AI 能不能用，今天花了多少。
      responses:
        "200":
          description: 状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchersStatus" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /watchers/settings:
    get:
      operationId: getWatchersSettings
      tags: [watchers]
      responses:
        "200":
          description: 设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchersSettings" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    put:
      operationId: putWatchersSettings
      tags: [watchers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatchersSettings" }
      responses:
        "200":
          description: 保存后的设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchersSettings" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /watchers/shots/{shotId}:
    parameters:
      - name: shotId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getWatcherShot
      tags: [watchers]
      description: 一张截图（JPEG）。
      responses:
        "200":
          description: 截图
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /watchers/{watcherId}:
    parameters:
      - $ref: "#/components/parameters/WatcherId"
    get:
      operationId: getWatcher
      tags: [watchers]
      responses:
        "200":
          description: 任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatcherDetail" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    patch:
      operationId: updateWatcher
      tags: [watchers]
      description: 改任务。改登录资料或出口代理时需要提升权限。改了网址或目标时，下次检查前重新摸索。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatcherPatch" }
      responses:
        "200":
          description: 改后的任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Watcher" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteWatcher
      tags: [watchers]
      description: 删除任务、历史和截图，也删掉保存的登录状态。
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /watchers/{watcherId}/run:
    parameters:
      - $ref: "#/components/parameters/WatcherId"
    post:
      operationId: runWatcher
      tags: [watchers]
      description: |
        立即跑一次。check 按记下的步骤检查（没有步骤时等于 explore），explore 让 AI 重新摸索，
        manual 打开浏览器交给用户（比如第一次扫码登录），用户点“我弄好了”后保存登录状态。
        任务正在跑时回 409。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [check, explore, manual] }
      responses:
        "202":
          description: 已开始
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /watchers/{watcherId}/runs:
    parameters:
      - $ref: "#/components/parameters/WatcherId"
    get:
      operationId: listWatcherRuns
      tags: [watchers]
      description: B234：检查记录分页。按编号从新到旧，before 不填从最新开始，limit 默认 10，最多 50。
      parameters:
        - name: before
          in: query
          description: 只要编号小于它的运行
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, default: 10, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: 一页检查记录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatcherRunPage" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /watchers/{watcherId}/runs/{runId}/shots:
    parameters:
      - $ref: "#/components/parameters/WatcherId"
      - name: runId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: deleteWatcherRunShots
      tags: [watchers]
      description: |
        B234：删一次运行的全部截图，包括变化记录用到的那张。运行记录和变化记录里对应的截图编号一起去掉。
        运行不属于这个任务时回 404，运行还没结束时回 409。不需要提升权限。
      responses:
        "200":
          description: 删了多少
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatcherShotsDeleted" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /watchers/{watcherId}/shots/cleanup:
    parameters:
      - $ref: "#/components/parameters/WatcherId"
    post:
      operationId: cleanupWatcherShots
      tags: [watchers]
      description: |
        B234：清理截图。latest 留下最近一次成功的运行（same、changed、ok）的截图和变化记录用到的截图，其他全删；
        none 全删，变化记录的截图也删。正在跑的那次运行的截图不动。不需要提升权限。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keep]
              properties:
                keep: { type: string, enum: [latest, none] }
      responses:
        "200":
          description: 删了多少
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatcherShotsDeleted" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /watchers/{watcherId}/answer:
    parameters:
      - $ref: "#/components/parameters/WatcherId"
    post:
      operationId: answerWatcher
      tags: [watchers]
      description: |
        回答任务正在等的事。done 是验证码、扫码或手动登录弄好了；approve 和 deny 是批准或拒绝点一个可能改数据的按钮；
        cancel 是不处理了，这次检查结束。没有在等时回 409。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { type: string, enum: [done, approve, deny, cancel] }
      responses:
        "204":
          description: 已回答
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /watchers/{watcherId}/live:
    parameters:
      - $ref: "#/components/parameters/WatcherId"
    get:
      operationId: openWatcherLive
      tags: [watchers]
      description: |
        WebSocket 人工接管。需要提升权限，在升级之前检查。任务没有打开的浏览器时回 409。
        服务端发二进制帧（页面的 JPEG 画面）和文本帧 JSON {"type":"frame","width":1280,"height":900}（紧跟在画面后面，说明坐标范围）、
        {"type":"closed"}（浏览器关了）。客户端发文本帧 JSON：
        {"type":"click|down|move|drag|up","x":..,"y":..}、{"type":"wheel","x":..,"y":..,"deltaY":..}、
        {"type":"text","text":"..."}、{"type":"key","key":"Enter|Tab|Backspace|Escape|ArrowDown|ArrowUp"}。
      responses:
        "101":
          description: 升级为 WebSocket
        default:
          $ref: "../common.yaml#/components/responses/Error"
components:
  parameters:
    WatcherId:
      name: watcherId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    WatcherStatus:
      type: string
      description: |
        new 还没跑过；exploring AI 在摸索；checking 在检查；ok 正常；waiting 等你处理（验证码、扫码、批准）；
        login 需要登录（等了没人处理）；error 出错；paused 已暂停。
      enum: [new, exploring, checking, ok, waiting, login, error, paused]
    WatcherMode:
      type: string
      description: replay 是 AI 记下步骤后平时回放，ai 是每次都让 AI 看。
      enum: [replay, ai]
    WatcherPending:
      type: object
      required: [kind, message, since]
      properties:
        kind:
          type: string
          description: captcha 验证码、短信或扫码；approve 要批准点一个按钮；manual 用户自己操作；stuck AI 卡住了要用户帮忙
          enum: [captcha, approve, manual, stuck]
        message: { type: string }
        since: { type: string, format: date-time }
        live: { type: boolean, description: 浏览器还开着，可以接管 }
    WatcherKind:
      type: string
      description: web 是网页（B206），x 是 X 上的账号、搜索或推文回复（B207）。
      enum: [web, x]
    Watcher:
      type: object
      required:
        [id, kind, name, url, goal, allowedHosts, intervalMinutes, keepaliveMinutes, mode, enabled, status, statusDetail,
         currentValue, hasLogin, hasProxy, hasRecipe, createdAt]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/WatcherKind" }
        name: { type: string }
        url: { type: string, description: 网页地址；X 是账号、搜索或推文的 x.com 地址 }
        goal: { type: string, description: 要 AI 做什么，可以为空。为空就只监测，AI 自己判断盯什么；X 是过滤条件 }
        allowedHosts: { type: array, items: { type: string } }
        intervalMinutes: { type: integer }
        keepaliveMinutes: { type: integer, description: 0 是不保活 }
        activeFrom:
          type: string
          description: B236。每天几点开始检查（HH:MM，服务器时区）。和 activeTo 一起填，都空表示全天检查。时段外不检查，也不发提醒。手动“立即检查”不受限
        activeTo:
          type: string
          description: B236。每天几点停止检查。比 activeFrom 小表示跨午夜，例如 22:00 到 06:00。不能等于 activeFrom
        activeDays:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
          description: B236。哪几天检查，1 是周一，7 是周日。空表示每天。跨午夜的时段按开始那天算
        mode: { $ref: "#/components/schemas/WatcherMode" }
        enabled: { type: boolean }
        status: { $ref: "#/components/schemas/WatcherStatus" }
        statusDetail: { type: string }
        currentValue: { type: string }
        hasLogin: { type: boolean, description: 存了用户名和密码 }
        hasProxy: { type: boolean }
        egressAgentId: { type: string, description: B208：经过这台已连接的机器上网，没选时不给 }
        hasRecipe: { type: boolean, description: 已经记下了步骤 }
        pending: { $ref: "#/components/schemas/WatcherPending" }
        lastCheckedAt: { type: string, format: date-time }
        lastChangeAt: { type: string, format: date-time }
        nextCheckAt: { type: string, format: date-time }
        spent30d: { type: number, format: double, description: 最近 30 天的 AI 花费（美元） }
        lastChange: { $ref: "#/components/schemas/WatcherLastChange" }
        createdAt: { type: string, format: date-time }
    WatcherLastChange:
      type: object
      description: B234：最近一条变化记录。没有变化记录时 Watcher 不给这个字段。
      required: [summary, important, createdAt]
      properties:
        summary: { type: string }
        important: { type: boolean }
        createdAt: { type: string, format: date-time }
    WatcherRunPage:
      type: object
      required: [items, hasMore]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/WatcherRun" } }
        hasMore: { type: boolean, description: 还有更早的运行 }
    WatcherShotsDeleted:
      type: object
      required: [deleted, bytes]
      properties:
        deleted: { type: integer, description: 删了几张 }
        bytes: { type: integer, format: int64, description: 腾出多少字节 }
    WatcherShotsUsage:
      type: object
      required: [count, bytes]
      properties:
        count: { type: integer }
        bytes: { type: integer, format: int64 }
    WatcherInput:
      type: object
      description: kind 可以不填，不填时按 url 认。@ 开头或 x.com、twitter.com 的链接是 x，其他 http:// 或 https:// 网址是 web，不含 . 和 / 的文字是 x 的搜索词，都不是就报错。
      required: [name, url, goal]
      properties:
        kind: { $ref: "#/components/schemas/WatcherKind" }
        name: { type: string }
        url: { type: string, description: X 可以写 @账号、账号或推文的链接、搜索词 }
        goal: { type: string, description: 要 AI 做什么，可以不填。不填就只监测，AI 自己判断盯什么；X 是过滤条件 }
        allowedHosts: { type: array, items: { type: string }, description: 不填就用网址的域名 }
        intervalMinutes: { type: integer, description: 默认 60，最少 15 }
        keepaliveMinutes: { type: integer, description: 0 是不保活，最少 5 }
        activeFrom:
          type: string
          description: B236。每天几点开始检查（HH:MM，服务器时区）。和 activeTo 一起填，都空表示全天检查。时段外不检查，也不发提醒。手动“立即检查”不受限
        activeTo:
          type: string
          description: B236。每天几点停止检查。比 activeFrom 小表示跨午夜，例如 22:00 到 06:00。不能等于 activeFrom
        activeDays:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
          description: B236。哪几天检查，1 是周一，7 是周日。空表示每天。跨午夜的时段按开始那天算
        mode: { $ref: "#/components/schemas/WatcherMode" }
        proxy: { type: string, description: 出口代理，http://、https:// 或 socks5://，可带用户名密码 }
        egressAgentId: { type: string, description: B208：经过这台已连接的机器上网，和 proxy 只能填一个 }
        username: { type: string }
        password: { type: string }
    WatcherPatch:
      type: object
      properties:
        name: { type: string }
        url: { type: string }
        goal: { type: string }
        allowedHosts: { type: array, items: { type: string } }
        intervalMinutes: { type: integer }
        keepaliveMinutes: { type: integer }
        activeFrom:
          type: string
          description: B236。每天几点开始检查（HH:MM，服务器时区）。和 activeTo 一起填，都空表示全天检查。时段外不检查，也不发提醒。手动“立即检查”不受限
        activeTo:
          type: string
          description: B236。每天几点停止检查。比 activeFrom 小表示跨午夜，例如 22:00 到 06:00。不能等于 activeFrom
        activeDays:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
          description: B236。哪几天检查，1 是周一，7 是周日。空表示每天。跨午夜的时段按开始那天算
        mode: { $ref: "#/components/schemas/WatcherMode" }
        enabled: { type: boolean }
        proxy: { type: string, description: 空字符串是去掉代理 }
        egressAgentId: { type: string, description: B208：空字符串是去掉；填了会清掉代理，和 proxy 只能填一个 }
        username: { type: string }
        password: { type: string }
        clearLogin: { type: boolean, description: 删掉存的用户名、密码和登录状态 }
    WatcherChange:
      type: object
      required: [id, oldValue, newValue, summary, important, createdAt]
      properties:
        id: { type: integer, format: int64 }
        oldValue: { type: string }
        newValue: { type: string }
        summary: { type: string }
        important: { type: boolean }
        shotId: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
    WatcherStep:
      type: object
      required: [at, text]
      properties:
        at: { type: string, format: date-time }
        text: { type: string }
        shotId: { type: integer, format: int64 }
    WatcherRun:
      type: object
      required: [id, kind, startedAt, outcome, detail, steps, tokens]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [check, explore, manual, keepalive] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        outcome:
          type: string
          description: running 还在跑；same 没变化；changed 有变化；ok 完成；failed 失败；cancelled 取消
          enum: [running, same, changed, ok, failed, cancelled]
        detail: { type: string }
        steps: { type: array, items: { $ref: "#/components/schemas/WatcherStep" } }
        tokens: { type: integer, format: int64 }
    WatcherRecipeStep:
      type: object
      required: [text]
      properties:
        text: { type: string, description: 给人看的一句话 }
    WatcherDetail:
      allOf:
        - $ref: "#/components/schemas/Watcher"
        - type: object
          required: [changes, runs, recipe, shots]
          properties:
            shots: { $ref: "#/components/schemas/WatcherShotsUsage" }
            changes: { type: array, items: { $ref: "#/components/schemas/WatcherChange" }, description: 最近 50 条 }
            runs: { type: array, items: { $ref: "#/components/schemas/WatcherRun" }, description: 最近 20 次 }
            recipe: { type: array, items: { $ref: "#/components/schemas/WatcherRecipeStep" } }
            targetNote: { type: string, description: 要盯的内容在哪 }
    WatchersStatus:
      type: object
      required: [browser, browserConfigured, ai, x, spentToday, budgetUsd]
      properties:
        browser: { type: boolean, description: 浏览器连得上 }
        browserConfigured: { type: boolean }
        browserError: { type: string }
        ai: { type: boolean, description: 配了 AI 模型 }
        x: { type: boolean, description: 存了 X 的登录 Cookie，而且没有过期 }
        spentToday: { type: number, format: double }
        budgetUsd: { type: number, format: double }
    WatchersSettings:
      type: object
      required: [budgetUsd, dangerWords]
      properties:
        budgetUsd: { type: number, format: double, description: 每天 AI 花费上限（美元），0 是不用 AI }
        dangerWords: { type: array, items: { type: string }, description: 按钮上有这些字时，点之前要批准 }
        xQueryIds:
          type: object
          additionalProperties: { type: string }
          description: X 网页接口的 queryId，键是 UserByScreenName、UserTweets、SearchTimeline、TweetDetail。X 改版后要换。不填用默认值。
        agentModel:
          type: string
          description: 操作网页的模型（B212），格式是 <供应商 id>:<模型 id>。AI 摸索、每次都让 AI 看、读验证码用。空字符串是跟随 设置 → AI 的 Agent 模型。不带这个字段时不改。
        agentEffort:
          $ref: "#/components/schemas/WatcherEffort"
        judgeModel:
          type: string
          description: 判断变化的模型（B212）。判断变化重不重要、筛选 X 推文用。空字符串是跟随快速模型。不带这个字段时不改。
        judgeEffort:
          $ref: "#/components/schemas/WatcherEffort"
    WatcherEffort:
      type: string
      enum: ["", "off", "low", "medium", "high"]
      description: 思考程度。空字符串是跟随 设置 → AI。
