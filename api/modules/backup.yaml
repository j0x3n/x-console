openapi: 3.0.3
info:
  title: X Console backup API (B25)
  version: 0.1.0
  description: |
    整站导出、导入和自动备份。备份包是 .tar.gz：数据库的一致副本（VACUUM INTO）、
    files/ 下的全部文件、manifest.json。令牌和密钥在包里仍是加密的，要同一个主密钥才能解开。
servers:
  - url: /api/v1
paths:
  /backups:
    get:
      operationId: listBackups
      tags: [backup]
      responses:
        "200":
          description: 本机和 S3 上的备份，新的在前
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Backup" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /backups/export:
    post:
      operationId: exportBackup
      tags: [backup]
      description: 开始导出一份。要提升权限。后台进行，进度看 GET /backups/job。同时只能有一个导出或恢复，否则 409
      responses:
        "202":
          description: 已开始
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupJob" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /backups/job:
    get:
      operationId: getBackupJob
      tags: [backup]
      responses:
        "200":
          description: 最近一次导出或恢复的状态。没有过任务时 state 是 idle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupJob" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /backups/{backupId}/download:
    parameters:
      - $ref: "#/components/parameters/BackupId"
    get:
      operationId: downloadBackup
      tags: [backup]
      description: 下载备份文件。要提升权限（提升后 15 分钟内有效）。S3 上的备份由服务端转发，不暴露 S3 地址
      responses:
        "200":
          description: 备份文件
          content:
            application/gzip:
              schema: { type: string, format: binary }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /backups/{backupId}:
    parameters:
      - $ref: "#/components/parameters/BackupId"
    delete:
      operationId: deleteBackup
      tags: [backup]
      description: 删除一份备份。要提升权限
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /backups/{backupId}/restore:
    parameters:
      - $ref: "#/components/parameters/BackupId"
    post:
      operationId: restoreBackup
      tags: [backup]
      description: |
        用列表里的一份备份恢复全部数据。要提升权限，并且 confirm 必须是“恢复”。
        先校验 manifest，版本比当前新时回 400。恢复前自动再备份一次当前数据（kind=pre-restore）。
        后台进行，完成后服务重新加载数据，前端收到 backup.restored 事件后刷新页面
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestoreInput" }
      responses:
        "202":
          description: 已开始
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupJob" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /backups/upload:
    post:
      operationId: uploadBackup
      tags: [backup]
      description: 上传一个备份包，存到本机备份目录，出现在列表里（kind=uploaded）。之后用 /backups/{id}/restore 恢复。要提升权限。最大 20 GB
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: 已上传并校验过 manifest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /backups/settings:
    get:
      operationId: getBackupSettings
      tags: [backup]
      responses:
        "200":
          description: 自动备份设置。不返回 S3 密钥
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupSettings" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    put:
      operationId: putBackupSettings
      tags: [backup]
      description: 要提升权限
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupSettingsInput" }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupSettings" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /backups/target/test:
    post:
      operationId: testBackupTarget
      tags: [backup]
      description: |
        用请求体里的设置（结构和保存时一样，没传的字段用已保存的）试一次备份位置：
        建目录、写一个小文件、读回来、删掉。不保存设置。要提升权限
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupSettingsInput" }
      responses:
        "200":
          description: 测试结果。连不上时 ok 是 false，message 写原因
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupTargetTest" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /backups/gdrive/auth:
    get:
      operationId: startGdriveAuth
      tags: [backup]
      description: |
        返回 Google 授权页的地址，前端跳过去。要先保存客户端 ID 和密钥。要提升权限。
        地址里的 state 是一次性的，10 分钟内有效
      responses:
        "200":
          description: 授权地址
          content:
            application/json:
              schema:
                type: object
                required: [url, redirectUri]
                properties:
                  url: { type: string }
                  redirectUri: { type: string, description: 这次用的重定向地址，要和 Google 里填的一样 }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: revokeGdriveAuth
      tags: [backup]
      description: 撤销 Google Drive 授权：通知 Google 作废令牌，删掉本地保存的令牌。要提升权限
      responses:
        "204":
          description: 已撤销
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /backups/gdrive/callback:
    get:
      operationId: gdriveCallback
      tags: [backup]
      description: |
        Google 授权完跳回来的地址，不用登录，靠 state 校验。用 code 换令牌并保存，
        然后跳到 /settings/backup?gdrive=ok，失败时跳到 /settings/backup?gdrive=error&message=原因
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302":
          description: 跳回设置页
  /remote-drives:
    get:
      operationId: listRemoteDrives
      tags: [backup]
      description: B68。备份设置里绑定了的网盘，云盘页给每个显示一个标签。锁定时被隐藏的不返回
      responses:
        "200":
          description: 网盘列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RemoteDrive" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /remote-drives/{remote}/items:
    parameters:
      - $ref: "#/components/parameters/Remote"
    get:
      operationId: listRemoteDriveItems
      tags: [backup]
      description: B68。列网盘里的一个文件夹，文件夹在前
      parameters:
        - name: ref
          in: query
          description: 文件夹的位置。WebDAV 是路径，Google Drive 是文件夹 id，不传表示根目录
          schema: { type: string }
      responses:
        "200":
          description: 文件夹内容
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteDriveListing" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /remote-drives/{remote}/download:
    parameters:
      - $ref: "#/components/parameters/Remote"
    get:
      operationId: downloadRemoteDriveFile
      tags: [backup]
      description: B68。下载网盘里的一个文件，服务端转发
      parameters:
        - name: ref
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 文件内容
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /backups/run:
    post:
      operationId: runBackupNow
      tags: [backup]
      description: 按自动备份的设置立刻备份一次（传到 S3）。和导出一样在后台进行，进度看 /backups/job
      responses:
        "202":
          description: 已开始
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupJob" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
components:
  parameters:
    BackupId:
      name: backupId
      in: path
      required: true
      description: 备份文件名，比如 x-console-20260928-0300-sha-8fed186.tar.gz
      schema: { type: string }
    Remote:
      name: remote
      in: path
      required: true
      schema:
        type: string
        enum: [webdav, gdrive]
  schemas:
    RemoteDrive:
      type: object
      required: [id, name, limited]
      properties:
        id:
          type: string
          enum: [webdav, gdrive]
        name: { type: string, description: 标签上的名字，比如“坚果云”“Google Drive” }
        account: { type: string }
        limited: { type: boolean, description: Google Drive 授权里没有只读权限，只能看到面板自己建的文件，要重新授权 }
    RemoteDriveEntry:
      type: object
      required: [ref, name, isDir, downloadable]
      properties:
        ref: { type: string }
        name: { type: string }
        isDir: { type: boolean }
        size: { type: integer, format: int64 }
        modifiedAt: { type: string, format: date-time }
        downloadable: { type: boolean, description: Google 文档这类在线文件是 false }
    RemoteDriveListing:
      type: object
      required: [ref, trail, items]
      properties:
        ref: { type: string }
        trail:
          type: array
          description: 从根目录下面一级到当前文件夹，用来显示路径
          items:
            type: object
            required: [ref, name]
            properties:
              ref: { type: string }
              name: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/RemoteDriveEntry" }
    Backup:
      type: object
      required: [id, name, createdAt, sizeBytes, location, kind]
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        sizeBytes: { type: integer, format: int64 }
        location:
          type: string
          enum: [local, s3, webdav, gdrive]
        kind:
          type: string
          description: manual 手动导出；auto 自动备份；pre-restore 恢复前自动备份；uploaded 上传的
          enum: [manual, auto, pre-restore, uploaded]
        version: { type: string, description: 导出时的程序版本 }
        files: { type: integer, format: int64, description: 包里的文件数 }
    BackupJob:
      type: object
      required: [state]
      properties:
        kind:
          type: string
          enum: [export, restore, auto]
        state:
          type: string
          enum: [idle, running, done, failed]
        step: { type: string, description: 现在在做什么，中文，比如“正在打包文件（120/800）” }
        doneBytes: { type: integer, format: int64 }
        totalBytes: { type: integer, format: int64 }
        backupId: { type: string, description: 导出完成后生成的备份 }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        error: { type: string }
        secretsUnreadable:
          type: array
          description: 恢复后解不开的设置（主密钥不同），比如 github.token。用户要重新填写
          items: { type: string }
    RestoreInput:
      type: object
      required: [confirm]
      properties:
        confirm: { type: string, description: 必须是“恢复” }
    BackupSettings:
      type: object
      required: [enabled, frequency, time, weekday, keep, target, lastRuns]
      properties:
        enabled: { type: boolean }
        frequency:
          type: string
          enum: [daily, weekly]
        time: { type: string, description: 每天几点，HH:MM，服务器时区。默认 03:00 }
        weekday: { type: integer, minimum: 0, maximum: 6, description: 每周备份时是周几，0 是周日 }
        keep: { type: integer, minimum: 1, maximum: 365, description: S3 上保留几份，默认 14 }
        target:
          type: string
          enum: [storage, custom, webdav, gdrive]
          description: |
            storage 用“存储”里的 S3 配置（放在 backups/ 前缀下）；custom 用下面单独的 S3；
            webdav 用下面的 WebDAV；gdrive 用下面的 Google Drive（B63）
        s3:
          $ref: "storage.yaml#/components/schemas/StorageS3"
        webdav: { $ref: "#/components/schemas/BackupWebdav" }
        gdrive: { $ref: "#/components/schemas/BackupGdrive" }
        nextRunAt: { type: string, format: date-time }
        lastRuns:
          type: array
          description: 最近 10 次自动备份的结果，新的在前
          items:
            type: object
            required: [at, ok]
            properties:
              at: { type: string, format: date-time }
              ok: { type: boolean }
              backupId: { type: string }
              sizeBytes: { type: integer, format: int64 }
              error: { type: string }
    BackupSettingsInput:
      type: object
      properties:
        enabled: { type: boolean }
        frequency:
          type: string
          enum: [daily, weekly]
        time: { type: string }
        weekday: { type: integer, minimum: 0, maximum: 6 }
        keep: { type: integer, minimum: 1, maximum: 365 }
        target:
          type: string
          enum: [storage, custom, webdav, gdrive]
        s3:
          $ref: "storage.yaml#/components/schemas/StorageS3Input"
        webdav: { $ref: "#/components/schemas/BackupWebdavInput" }
        gdrive: { $ref: "#/components/schemas/BackupGdriveInput" }
    BackupWebdav:
      type: object
      required: [url, username, folder, passwordSet]
      properties:
        url: { type: string, description: 比如 https://dav.jianguoyun.com/dav/ }
        username: { type: string }
        folder: { type: string, description: 备份放在这个目录下，默认 x-console-backups }
        passwordSet: { type: boolean, description: 已经保存过密码 }
    BackupWebdavInput:
      type: object
      properties:
        url: { type: string }
        username: { type: string }
        password: { type: string, description: 不传或传空表示不改 }
        folder: { type: string }
    BackupGdrive:
      type: object
      required: [clientId, folderName, secretSet, authorized]
      properties:
        clientId: { type: string }
        folderName: { type: string, description: 网盘根目录下的文件夹，默认“X Console 备份” }
        secretSet: { type: boolean, description: 已经保存过客户端密钥 }
        authorized: { type: boolean, description: 已经授权，有长期令牌 }
        account: { type: string, description: 授权的 Google 账号邮箱 }
    BackupGdriveInput:
      type: object
      properties:
        clientId: { type: string, description: 改了客户端 ID 会清掉原来的授权 }
        clientSecret: { type: string, description: 不传或传空表示不改 }
        folderName: { type: string, description: 改了文件夹名，下次备份时按新名字找或新建文件夹 }
    BackupTargetTest:
      type: object
      required: [ok, message]
      properties:
        ok: { type: boolean }
        message: { type: string }
