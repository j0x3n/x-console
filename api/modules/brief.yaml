openapi: 3.0.3
info:
  title: X Console daily brief and weather (M11)
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /briefs:
    get:
      operationId: listBriefs
      tags: [brief]
      parameters:
        - $ref: "../common.yaml#/components/parameters/Limit"
        - $ref: "../common.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: 历史早报，新的在前
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Brief" }
                  nextCursor: { type: string }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /briefs/generate:
    post:
      operationId: generateBrief
      tags: [brief]
      description: 立即按当前设置生成今天的早报。send 为 false 时只预览，不保存；为 true 时保存为今天的早报并发送。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                send: { type: boolean }
      responses:
        "200":
          description: 生成的早报
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Brief" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /briefs/settings:
    get:
      operationId: getBriefSettings
      tags: [brief]
      responses:
        "200":
          description: 早报设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BriefSettingsView" }
    put:
      operationId: putBriefSettings
      tags: [brief]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BriefSettings" }
      responses:
        "200":
          description: 保存后的设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BriefSettingsView" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /briefs/{date}:
    parameters:
      - name: date
        in: path
        required: true
        description: YYYY-MM-DD
        schema: { type: string }
    get:
      operationId: getBrief
      tags: [brief]
      responses:
        "200":
          description: 这一天的早报
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Brief" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /weather:
    get:
      operationId: getWeather
      tags: [brief]
      description: 当前天气和今天的预报（Open-Meteo）。不传经纬度时用早报设置里的位置，没设置位置时返回 412。结果缓存 10 分钟。refresh=true 时跳过缓存重新拉取（B23），同一位置 1 分钟内最多真正拉一次，其余返回缓存。
      parameters:
        - name: refresh
          in: query
          schema: { type: boolean }
        - name: lat
          in: query
          schema: { type: number, format: double }
        - name: lon
          in: query
          schema: { type: number, format: double }
      responses:
        "200":
          description: 天气
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Weather" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /weather/places:
    get:
      operationId: searchWeatherPlaces
      tags: [brief]
      description: 按名字搜城市，用 Open-Meteo 的地名接口。
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 60 }
      responses:
        "200":
          description: 最多 8 个结果
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WeatherPlace" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /weather/alert:
    get:
      operationId: getRainAlert
      tags: [brief]
      responses:
        "200":
          description: 降雨提醒设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RainAlert" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    put:
      operationId: putRainAlert
      tags: [brief]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RainAlert" }
      responses:
        "200":
          description: 保存后的设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RainAlert" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /weather/qweather:
    get:
      operationId: getQWeatherConfig
      tags: [brief]
      description: B58。和风天气的配置。不返回 key 本身，只说有没有填。
      responses:
        "200":
          description: 配置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QWeatherConfig" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    put:
      operationId: putQWeatherConfig
      tags: [brief]
      description: B58。保存和风天气的配置。apiKey 不传或为空时保留原来的。保存时用新配置试调一次 GeoAPI，失败回 400 并写明原因。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QWeatherConfigInput" }
      responses:
        "200":
          description: 保存后的配置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QWeatherConfig" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /weather/extra:
    get:
      operationId: getWeatherExtra
      tags: [brief]
      description: |
        B58。早报位置的预警、分钟降水、空气质量、生活指数、日出日落、和昨天比、附近地震。
        地震不需要和风天气，其余要先配好和风天气（configured 为 false 时只有地震）。
        结果缓存 5 分钟，refresh=true 时跳过缓存，1 分钟内最多真拉一次。
      parameters:
        - name: refresh
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: 扩展的天气信息
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeatherExtra" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /weather/notify:
    get:
      operationId: getWeatherNotify
      tags: [brief]
      description: B58。降水、天气预警、地震的推送设置
      responses:
        "200":
          description: 设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeatherNotify" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    put:
      operationId: putWeatherNotify
      tags: [brief]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WeatherNotify" }
      responses:
        "200":
          description: 保存后的设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeatherNotify" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
components:
  schemas:
    QWeatherConfig:
      type: object
      required: [apiHost, keySet]
      properties:
        apiHost:
          type: string
          description: B58。和风天气控制台里的 API Host，例如 abc1234xyz.re.qweatherapi.com。空表示没配
        keySet: { type: boolean, description: 有没有填 API KEY }
        checkedAt: { type: string, format: date-time, description: 上次验证成功的时间 }
    QWeatherConfigInput:
      type: object
      required: [apiHost]
      properties:
        apiHost: { type: string, maxLength: 200 }
        apiKey: { type: string, maxLength: 200, description: 不传或空字符串时保留原来的 }
        clearKey: { type: boolean, description: true 时删掉 key，关掉和风天气 }
    WarningLevel:
      type: string
      description: B58。预警颜色。unknown 是和风天气没给颜色的
      enum: [blue, yellow, orange, red, unknown]
    WeatherWarning:
      type: object
      required: [id, title, typeName, level, sender, issuedAt, text]
      properties:
        id: { type: string }
        title: { type: string, description: 例如 杭州市气象台发布暴雨黄色预警 }
        typeName: { type: string, description: 例如 暴雨 }
        level: { $ref: "#/components/schemas/WarningLevel" }
        sender: { type: string }
        issuedAt: { type: string, format: date-time }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        text: { type: string, description: 预警正文和防御指南 }
    MinutelyPoint:
      type: object
      required: [time, precip]
      properties:
        time: { type: string, format: date-time }
        precip: { type: number, format: double, description: 5 分钟降水量，毫米 }
        kind: { type: string, enum: [rain, snow], description: 雨还是雪 }
    MinutelyRain:
      type: object
      required: [summary, points]
      properties:
        summary: { type: string, description: 和风天气给的一句话，例如 20 分钟后雨停 }
        points:
          type: array
          description: 未来 2 小时，每 5 分钟一个点
          items: { $ref: "#/components/schemas/MinutelyPoint" }
    AirQuality:
      type: object
      required: [aqi, category, level]
      properties:
        aqi: { type: integer }
        category: { type: string, description: 例如 良 }
        level: { type: integer, description: 1 到 6，1 最好 }
        primary: { type: string, description: 首要污染物，例如 PM2.5 }
        pm2p5: { type: number, format: double }
        pm10: { type: number, format: double }
    WeatherIndex:
      type: object
      required: [type, name, category, text]
      properties:
        type: { type: string, description: 和风天气的指数编号 }
        name: { type: string, description: 例如 穿衣指数 }
        category: { type: string, description: 例如 较冷 }
        text: { type: string }
    Astronomy:
      type: object
      properties:
        sunrise: { type: string, description: "HH:MM，早报位置的当地时间" }
        sunset: { type: string, description: "HH:MM" }
        moonrise: { type: string, description: "HH:MM" }
        moonset: { type: string, description: "HH:MM" }
        moonPhase: { type: string, description: 例如 上弦月 }
    DayRange:
      type: object
      required: [high, low]
      properties:
        high: { type: number, format: double }
        low: { type: number, format: double }
    Earthquake:
      type: object
      required: [id, time, magnitude, place, lat, lon, distanceKm]
      properties:
        id: { type: string }
        time: { type: string, format: date-time }
        magnitude: { type: number, format: double }
        place: { type: string, description: 例如 四川雅安市芦山县 }
        depthKm: { type: number, format: double }
        lat: { type: number, format: double }
        lon: { type: number, format: double }
        distanceKm: { type: number, format: double, description: 离早报位置多远 }
    WeatherExtra:
      type: object
      required: [configured, warnings, indices, earthquakes, fetchedAt]
      properties:
        configured: { type: boolean, description: 和风天气配好了。false 时只有地震 }
        warnings:
          type: array
          description: 正在生效的预警，颜色重的在前
          items: { $ref: "#/components/schemas/WeatherWarning" }
        minutely: { $ref: "#/components/schemas/MinutelyRain" }
        air: { $ref: "#/components/schemas/AirQuality" }
        indices:
          type: array
          items: { $ref: "#/components/schemas/WeatherIndex" }
        astronomy: { $ref: "#/components/schemas/Astronomy" }
        yesterday: { $ref: "#/components/schemas/DayRange" }
        earthquakes:
          type: array
          description: 最近 3 天、在推送设置的半径内、达到震级的地震，新的在前，最多 10 条
          items: { $ref: "#/components/schemas/Earthquake" }
        fetchedAt: { type: string, format: date-time }
    WeatherNotify:
      type: object
      required: [rainSoon, rainLeadMinutes, warnings, warningMinLevel, earthquakes, quakeMinMagnitude, quakeRadiusKm]
      properties:
        rainSoon: { type: boolean, description: 分钟降水显示快下雨（雪、冰雹）时推送。要和风天气。每 5 分钟看一次 }
        rainLeadMinutes: { type: integer, minimum: 10, maximum: 120, description: 提前多少分钟，默认 30 }
        warnings: { type: boolean, description: 有新的天气预警、升级、解除时推送。要和风天气。每 5 分钟看一次 }
        warningMinLevel: { $ref: "#/components/schemas/WarningLevel" }
        earthquakes: { type: boolean, description: 附近有地震时推送。每 2 分钟看一次 }
        quakeMinMagnitude: { type: number, format: double, minimum: 2, maximum: 9, description: 默认 4.5 }
        quakeRadiusKm: { type: integer, minimum: 50, maximum: 5000, description: 默认 500 }
    WeatherPlace:
      type: object
      required: [name, region, country, lat, lon]
      properties:
        name: { type: string }
        region: { type: string, description: 省或州 }
        country: { type: string }
        lat: { type: number, format: double }
        lon: { type: number, format: double }
    RainAlert:
      type: object
      required: [enabled, threshold, leadHours]
      properties:
        enabled:
          type: boolean
          description: 早报设置的位置接下来可能下雨时发通知。每 30 分钟看一次，6 小时内最多提醒一次
        threshold: { type: integer, minimum: 10, maximum: 100, description: 降雨概率达到多少就提醒，默认 60 }
        leadHours: { type: integer, minimum: 1, maximum: 6, description: 看接下来几个小时，默认 2 }
    Brief:
      type: object
      required: [date, content, sections, createdAt]
      properties:
        id: { type: integer, format: int64, description: 预览时没有 }
        date: { type: string, description: YYYY-MM-DD，用户时区 }
        content: { type: string, description: Markdown }
        sections:
          type: array
          items: { $ref: "#/components/schemas/BriefSection" }
        createdAt: { type: string, format: date-time }
        sentAt: { type: string, format: date-time }
    BriefSection:
      type: object
      required: [key, title, markdown]
      properties:
        key: { $ref: "#/components/schemas/BriefSectionKey" }
        title: { type: string }
        markdown: { type: string }
    BriefSectionKey:
      type: string
      description: summary 只在 AI 总结打开时出现，不能在设置里选
      enum: [summary, weather, calendar, issues, reminders, alerts, habits, renewals]
    BriefLocation:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number, format: double }
        lon: { type: number, format: double }
        name: { type: string, description: 显示用的地名 }
    BriefSettings:
      type: object
      required: [enabled, time, channels, sections]
      properties:
        enabled: { type: boolean, description: 每天定时生成并发送 }
        time: { type: string, description: "HH:MM，用户时区，默认 08:00" }
        channels:
          type: array
          description: 发到哪些渠道。空数组表示按通知的路由规则
          items: { type: string }
        location: { $ref: "#/components/schemas/BriefLocation" }
        sections:
          type: array
          description: 启用的部分，顺序固定
          items: { $ref: "#/components/schemas/BriefSectionKey" }
        aiPolish:
          type: boolean
          description: 用 AI 在最前面加一段总结。AI 助手模块可用时才生效
        weatherApiBase:
          type: string
          description: Open-Meteo 地址，默认 https://api.open-meteo.com
    BriefSettingsView:
      allOf:
        - $ref: "#/components/schemas/BriefSettings"
        - type: object
          required: [availableChannels, aiAvailable]
          properties:
            availableChannels:
              type: array
              items: { type: string }
            aiAvailable: { type: boolean, description: AI 润色是否可用 }
            nextRunAt: { type: string, format: date-time, description: 下次定时发送的时间 }
    Weather:
      type: object
      required: [latitude, longitude, temperature, weatherCode, summary, high, low, precipitationChance, fetchedAt]
      properties:
        location: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        temperature: { type: number, format: double, description: 当前气温，摄氏度 }
        weatherCode: { type: integer, description: WMO 天气代码 }
        summary: { type: string, description: 天气的中文说明，例如 多云 }
        high: { type: number, format: double }
        low: { type: number, format: double }
        precipitationChance: { type: integer, description: 今天的最大降水概率，百分比 }
        fetchedAt: { type: string, format: date-time }
