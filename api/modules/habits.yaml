openapi: 3.0.3
info:
  title: X Console habits and health (M8)
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /habits/library:
    get:
      operationId: getPersonalLibrary
      tags: [habits]
      responses:
        "200":
          description: 个人计划内容与动作库
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalLibrary" }
        default: { $ref: "../common.yaml#/components/responses/Error" }
  /habits/library/activate:
    post:
      operationId: activatePersonalHabits
      tags: [habits]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, maxItems: 50, items: { type: string } }
      responses:
        "200":
          description: 已选择的习惯，重复添加不会重复创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalProfile" }
        default: { $ref: "../common.yaml#/components/responses/Error" }
  /habits/personal/profile:
    get:
      operationId: getPersonalProfile
      tags: [habits]
      responses:
        "200":
          description: 个人计划设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalProfile" }
        default: { $ref: "../common.yaml#/components/responses/Error" }
    put:
      operationId: updatePersonalProfile
      tags: [habits]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonalProfileInput" }
      responses:
        "200":
          description: 已保存设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalProfile" }
        default: { $ref: "../common.yaml#/components/responses/Error" }
  /habits/personal/days:
    get:
      operationId: listPersonalDays
      tags: [habits]
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 366, default: 30 }
      responses:
        "200":
          description: 最近的个人记录，日期倒序
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PersonalDay" } }
        default: { $ref: "../common.yaml#/components/responses/Error" }
  /habits/personal/days/{date}:
    parameters:
      - name: date
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getPersonalDay
      tags: [habits]
      responses:
        "200":
          description: 当天记录，未记录的指标为空字符串
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalDay" }
        default: { $ref: "../common.yaml#/components/responses/Error" }
    patch:
      operationId: updatePersonalDay
      tags: [habits]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonalDayInput" }
      responses:
        "200":
          description: 合并保存当天记录，空字符串清除对应指标
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalDay" }
        default: { $ref: "../common.yaml#/components/responses/Error" }
  /habits/personal/days/{date}/check:
    parameters:
      - name: date
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: checkPersonalHabit
      tags: [habits]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, done]
              properties:
                id: { type: string }
                done: { type: boolean }
      responses:
        "200":
          description: 已打卡或撤销，仅操作个人计划生成的打卡
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalDay" }
        default: { $ref: "../common.yaml#/components/responses/Error" }
  /habits/personal/days/{date}/workout:
    parameters:
      - name: date
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: logPersonalWorkout
      tags: [habits]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, durationMinutes, note]
              properties:
                items: { type: array, items: { $ref: "#/components/schemas/WorkoutItem" } }
                durationMinutes: { type: integer, minimum: 0, maximum: 1440 }
                note: { type: string }
      responses:
        "200":
          description: 当天训练已保存，重复保存更新同一训练
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalDay" }
        default: { $ref: "../common.yaml#/components/responses/Error" }
  /habits/personal/backup:
    get:
      operationId: exportPersonalBackup
      tags: [habits]
      responses:
        "200":
          description: 可下载的个人计划备份
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalBackup" }
        default: { $ref: "../common.yaml#/components/responses/Error" }
    post:
      operationId: importPersonalBackup
      tags: [habits]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonalBackup" }
      responses:
        "200":
          description: 已合并，重复导入不产生重复打卡
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalProfile" }
        default: { $ref: "../common.yaml#/components/responses/Error" }
  /habits/body/push:
    get:
      operationId: getBodyPush
      tags: [habits]
      description: B119：身体数据自动上报的状态。没开启时 enabled 为 false。
      responses:
        "200":
          description: 状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BodyPushStatus" }
        default: { $ref: "../common.yaml#/components/responses/Error" }
    delete:
      operationId: deleteBodyPush
      tags: [habits]
      description: 关闭自动上报，令牌立即作废。没开启时也回 204。
      responses:
        "204": { description: 已关闭 }
        default: { $ref: "../common.yaml#/components/responses/Error" }
  /habits/body/push/token:
    post:
      operationId: createBodyPushToken
      tags: [habits]
      description: |
        B119：生成上报令牌。要提升权限。旧令牌立即作废。
        令牌只在这次回复里出现，面板只存它的哈希。
      responses:
        "200":
          description: 新令牌、上报地址和示例命令
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BodyPushToken" }
        default: { $ref: "../common.yaml#/components/responses/Error" }
  /habits/body/report:
    post:
      operationId: reportBody
      tags: [habits]
      description: |
        B119：手机快捷指令、Home Assistant 或脚本每天上报一次。不需要登录会话，用 Authorization: Bearer <令牌> 校验。
        请求体是 JSON：date（可选，默认今天）、weight、waist、sleep、restingHr、steps，数值可以写数字或数字字符串。
        没写、null、空字符串的字段不改。有不认识的字段或数值越界整条回 400。
        接口定义里不写 requestBody，由服务端自己解析。
      security: []
      responses:
        "204": { description: 已记下 }
        default: { $ref: "../common.yaml#/components/responses/Error" }
  /habits/schedule:
    get:
      operationId: getHabitSchedule
      tags: [habits]
      responses:
        "200":
          description: 作息设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
    put:
      operationId: updateHabitSchedule
      tags: [habits]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Schedule" }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /habits/presence:
    get:
      operationId: getHabitPresence
      tags: [habits]
      responses:
        "200":
          description: 可见电脑的使用状态
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HostPresence" }
  /habits:
    get:
      operationId: listHabits
      tags: [habits]
      parameters:
        - name: archived
          in: query
          description: true 时包含已归档的习惯
          schema: { type: boolean }
      responses:
        "200":
          description: 习惯列表，按 sortOrder 排序
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Habit" }
    post:
      operationId: createHabit
      tags: [habits]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HabitInput" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Habit" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /habits/today:
    get:
      operationId: habitsToday
      tags: [habits]
      responses:
        "200":
          description: 今天每个习惯的进度（按用户时区）
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HabitToday" }
  /habits/logs/{logId}:
    parameters:
      - name: logId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: deleteHabitLog
      tags: [habits]
      description: 撤销一次打卡
      responses:
        "204":
          description: 已撤销
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /habits/{habitId}:
    parameters:
      - $ref: "#/components/parameters/HabitId"
    get:
      operationId: getHabit
      tags: [habits]
      responses:
        "200":
          description: 习惯
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Habit" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    patch:
      operationId: updateHabit
      tags: [habits]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HabitPatch" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Habit" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteHabit
      tags: [habits]
      description: 删除习惯和它的全部打卡记录。只想隐藏时用归档。
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /habits/{habitId}/checkin:
    parameters:
      - $ref: "#/components/parameters/HabitId"
    post:
      operationId: checkinHabit
      tags: [habits]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  format: double
                  description: 默认 1。可以是负数以外的任意值
                note: { type: string }
      responses:
        "201":
          description: 打卡记录和最新进度
          content:
            application/json:
              schema:
                type: object
                required: [log, today]
                properties:
                  log: { $ref: "#/components/schemas/HabitLog" }
                  today: { $ref: "#/components/schemas/HabitToday" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /habits/{habitId}/stats:
    parameters:
      - $ref: "#/components/parameters/HabitId"
    get:
      operationId: habitStats
      tags: [habits]
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 366, default: 30 }
      responses:
        "200":
          description: 统计，days 按日期从早到晚
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HabitStats" }
        default:
          $ref: "../common.yaml#/components/responses/Error"

  /workouts/plans:
    get:
      operationId: listWorkoutPlans
      tags: [workouts]
      responses:
        "200":
          description: 每周训练计划，按星期排序
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkoutPlan" }
    put:
      operationId: replaceWorkoutPlans
      tags: [workouts]
      description: 整体替换一周的计划
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/WorkoutPlan" }
      responses:
        "200":
          description: 保存后的计划
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkoutPlan" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /workouts/logs:
    get:
      operationId: listWorkoutLogs
      tags: [workouts]
      parameters:
        - name: days
          in: query
          description: 最近多少天，默认 30
          schema: { type: integer, minimum: 1, maximum: 366, default: 30 }
      responses:
        "200":
          description: 训练记录，新的在前
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkoutLog" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: createWorkoutLog
      tags: [workouts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkoutLogInput" }
      responses:
        "201":
          description: 已记录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutLog" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /workouts/logs/{logId}:
    parameters:
      - name: logId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: deleteWorkoutLog
      tags: [workouts]
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /workouts/settings:
    get:
      operationId: getWorkoutSettings
      tags: [workouts]
      responses:
        "200":
          description: 训练提醒设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutSettings" }
    put:
      operationId: updateWorkoutSettings
      tags: [workouts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkoutSettings" }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutSettings" }
        default:
          $ref: "../common.yaml#/components/responses/Error"

components:
  parameters:
    HabitId:
      name: habitId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    Schedule:
      type: object
      required: [workDays, wakeTime, sleepTime, timezone, idleMinutes]
      properties:
        workDays:
          type: array
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 7 }
        wakeTime: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        sleepTime: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        workStart: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        workEnd: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        timezone: { type: string }
        idleMinutes: { type: integer, minimum: 1, maximum: 120 }
    HostPresence:
      type: object
      required: [hostId, name, state, known, online, since, updatedAt]
      properties:
        hostId: { type: string }
        name: { type: string }
        state: { type: string, enum: [active, idle, locked, offline, unknown] }
        idleSeconds: { type: integer, format: int64 }
        locked: { type: boolean }
        displayOff: { type: boolean }
        known: { type: boolean }
        online: { type: boolean }
        since: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RemindMode:
      type: string
      description: none 不提醒；interval 在时间窗内每隔一段时间提醒；times 在固定时间点提醒
      enum: [none, interval, times]
    HabitKind:
      type: string
      description: count 普通打卡；workout 健身，记一次训练就算打卡一次
      enum: [count, workout]
    Habit:
      type: object
      required:
        [id, name, icon, color, unit, dailyTarget, remindMode, remindIntervalMinutes, remindWindow, remindTimes, haEntityId, archived, sortOrder, createdAt, remindWhen, activeHostIds, remindOnHost]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        icon: { type: string }
        kind: { $ref: "#/components/schemas/HabitKind" }
        color: { type: string }
        unit: { type: string }
        dailyTarget: { type: number, format: double }
        remindMode: { $ref: "#/components/schemas/RemindMode" }
        remindIntervalMinutes: { type: integer }
        remindWindow:
          type: string
          description: 形如 09:00-21:00
        remindTimes:
          type: array
          items: { type: string }
        remindWhen:
          type: array
          items: { type: string, enum: [window, awake, work, active] }
        activeHostIds:
          type: array
          maxItems: 50
          items: { type: string }
        remindOnHost: { type: boolean }
        template: { type: string, enum: [water, eyes, move, medicine] }
        haEntityId:
          type: string
          description: 这个 Home Assistant 实体状态变化时自动打卡一次
        archived: { type: boolean }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        nextRemindAt: { type: string, format: date-time }
    HabitInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        icon: { type: string }
        kind: { $ref: "#/components/schemas/HabitKind" }
        color: { type: string }
        unit: { type: string }
        dailyTarget: { type: number, format: double }
        remindMode: { $ref: "#/components/schemas/RemindMode" }
        remindIntervalMinutes: { type: integer }
        remindWindow: { type: string }
        remindTimes:
          type: array
          items: { type: string }
        remindWhen:
          type: array
          items: { type: string, enum: [window, awake, work, active] }
        activeHostIds:
          type: array
          maxItems: 50
          items: { type: string }
        remindOnHost: { type: boolean }
        template: { type: string, enum: [water, eyes, move, medicine] }
        haEntityId: { type: string }
        sortOrder: { type: integer }
    HabitPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        icon: { type: string }
        kind: { $ref: "#/components/schemas/HabitKind" }
        color: { type: string }
        unit: { type: string }
        dailyTarget: { type: number, format: double }
        remindMode: { $ref: "#/components/schemas/RemindMode" }
        remindIntervalMinutes: { type: integer }
        remindWindow: { type: string }
        remindTimes:
          type: array
          items: { type: string }
        remindWhen:
          type: array
          items: { type: string, enum: [window, awake, work, active] }
        activeHostIds:
          type: array
          maxItems: 50
          items: { type: string }
        remindOnHost: { type: boolean }
        template: { type: string, enum: [water, eyes, move, medicine] }
        haEntityId: { type: string }
        sortOrder: { type: integer }
        archived: { type: boolean }
    HabitLog:
      type: object
      required: [id, habitId, at, amount, source, note]
      properties:
        id: { type: integer, format: int64 }
        habitId: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        amount: { type: number, format: double }
        source:
          type: string
          description: web、telegram、webpush、ha、ai、automation、workout
        note: { type: string }
    HabitToday:
      type: object
      required: [habit, done, streak, reached, logs]
      properties:
        habit: { $ref: "#/components/schemas/Habit" }
        done:
          type: number
          format: double
          description: 今天累计
        streak:
          type: integer
          description: 连续达标天数（含今天，如果今天已达标）
        reached: { type: boolean }
        logs:
          type: array
          description: 今天的打卡，新的在前
          items: { $ref: "#/components/schemas/HabitLog" }
    HabitDay:
      type: object
      required: [date, amount, reached]
      properties:
        date:
          type: string
          description: 用户时区的日期 YYYY-MM-DD
        amount: { type: number, format: double }
        reached: { type: boolean }
    HabitStats:
      type: object
      required: [habitId, streak, bestStreak, reachedDays, total, days]
      properties:
        habitId: { type: integer, format: int64 }
        streak: { type: integer }
        bestStreak:
          type: integer
          description: 统计范围内最长连续达标天数
        reachedDays: { type: integer }
        total: { type: number, format: double }
        days:
          type: array
          items: { $ref: "#/components/schemas/HabitDay" }
    WorkoutItem:
      type: object
      required: [name]
      properties:
        exerciseId: { type: string, description: 动作库 ID，可选 }
        prescription: { type: string, description: 保留次数区间、时长、距离和每侧说明 }
        name: { type: string, minLength: 1 }
        sets: { type: integer }
        reps: { type: integer }
        weight:
          type: number
          format: double
          description: 公斤，0 表示自重
        note: { type: string }
    WorkoutPlan:
      type: object
      required: [weekday, title, items]
      properties:
        id: { type: integer, format: int64 }
        weekday:
          type: integer
          minimum: 1
          maximum: 7
          description: 1 是周一，7 是周日
        title: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkoutItem" }
    WorkoutLog:
      type: object
      required: [id, date, items, durationMinutes, note, createdAt]
      properties:
        id: { type: integer, format: int64 }
        date: { type: string, description: YYYY-MM-DD }
        planId: { type: integer, format: int64 }
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkoutItem" }
        durationMinutes: { type: integer }
        note: { type: string }
        createdAt: { type: string, format: date-time }
    WorkoutLogInput:
      type: object
      properties:
        date:
          type: string
          description: YYYY-MM-DD，默认今天
        planId: { type: integer, format: int64 }
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkoutItem" }
        durationMinutes: { type: integer, minimum: 0 }
        note: { type: string }
    WorkoutSettings:
      type: object
      required: [notifyEnabled, notifyTime]
      properties:
        notifyEnabled:
          type: boolean
          description: 有计划的日子到点发通知
        notifyTime: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
    LibraryExercise:
      type: object
      required: [id, name, en, group, equipment, target, dose, rest, setup, steps, errors, easier, progress, restored, image]
      properties:
        id: { type: string }
        name: { type: string }
        en: { type: string }
        group: { type: string }
        equipment: { type: string }
        target: { type: string }
        dose: { type: string }
        rest: { type: string }
        setup: { type: array, items: { type: string } }
        steps: { type: array, items: { type: string } }
        errors: { type: array, items: { type: string } }
        easier: { type: string }
        progress: { type: string }
        restored: { type: boolean }
        image: { type: string }
    LibrarySessionItem:
      type: object
      required: [exerciseId, sets, prescription, optional]
      properties:
        exerciseId: { type: string }
        sets: { type: integer }
        prescription: { type: string }
        optional: { type: boolean }
    LibrarySession:
      type: object
      required: [id, name, focus, place, time, items]
      properties:
        id: { type: string }
        name: { type: string }
        focus: { type: string }
        place: { type: string }
        time: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/LibrarySessionItem" } }
    LibraryRunLevel:
      type: object
      required: [id, name, description, walkMinutes, runMinutes, rounds, durationMinutes]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        walkMinutes: { type: integer }
        runMinutes: { type: integer }
        rounds: { type: integer }
        durationMinutes: { type: integer }
    LibraryPhase:
      type: object
      required: [id, name, description]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
    LibraryHabit:
      type: object
      required: [id, name, short, tip, group, category, exerciseId]
      properties:
        id: { type: string }
        name: { type: string }
        short: { type: string }
        tip: { type: string }
        group: { type: string }
        category: { type: string, enum: [daily, food, english] }
        exerciseId: { type: string }
    LibraryArticle:
      type: object
      required: [id, title, category, content]
      properties:
        id: { type: string }
        title: { type: string }
        category: { type: string, enum: [daily, food, english, reference] }
        content: { type: string }
    PersonalLibrary:
      type: object
      required: [version, sourceHash, exercises, sessions, runLevels, phases, habits, articles, original]
      properties:
        version: { type: integer }
        sourceHash: { type: string }
        exercises: { type: array, items: { $ref: "#/components/schemas/LibraryExercise" } }
        sessions: { type: array, items: { $ref: "#/components/schemas/LibrarySession" } }
        runLevels: { type: array, items: { $ref: "#/components/schemas/LibraryRunLevel" } }
        phases: { type: array, items: { $ref: "#/components/schemas/LibraryPhase" } }
        habits: { type: array, items: { $ref: "#/components/schemas/LibraryHabit" } }
        articles: { type: array, items: { $ref: "#/components/schemas/LibraryArticle" } }
        original:
          type: object
          required: [chat, attachment]
          properties:
            chat: { type: string }
            attachment: { type: string }
    PersonalProfileInput:
      type: object
      required: [start, wake, sleep, phase, baseline, stepGoal, runLevel]
      properties:
        start: { type: string }
        wake: { type: string }
        sleep: { type: string }
        phase: { type: integer, minimum: 1, maximum: 3 }
        baseline: { type: number, minimum: 30, maximum: 250 }
        stepGoal: { type: integer, minimum: 500, maximum: 30000 }
        runLevel: { type: integer, minimum: 0, maximum: 8 }
    PersonalProfile:
      allOf:
        - { $ref: "#/components/schemas/PersonalProfileInput" }
        - type: object
          required: [habitIds]
          properties:
            habitIds:
              type: object
              additionalProperties: { type: integer, format: int64 }
    PersonalDayInput:
      type: object
      properties:
        weight: { type: string }
        waist: { type: string }
        sleep: { type: string }
        steps: { type: string }
        restingHr: { type: string, description: B119 静息心率，次/分 }
        energy: { type: string }
        back: { type: string }
        note: { type: string }
        english: { type: string }
        food: { type: string }
        sets:
          type: object
          additionalProperties: { type: boolean }
    PersonalDay:
      type: object
      required: [date, weight, waist, sleep, steps, restingHr, energy, back, note, english, food, sets, checks]
      properties:
        date: { type: string }
        weight: { type: string }
        waist: { type: string }
        sleep: { type: string }
        steps: { type: string }
        restingHr: { type: string }
        energy: { type: string }
        back: { type: string }
        note: { type: string }
        english: { type: string }
        food: { type: string }
        sets:
          type: object
          additionalProperties: { type: boolean }
        checks:
          type: object
          additionalProperties: { type: boolean }
        workoutLogId: { type: integer, format: int64 }
        workoutDurationMinutes: { type: integer }
    BodyPushStatus:
      type: object
      required: [enabled, reportUrl]
      properties:
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastReportAt: { type: string, format: date-time, description: 最近一次收到上报的时间。还没收到过为空 }
        lastReportDate: { type: string, description: 最近一次上报写入的日期 }
        reportUrl: { type: string }
    BodyPushToken:
      type: object
      required: [token, reportUrl, example]
      properties:
        token: { type: string }
        reportUrl: { type: string }
        example: { type: string, description: 填好地址和令牌、可以直接复制执行的 curl 命令 }
    PersonalBackup:
      type: object
      required: [version, profile, checks, sets, logs]
      properties:
        version: { type: integer, enum: [1] }
        exportedAt: { type: string }
        profile: { $ref: "#/components/schemas/PersonalProfileInput" }
        selectedHabits: { type: array, items: { type: string } }
        checks:
          type: object
          additionalProperties: { type: boolean }
        sets:
          type: object
          additionalProperties: { type: boolean }
        logs:
          type: object
          additionalProperties: { $ref: "#/components/schemas/PersonalDayInput" }
