openapi: 3.0.3
info:
  title: X Console habits and health (M8)
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /habits/schedule:
    get:
      operationId: getHabitSchedule
      tags: [habits]
      responses:
        "200":
          description: 作息设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
    put:
      operationId: updateHabitSchedule
      tags: [habits]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Schedule" }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /habits/presence:
    get:
      operationId: getHabitPresence
      tags: [habits]
      responses:
        "200":
          description: 可见电脑的使用状态
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HostPresence" }
  /habits:
    get:
      operationId: listHabits
      tags: [habits]
      parameters:
        - name: archived
          in: query
          description: true 时包含已归档的习惯
          schema: { type: boolean }
      responses:
        "200":
          description: 习惯列表，按 sortOrder 排序
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Habit" }
    post:
      operationId: createHabit
      tags: [habits]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HabitInput" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Habit" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /habits/today:
    get:
      operationId: habitsToday
      tags: [habits]
      responses:
        "200":
          description: 今天每个习惯的进度（按用户时区）
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HabitToday" }
  /habits/logs/{logId}:
    parameters:
      - name: logId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: deleteHabitLog
      tags: [habits]
      description: 撤销一次打卡
      responses:
        "204":
          description: 已撤销
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /habits/{habitId}:
    parameters:
      - $ref: "#/components/parameters/HabitId"
    get:
      operationId: getHabit
      tags: [habits]
      responses:
        "200":
          description: 习惯
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Habit" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    patch:
      operationId: updateHabit
      tags: [habits]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HabitPatch" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Habit" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteHabit
      tags: [habits]
      description: 删除习惯和它的全部打卡记录。只想隐藏时用归档。
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /habits/{habitId}/checkin:
    parameters:
      - $ref: "#/components/parameters/HabitId"
    post:
      operationId: checkinHabit
      tags: [habits]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  format: double
                  description: 默认 1。可以是负数以外的任意值
                note: { type: string }
      responses:
        "201":
          description: 打卡记录和最新进度
          content:
            application/json:
              schema:
                type: object
                required: [log, today]
                properties:
                  log: { $ref: "#/components/schemas/HabitLog" }
                  today: { $ref: "#/components/schemas/HabitToday" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /habits/{habitId}/stats:
    parameters:
      - $ref: "#/components/parameters/HabitId"
    get:
      operationId: habitStats
      tags: [habits]
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 366, default: 30 }
      responses:
        "200":
          description: 统计，days 按日期从早到晚
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HabitStats" }
        default:
          $ref: "../common.yaml#/components/responses/Error"

  /workouts/plans:
    get:
      operationId: listWorkoutPlans
      tags: [workouts]
      responses:
        "200":
          description: 每周训练计划，按星期排序
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkoutPlan" }
    put:
      operationId: replaceWorkoutPlans
      tags: [workouts]
      description: 整体替换一周的计划
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/WorkoutPlan" }
      responses:
        "200":
          description: 保存后的计划
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkoutPlan" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /workouts/logs:
    get:
      operationId: listWorkoutLogs
      tags: [workouts]
      parameters:
        - name: days
          in: query
          description: 最近多少天，默认 30
          schema: { type: integer, minimum: 1, maximum: 366, default: 30 }
      responses:
        "200":
          description: 训练记录，新的在前
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkoutLog" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: createWorkoutLog
      tags: [workouts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkoutLogInput" }
      responses:
        "201":
          description: 已记录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutLog" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /workouts/logs/{logId}:
    parameters:
      - name: logId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: deleteWorkoutLog
      tags: [workouts]
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /workouts/settings:
    get:
      operationId: getWorkoutSettings
      tags: [workouts]
      responses:
        "200":
          description: 训练提醒设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutSettings" }
    put:
      operationId: updateWorkoutSettings
      tags: [workouts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkoutSettings" }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutSettings" }
        default:
          $ref: "../common.yaml#/components/responses/Error"

components:
  parameters:
    HabitId:
      name: habitId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    Schedule:
      type: object
      required: [workDays, wakeTime, sleepTime, timezone, idleMinutes]
      properties:
        workDays:
          type: array
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 7 }
        wakeTime: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        sleepTime: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        workStart: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        workEnd: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        timezone: { type: string }
        idleMinutes: { type: integer, minimum: 1, maximum: 120 }
    HostPresence:
      type: object
      required: [hostId, name, state, known, online, since, updatedAt]
      properties:
        hostId: { type: string }
        name: { type: string }
        state: { type: string, enum: [active, idle, locked, offline, unknown] }
        idleSeconds: { type: integer, format: int64 }
        locked: { type: boolean }
        displayOff: { type: boolean }
        known: { type: boolean }
        online: { type: boolean }
        since: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RemindMode:
      type: string
      description: none 不提醒；interval 在时间窗内每隔一段时间提醒；times 在固定时间点提醒
      enum: [none, interval, times]
    HabitKind:
      type: string
      description: count 普通打卡；workout 健身，记一次训练就算打卡一次
      enum: [count, workout]
    Habit:
      type: object
      required:
        [id, name, icon, color, unit, dailyTarget, remindMode, remindIntervalMinutes, remindWindow, remindTimes, haEntityId, archived, sortOrder, createdAt, remindWhen, activeHostIds, remindOnHost]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        icon: { type: string }
        kind: { $ref: "#/components/schemas/HabitKind" }
        color: { type: string }
        unit: { type: string }
        dailyTarget: { type: number, format: double }
        remindMode: { $ref: "#/components/schemas/RemindMode" }
        remindIntervalMinutes: { type: integer }
        remindWindow:
          type: string
          description: 形如 09:00-21:00
        remindTimes:
          type: array
          items: { type: string }
        remindWhen:
          type: array
          items: { type: string, enum: [window, awake, work, active] }
        activeHostIds:
          type: array
          maxItems: 50
          items: { type: string }
        remindOnHost: { type: boolean }
        template: { type: string, enum: [water, eyes, move, medicine] }
        haEntityId:
          type: string
          description: 这个 Home Assistant 实体状态变化时自动打卡一次
        archived: { type: boolean }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        nextRemindAt: { type: string, format: date-time }
    HabitInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        icon: { type: string }
        kind: { $ref: "#/components/schemas/HabitKind" }
        color: { type: string }
        unit: { type: string }
        dailyTarget: { type: number, format: double }
        remindMode: { $ref: "#/components/schemas/RemindMode" }
        remindIntervalMinutes: { type: integer }
        remindWindow: { type: string }
        remindTimes:
          type: array
          items: { type: string }
        remindWhen:
          type: array
          items: { type: string, enum: [window, awake, work, active] }
        activeHostIds:
          type: array
          maxItems: 50
          items: { type: string }
        remindOnHost: { type: boolean }
        template: { type: string, enum: [water, eyes, move, medicine] }
        haEntityId: { type: string }
        sortOrder: { type: integer }
    HabitPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        icon: { type: string }
        kind: { $ref: "#/components/schemas/HabitKind" }
        color: { type: string }
        unit: { type: string }
        dailyTarget: { type: number, format: double }
        remindMode: { $ref: "#/components/schemas/RemindMode" }
        remindIntervalMinutes: { type: integer }
        remindWindow: { type: string }
        remindTimes:
          type: array
          items: { type: string }
        remindWhen:
          type: array
          items: { type: string, enum: [window, awake, work, active] }
        activeHostIds:
          type: array
          maxItems: 50
          items: { type: string }
        remindOnHost: { type: boolean }
        template: { type: string, enum: [water, eyes, move, medicine] }
        haEntityId: { type: string }
        sortOrder: { type: integer }
        archived: { type: boolean }
    HabitLog:
      type: object
      required: [id, habitId, at, amount, source, note]
      properties:
        id: { type: integer, format: int64 }
        habitId: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        amount: { type: number, format: double }
        source:
          type: string
          description: web、telegram、webpush、ha、ai、automation、workout
        note: { type: string }
    HabitToday:
      type: object
      required: [habit, done, streak, reached, logs]
      properties:
        habit: { $ref: "#/components/schemas/Habit" }
        done:
          type: number
          format: double
          description: 今天累计
        streak:
          type: integer
          description: 连续达标天数（含今天，如果今天已达标）
        reached: { type: boolean }
        logs:
          type: array
          description: 今天的打卡，新的在前
          items: { $ref: "#/components/schemas/HabitLog" }
    HabitDay:
      type: object
      required: [date, amount, reached]
      properties:
        date:
          type: string
          description: 用户时区的日期 YYYY-MM-DD
        amount: { type: number, format: double }
        reached: { type: boolean }
    HabitStats:
      type: object
      required: [habitId, streak, bestStreak, reachedDays, total, days]
      properties:
        habitId: { type: integer, format: int64 }
        streak: { type: integer }
        bestStreak:
          type: integer
          description: 统计范围内最长连续达标天数
        reachedDays: { type: integer }
        total: { type: number, format: double }
        days:
          type: array
          items: { $ref: "#/components/schemas/HabitDay" }
    WorkoutItem:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        sets: { type: integer }
        reps: { type: integer }
        weight:
          type: number
          format: double
          description: 公斤，0 表示自重
        note: { type: string }
    WorkoutPlan:
      type: object
      required: [weekday, title, items]
      properties:
        id: { type: integer, format: int64 }
        weekday:
          type: integer
          minimum: 1
          maximum: 7
          description: 1 是周一，7 是周日
        title: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkoutItem" }
    WorkoutLog:
      type: object
      required: [id, date, items, durationMinutes, note, createdAt]
      properties:
        id: { type: integer, format: int64 }
        date: { type: string, description: YYYY-MM-DD }
        planId: { type: integer, format: int64 }
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkoutItem" }
        durationMinutes: { type: integer }
        note: { type: string }
        createdAt: { type: string, format: date-time }
    WorkoutLogInput:
      type: object
      properties:
        date:
          type: string
          description: YYYY-MM-DD，默认今天
        planId: { type: integer, format: int64 }
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkoutItem" }
        durationMinutes: { type: integer, minimum: 0 }
        note: { type: string }
    WorkoutSettings:
      type: object
      required: [notifyEnabled, notifyTime]
      properties:
        notifyEnabled:
          type: boolean
          description: 有计划的日子到点发通知
        notifyTime: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
