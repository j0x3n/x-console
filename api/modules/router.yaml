openapi: 3.0.3
info:
  title: X Console 路由器 API (B65)
  version: 0.1.0
  description: |
    OpenWrt 主路由。面板通过路由器自带的 ubus（uhttpd-mod-ubus）读状态，路由器上不装代理。
    面板访问不到家里的路由器时，可以让家里装了代理的机器转发（mode=agent，用代理的 http.proxy）。
    B114：也可以让路由器上的脚本每分钟主动上报（mode=push），面板不用访问路由器，也不需要代理。
servers:
  - url: /api/v1
paths:
  /router/config:
    get:
      operationId: getRouterConfig
      tags: [router]
      description: 当前配置。不返回密码。
      responses:
        "200":
          description: 配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouterConfig"
        default:
          $ref: "../common.yaml#/components/responses/Error"
    put:
      operationId: putRouterConfig
      tags: [router]
      description: |
        保存前先登录一次路由器，登录不上就不保存。要提升权限（会把保存的密码发到新地址）。
        url 留空表示删除整个配置。password 不传或为空表示不改。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouterConfigInput"
      responses:
        "200":
          description: 保存后的配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouterConfig"
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /router/push/token:
    post:
      operationId: createRouterPushToken
      tags: [router]
      description: |
        B114：生成上报令牌并切到“路由器主动上报”。旧令牌和旧的 ubus 配置立即作废。
        要提升权限。令牌只在这次回复里出现，面板只存它的哈希。
        回复里的 command 是一行命令，路由器用它从 installUrl 下载安装脚本（B227）；script 是同一份脚本的全文，手动安装用。
      responses:
        "200":
          description: 新令牌和安装命令
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouterPushToken"
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /router/push/interval:
    put:
      operationId: putRouterPushInterval
      tags: [router]
      description: |
        B114：改路由器上报的间隔。脚本每次上报后读到新值，最晚下一分钟内生效。只在 mode=push 时可用，否则回 409。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seconds]
              properties:
                seconds:
                  type: integer
                  enum: [3, 5, 10, 30, 60]
      responses:
        "200":
          description: 保存后的配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouterConfig"
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /router/report:
    post:
      operationId: reportRouter
      tags: [router]
      description: |
        B114：路由器上的脚本每分钟调用一次。不需要登录会话，用 Authorization: Bearer <令牌> 校验。
        请求体是纯文本，按 `#xc:<名字>` 开头的行分段：board、info、interfaces、devices 是 ubus 的 JSON 输出，
        leases 是 /tmp/dhcp.leases，arp 是 /proc/net/arp。接口定义里不写 requestBody，由服务端自己解析。
      security: []
      responses:
        "200":
          description: |
            已收下。回复是纯文本，每行一项：`interval=<秒>` 是下次上报的间隔；
            `cmd=<编号> <动作> <参数>` 是要路由器执行的命令（restart_interface 加接口名，或 reboot），
            每条命令只下发一次。老版本的脚本不读回复，也能正常上报。
          content:
            text/plain:
              schema:
                type: string
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /router/install/{code}:
    get:
      operationId: getRouterInstall
      tags: [router]
      description: |
        B227：路由器用一行命令下载安装脚本。不需要登录会话，下载码就是凭证：32 字节随机数，
        面板只在内存里存它的哈希，15 分钟内有效，下载一次就作废。重新生成令牌后旧下载码马上作废，面板重启也作废。
        失效时回 404，正文是“安装链接失效了，回面板重新生成”，路由器上的 wget 会失败，后面的 sh 不会执行。
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 填好地址和令牌的安装脚本
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: 下载码失效
          content:
            text/plain:
              schema:
                type: string
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /router/devices:
    get:
      operationId: listRouterDevices
      tags: [router]
      description: |
        B228：面板记住的所有设备，在线的排前面。只在 mode=push 时可用，否则回 409 router_not_push。
        trafficAvailable 为 true 表示最近一次上报带了 nlbwmon 的数据（B229），rxRate、txRate、todayRx、todayTx 才有值。
      responses:
        "200":
          description: 设备列表
          content:
            application/json:
              schema:
                type: object
                required: [items, trafficAvailable]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RouterDevice"
                  trafficAvailable: { type: boolean }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /router/devices/{mac}:
    parameters:
      - name: mac
        in: path
        required: true
        schema: { type: string }
        description: 设备的 MAC，不分大小写，冒号分隔
    patch:
      operationId: updateRouterDevice
      tags: [router]
      description: 改备注、通知开关和再次通知间隔。三个字段都要传。不需要提升权限。MAC 不存在回 404。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouterDeviceUpdate"
      responses:
        "200":
          description: 更新后的设备
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouterDevice"
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteRouterDevice
      tags: [router]
      description: 忘掉这台设备：删掉备注、设备记录和它的流量。它再出现时当新设备。
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /router/options:
    get:
      operationId: getRouterOptions
      tags: [router]
      description: 设备通知和日志的设置。
      responses:
        "200":
          description: 设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouterOptions"
        default:
          $ref: "../common.yaml#/components/responses/Error"
    put:
      operationId: putRouterOptions
      tags: [router]
      description: 整个对象一起传，返回保存后的整个对象。notifyCooldownMinutes 只能是 0、5、15、30、60，logDays 在 1 到 15 之间。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouterOptions"
      responses:
        "200":
          description: 保存后的设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouterOptions"
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /router/status:
    get:
      operationId: getRouterStatus
      tags: [router]
      description: |
        系统信息、各接口、WAN 口和当前速率。没配置时回 412 integration_not_configured。
        速率按这次和上一次读到的网卡计数算，页面每几秒刷新一次就是实时速率。
      responses:
        "200":
          description: 状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouterStatus"
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /router/clients:
    get:
      operationId: getRouterClients
      tags: [router]
      description: |
        在线设备，按 IP 排序。mode=push 时只返回面板判断为在线的设备（B228），带备注；
        其他模式合并 DHCP 租约和 host hints。AI 动作也在用这个接口。
      responses:
        "200":
          description: 设备列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RouterClient"
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /router/traffic:
    get:
      operationId: getRouterTraffic
      tags: [router]
      description: WAN 口流量历史。后台每分钟采一次，留 30 天。24h 按 5 分钟一个点，7d 按 1 小时一个点。
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: ["24h", "7d"]
            default: "24h"
      responses:
        "200":
          description: 流量
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouterTraffic"
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /router/interfaces/{name}/restart:
    post:
      operationId: restartRouterInterface
      tags: [router]
      description: |
        先 down 再 up 这个接口。要提升权限，路由器那边要允许 network.interface.* 的 up 和 down。
        mode=push 时面板连不到路由器，命令排队，路由器下次上报时取走执行，回 202。
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: 已重启
        "202":
          description: mode=push：已排队，路由器下次上报时执行
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /router/reboot:
    post:
      operationId: rebootRouter
      tags: [router]
      description: |
        重启路由器。要提升权限，请求体要带 confirm 为“重启”。
        mode=push 时命令排队，路由器下次上报时取走执行，也回 202。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: string
                  description: 固定填“重启”
      responses:
        "202":
          description: 路由器已开始重启
        default:
          $ref: "../common.yaml#/components/responses/Error"
components:
  schemas:
    RouterMode:
      type: string
      description: direct 面板直接访问；agent 让家里的代理转发；push 路由器上的脚本主动上报
      enum: [direct, agent, push]
    RouterConfig:
      type: object
      required: [url, username, mode, hasPassword]
      properties:
        url:
          type: string
          description: 路由器地址，比如 http://192.168.1.1。没配置时为空
        username: { type: string }
        mode: { $ref: "#/components/schemas/RouterMode" }
        agentId: { type: string }
        hasPassword: { type: boolean }
        lastReportAt:
          type: string
          format: date-time
          description: mode=push 时，最近一次收到上报的时间。还没收到过为空
        reportUrl:
          type: string
          description: mode=push 时，路由器上报用的地址
        pushInterval:
          type: integer
          description: mode=push 时，上报间隔（秒），默认 60
    RouterConfigInput:
      type: object
      required: [url]
      properties:
        url: { type: string }
        username: { type: string }
        password:
          type: string
          description: 不传或为空表示不改
        mode:
          $ref: "#/components/schemas/RouterMode"
          description: 不传表示 direct。不能填 push，push 用 POST /router/push/token 开启
        agentId: { type: string }
    RouterPushToken:
      type: object
      required: [token, reportUrl, script, installUrl, command, installExpiresAt]
      properties:
        token: { type: string }
        reportUrl: { type: string }
        script:
          type: string
          description: 在路由器上执行的完整安装命令，已经填好地址和令牌。路由器下载不了时手动安装用
        installUrl:
          type: string
          description: 路由器下载安装脚本的地址（B227），15 分钟内有效，只能下载一次
        command:
          type: string
          description: 在路由器的 SSH 里执行的一行命令，下载并运行安装脚本
        installExpiresAt:
          type: string
          format: date-time
          description: installUrl 失效的时间
    RouterInterface:
      type: object
      required: [name, up, ipv4, ipv6]
      properties:
        name:
          type: string
          description: 接口名，比如 wan、lan、wan6
        up: { type: boolean }
        proto:
          type: string
          description: dhcp、pppoe、static 等
        device:
          type: string
          description: 实际的网卡，比如 eth1、pppoe-wan
        ipv4:
          type: array
          items: { type: string }
          description: 带掩码，比如 192.168.1.1/24
        ipv6:
          type: array
          items: { type: string }
        uptimeSeconds:
          type: integer
          format: int64
    RouterStatus:
      type: object
      required: [hostname, model, firmware, uptimeSeconds, interfaces, clientCount, checkedAt, source]
      properties:
        source:
          type: string
          enum: [ubus, push]
          description: ubus 是面板读出来的；push 是路由器上报的，不能从面板重启接口和路由器
        hostname: { type: string }
        model: { type: string }
        firmware:
          type: string
          description: 比如 OpenWrt 24.10.0
        uptimeSeconds:
          type: integer
          format: int64
        memoryTotal:
          type: integer
          format: int64
        memoryAvailable:
          type: integer
          format: int64
        load:
          type: array
          description: 1、5、15 分钟负载
          items:
            type: number
            format: double
        wan:
          $ref: "#/components/schemas/RouterInterface"
        interfaces:
          type: array
          items:
            $ref: "#/components/schemas/RouterInterface"
        rxRate:
          type: number
          format: double
          description: WAN 口下行速率（字节/秒）。第一次读时没有
        txRate:
          type: number
          format: double
          description: WAN 口上行速率（字节/秒）
        clientCount:
          type: integer
          description: 在线设备数
        knownDevices:
          type: integer
          description: mode=push 时，面板记住的设备数（含离线的）
        wifiClients:
          type: integer
          description: mode=push 时，在线的 Wi-Fi 设备数
        wiredClients:
          type: integer
          description: mode=push 时，在线的有线设备数
        checkedAt:
          type: string
          format: date-time
          description: 读取时间。source=push 时是收到上报的时间
    RouterClient:
      type: object
      required: [mac]
      properties:
        mac: { type: string }
        name: { type: string }
        note:
          type: string
          description: mode=push 时，用户给这台设备写的备注
        ip: { type: string }
        ipv6:
          type: array
          items: { type: string }
        leaseExpiresAt:
          type: string
          format: date-time
          description: DHCP 租约到期时间。静态地址没有
        onlineSince:
          type: string
          format: date-time
          description: 面板第一次连续看到它在线的时间。面板重启后重新算
    RouterTrafficPoint:
      type: object
      required: [at, rxRate, txRate]
      properties:
        at:
          type: string
          format: date-time
        rxRate:
          type: number
          format: double
          description: 这段时间的平均下行速率（字节/秒）
        txRate:
          type: number
          format: double
    RouterTraffic:
      type: object
      required: [range, stepSeconds, points, rxBytes, txBytes]
      properties:
        range: { type: string }
        stepSeconds: { type: integer }
        points:
          type: array
          items:
            $ref: "#/components/schemas/RouterTrafficPoint"
        rxBytes:
          type: integer
          format: int64
          description: 这段时间的下行总字节数
        txBytes:
          type: integer
          format: int64
          description: 这段时间的上行总字节数

    RouterDevice:
      type: object
      required: [mac, note, displayName, online, lastSeen, firstSeen, notify, cooldownMinutes]
      properties:
        mac:
          type: string
          description: 大写，冒号分隔
        name:
          type: string
          nullable: true
          description: 主机名（DHCP 租约里的）
        note:
          type: string
          description: 用户写的备注，最多 40 个字。没写是空字符串
        displayName:
          type: string
          description: 备注，没有就用主机名，再没有就用 MAC
        ip:
          type: string
          nullable: true
        ipv6:
          type: array
          items: { type: string }
          description: 最近一次上报里看到的 IPv6 地址。离线的设备没有
        conn:
          type: string
          nullable: true
          enum: [wifi, wired]
          description: 没判断出来（老脚本）是空
        wifiIface:
          type: string
          nullable: true
          description: 连在哪个 Wi-Fi 接口上，比如 wlan0
        online: { type: boolean }
        onlineSince:
          type: string
          format: date-time
          nullable: true
          description: 这次上线的时间。离线时为空
        lastSeen:
          type: string
          format: date-time
        firstSeen:
          type: string
          format: date-time
        leaseExpiresAt:
          type: string
          format: date-time
          nullable: true
        notify:
          type: boolean
          description: 这台设备上下线时是否通知（还要总开关开着）
        cooldownMinutes:
          type: integer
          nullable: true
          description: 再次通知间隔（分钟），空表示跟随默认
        rxRate:
          type: number
          format: double
          nullable: true
          description: B229：下载速率（字节/秒），按最近约 10 秒平均。离线或没有 nlbwmon 数据时为空
        txRate:
          type: number
          format: double
          nullable: true
        todayRx:
          type: integer
          format: int64
          nullable: true
          description: B229：今天（面板时区）的下载字节数。没有 nlbwmon 数据时为空
        todayTx:
          type: integer
          format: int64
          nullable: true
    RouterDeviceUpdate:
      type: object
      required: [note, notify, cooldownMinutes]
      properties:
        note:
          type: string
          maxLength: 40
        notify: { type: boolean }
        cooldownMinutes:
          type: integer
          nullable: true
          description: 只能是 0、5、15、30、60，或者空（跟随默认）
    RouterOptions:
      type: object
      required: [deviceNotify, newDeviceNotify, notifyCooldownMinutes, logDays]
      properties:
        deviceNotify:
          type: boolean
          description: 设备上下线通知的总开关，默认关
        newDeviceNotify:
          type: boolean
          description: 新设备第一次接入时通知（B232），默认开
        notifyCooldownMinutes:
          type: integer
          description: 默认的再次通知间隔，0、5、15、30、60，默认 15
        logDays:
          type: integer
          minimum: 1
          maximum: 15
          description: 事件和系统日志保存几天，默认 7