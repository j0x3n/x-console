openapi: 3.0.3
info:
  title: X Console calendar (M11)
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /calendars:
    get:
      operationId: listCalendars
      tags: [calendar]
      responses:
        "200":
          description: 所有日历，密码不返回
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Calendar" }
    post:
      operationId: createCalendar
      tags: [calendar]
      description: 新建后立即在后台同步一次，完成时发 calendar.synced 事件。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarInput" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Calendar" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /calendars/{calendarId}:
    parameters:
      - $ref: "#/components/parameters/CalendarId"
    get:
      operationId: getCalendar
      tags: [calendar]
      responses:
        "200":
          description: 日历
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Calendar" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    patch:
      operationId: updateCalendar
      tags: [calendar]
      description: 只改传了的字段。password 传空字符串表示清除密码。改了地址或账号会在后台重新同步。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarPatch" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Calendar" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteCalendar
      tags: [calendar]
      description: 删除日历和同步下来的事件
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /calendars/{calendarId}/sync:
    parameters:
      - $ref: "#/components/parameters/CalendarId"
    post:
      operationId: syncCalendar
      tags: [calendar]
      description: 立即同步，等同步结束再返回。同步失败时返回 200，错误写在 lastError 里。
      responses:
        "200":
          description: 同步后的日历
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Calendar" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /calendar/events:
    get:
      operationId: listCalendarEvents
      tags: [calendar]
      description: 范围内的事件。重复事件按用户时区展开成每一次发生。范围最长 100 天。
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: 按开始时间排序
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CalendarEvent" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: createCalendarEvent
      tags: [calendar]
      description: 在可写的日历里新建事件。CalDAV 日历会马上写回服务器，失败时不保存。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventInput" }
      responses:
        "201":
          description: 新建的事件（第一次发生）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarEvent" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /calendar/events/{eventId}:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: updateCalendarEvent
      tags: [calendar]
      description: 改一个不重复的事件。CalDAV 日历会马上写回服务器。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventPatch" }
      responses:
        "200":
          description: 改好的事件
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarEvent" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteCalendarEvent
      tags: [calendar]
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /calendar/accounts:
    get:
      operationId: listCalendarAccounts
      tags: [calendar]
      description: Google 账号（B215）。redirectUri 是要填进 Google 控制台的重定向地址。
      responses:
        "200":
          description: 账号列表
          content:
            application/json:
              schema:
                type: object
                required: [accounts, redirectUri]
                properties:
                  accounts:
                    type: array
                    items: { $ref: "#/components/schemas/CalendarAccount" }
                  redirectUri: { type: string }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: createCalendarAccount
      tags: [calendar]
      description: 新建 Google 账号，填客户端 ID 和密钥。之后调 auth 去授权。要提升权限
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarAccountInput" }
      responses:
        "201":
          description: 新账号，还没授权
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarAccount" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /calendar/accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    patch:
      operationId: updateCalendarAccount
      tags: [calendar]
      description: 改客户端 ID 或密钥。改了客户端 ID 要重新授权。要提升权限
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarAccountInput" }
      responses:
        "200":
          description: 改好的账号
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarAccount" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteCalendarAccount
      tags: [calendar]
      description: 撤销 Google 授权，删掉账号和它下面的日历（只删本地同步的数据）。要提升权限
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /calendar/accounts/{accountId}/auth:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      operationId: startCalendarAccountAuth
      tags: [calendar]
      description: 返回 Google 授权页的地址，前端跳过去。要提升权限
      responses:
        "200":
          description: 授权地址
          content:
            application/json:
              schema:
                type: object
                required: [url, redirectUri]
                properties:
                  url: { type: string }
                  redirectUri: { type: string }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /calendar/google/callback:
    get:
      operationId: calendarGoogleCallback
      tags: [calendar]
      description: |
        Google 授权完跳回来的地址，不用登录，靠一次性 state 校验。
        然后跳到 /calendar/calendars?google=ok&account=<id>，失败时 google=error&message=原因
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302":
          description: 跳回日历管理页
  /calendar/accounts/{accountId}/remote-calendars:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      operationId: listRemoteCalendars
      tags: [calendar]
      description: 这个 Google 账号下的全部日历，标出已经添加的
      responses:
        "200":
          description: 日历列表
          content:
            application/json:
              schema:
                type: object
                required: [calendars]
                properties:
                  calendars:
                    type: array
                    items: { $ref: "#/components/schemas/RemoteCalendar" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: addRemoteCalendars
      tags: [calendar]
      description: 把勾选的 Google 日历加进来，已经加过的跳过。加完在后台同步
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string }
                  minItems: 1
                  maxItems: 50
      responses:
        "201":
          description: 新加的日历
          content:
            application/json:
              schema:
                type: object
                required: [calendars]
                properties:
                  calendars:
                    type: array
                    items: { $ref: "#/components/schemas/Calendar" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    CalendarId:
      name: calendarId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    CalendarAccount:
      type: object
      required: [id, provider, email, clientId, secretSet, authorized, authError, calendarCount, createdAt]
      properties:
        id: { type: integer, format: int64 }
        provider: { type: string, enum: [google] }
        email: { type: string, description: 授权的 Google 账号，没授权时为空 }
        clientId: { type: string }
        secretSet: { type: boolean }
        authorized: { type: boolean, description: 有 refresh token }
        authError: { type: string, description: 授权过期时的提示，正常时为空 }
        calendarCount: { type: integer }
        createdAt: { type: string, format: date-time }
    CalendarAccountInput:
      type: object
      properties:
        clientId: { type: string }
        clientSecret: { type: string, description: 加密保存，不会再返回。修改时留空表示不改 }
    RemoteCalendar:
      type: object
      required: [id, name, color, readOnly, primary, added]
      properties:
        id: { type: string, description: Google 的日历 ID }
        name: { type: string }
        color: { type: string }
        readOnly: { type: boolean, description: 只能看不能改（节假日、别人只读共享的） }
        primary: { type: boolean }
        added: { type: boolean }
    CalendarKind:
      type: string
      description: ics 订阅链接，只读；caldav 可以读写（iCloud 等）；local 存在自己服务器上的日历
      enum: [ics, caldav, local]
    Calendar:
      type: object
      required: [id, name, kind, url, username, hasPassword, color, enabled, lastError, eventCount, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { $ref: "#/components/schemas/CalendarKind" }
        url: { type: string }
        username: { type: string }
        hasPassword: { type: boolean }
        color: { type: string, description: "#rrggbb，空表示默认色" }
        enabled: { type: boolean }
        lastSyncedAt: { type: string, format: date-time }
        lastError: { type: string, description: 上次同步的错误，成功时为空 }
        eventCount: { type: integer, description: 同步下来的事件条数（重复事件算一条） }
        writable:
          type: boolean
          description: 能不能在这个日历里新建和修改事件。local 和 caldav 为 true，ics 和只读的 Google 日历为 false
        accountId: { type: integer, format: int64, description: 属于哪个 Google 账号（B215），没有表示自己填的地址 }
        createdAt: { type: string, format: date-time }
    CalendarInput:
      type: object
      required: [name, kind, url]
      properties:
        name: { type: string }
        kind: { $ref: "#/components/schemas/CalendarKind" }
        url:
          type: string
          description: ICS 订阅地址（webcal:// 也可以），或 CalDAV 日历集合、日历主目录的地址
        username: { type: string }
        password: { type: string, description: 加密保存，不会再返回 }
        color: { type: string }
        enabled: { type: boolean }
    CalendarPatch:
      type: object
      properties:
        name: { type: string }
        url: { type: string }
        username: { type: string }
        password: { type: string }
        color: { type: string }
        enabled: { type: boolean }
    CalendarEvent:
      type: object
      required: [id, eventId, calendarId, calendar, color, title, start, end, allDay, location, description, recurring]
      properties:
        id: { type: string, description: 每次发生唯一，事件 id 加开始时间 }
        eventId: { type: integer, format: int64 }
        calendarId: { type: integer, format: int64 }
        calendar: { type: string, description: 日历名 }
        color: { type: string }
        title: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        allDay: { type: boolean }
        startDate: { type: string, description: 全天事件的开始日期 YYYY-MM-DD }
        endDate: { type: string, description: 全天事件的结束日期 YYYY-MM-DD（不含） }
        location: { type: string }
        description: { type: string }
        recurring: { type: boolean }
        writable:
          type: boolean
          description: 能不能改。日历可写且不是重复事件时为 true
    EventInput:
      type: object
      required: [calendarId, title, allDay]
      properties:
        calendarId: { type: integer, format: int64 }
        title: { type: string, minLength: 1, maxLength: 200 }
        allDay: { type: boolean }
        start: { type: string, format: date-time, description: 不是全天事件时必填 }
        end: { type: string, format: date-time, description: 不是全天事件时必填 }
        startDate: { type: string, description: 全天事件的开始日期 YYYY-MM-DD }
        endDate: { type: string, description: 全天事件的结束日期 YYYY-MM-DD（不含） }
        location: { type: string }
        description: { type: string }
    EventPatch:
      type: object
      properties:
        calendarId: { type: integer, format: int64, description: 移到另一个可写的日历 }
        title: { type: string, minLength: 1, maxLength: 200 }
        allDay: { type: boolean }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        startDate: { type: string }
        endDate: { type: string }
        location: { type: string }
        description: { type: string }
