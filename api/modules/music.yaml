openapi: 3.0.3
info:
  title: X Console music (B146 library and playback)
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /music/tracks:
    get:
      operationId: listMusicTracks
      tags: [music]
      description: 曲库里的歌。q 用空格分成多个词，每个词都要命中。三个字以上的词搜歌名、歌手、专辑和歌词，少于三个字的词只搜歌名、歌手和专辑。分页的 cursor 只能原样传回。
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: artist
          in: query
          description: 歌手名，要完全相同
          schema: { type: string }
        - name: album
          in: query
          description: 专辑名，要完全相同
          schema: { type: string }
        - name: favorite
          in: query
          schema: { type: boolean }
        - name: driveItemId
          in: query
          description: 云盘里的文件编号。云盘页点音频文件时用它找对应的歌
          schema: { type: integer, format: int64 }
        - name: sort
          in: query
          description: 默认 artist（歌手、专辑、碟号、曲目号、歌名）。recent 只列播放过的，最近的在前
          schema: { type: string, enum: [artist, title, album, added, recent, plays] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - $ref: "../common.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: 一页歌曲
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicTrackPage" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /music/tracks/{trackId}:
    parameters:
      - $ref: "#/components/parameters/TrackId"
    get:
      operationId: getMusicTrack
      tags: [music]
      responses:
        "200":
          description: 一首歌
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicTrack" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    patch:
      operationId: updateMusicTrack
      tags: [music]
      description: 改收藏，或手动改歌名、歌手、专辑。手动改过的字段，重新扫描时不会被文件里的标签覆盖。只存数据库，不写进文件。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MusicTrackPatch" }
      responses:
        "200":
          description: 更新后的歌
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicTrack" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /music/tracks/{trackId}/stream:
    parameters:
      - $ref: "#/components/parameters/TrackId"
    get:
      operationId: streamMusicTrack
      tags: [music]
      description: 歌曲内容，支持 Range 请求。歌所在的文件被删除、进回收站或设为隐藏时回 404。
      responses:
        "200":
          description: 音频
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        "206":
          description: 部分内容
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /music/tracks/{trackId}/cover:
    parameters:
      - $ref: "#/components/parameters/TrackId"
    get:
      operationId: getMusicTrackCover
      tags: [music]
      description: 封面。没有封面回 404。
      parameters:
        - name: size
          in: query
          description: 最长边像素，默认 256。原图比它小时不放大
          schema: { type: integer, enum: [96, 256, 640] }
      responses:
        "200":
          description: JPEG 封面
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: uploadMusicTrackCover
      tags: [music]
      description: 上传封面图（JPEG、PNG、WebP，最大 20 MB），请求体就是图片内容。writeBack 不传时用设置里的“写回文件”。
      parameters:
        - name: writeBack
          in: query
          schema: { type: boolean }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: 更新后的歌
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicTrack" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /music/tracks/{trackId}/lyrics:
    parameters:
      - $ref: "#/components/parameters/TrackId"
    get:
      operationId: getMusicTrackLyrics
      tags: [music]
      description: 已解析的歌词。没有歌词时 lines 为空。没有时间轴时每行没有 timeMs。
      responses:
        "200":
          description: 歌词
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicLyrics" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    put:
      operationId: putMusicTrackLyrics
      tags: [music]
      description: 手动设置歌词，纯文本或 LRC。writeBack 不传时用设置里的“写回文件”。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                writeBack: { type: boolean }
      responses:
        "200":
          description: 更新后的歌
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicTrack" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /music/tracks/{trackId}/played:
    parameters:
      - $ref: "#/components/parameters/TrackId"
    post:
      operationId: reportMusicPlayed
      tags: [music]
      description: 前端播放超过 30 秒或超过一半时上报一次。播放次数加一，更新最近播放时间。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seconds]
              properties:
                seconds: { type: integer, minimum: 0, maximum: 86400, description: 这次听了多少秒 }
      responses:
        "200":
          description: 更新后的歌
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicTrack" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /music/albums:
    get:
      operationId: listMusicAlbums
      tags: [music]
      responses:
        "200":
          description: 按专辑分组。专辑歌手没有时用歌手
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MusicAlbum" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /music/artists:
    get:
      operationId: listMusicArtists
      tags: [music]
      responses:
        "200":
          description: 按歌手分组。歌手字段按原样分组，不拆开多个歌手
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MusicArtist" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /music/playlists:
    get:
      operationId: listMusicPlaylists
      tags: [music]
      responses:
        "200":
          description: 播放列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MusicPlaylist" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: createMusicPlaylist
      tags: [music]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MusicPlaylistCreate" }
      responses:
        "201":
          description: 新建的播放列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicPlaylistDetail" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /music/playlists/{playlistId}:
    parameters:
      - $ref: "#/components/parameters/PlaylistId"
    get:
      operationId: getMusicPlaylist
      tags: [music]
      responses:
        "200":
          description: 播放列表和里面的歌，按顺序
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicPlaylistDetail" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    patch:
      operationId: updateMusicPlaylist
      tags: [music]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        "200":
          description: 更新后的播放列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicPlaylistDetail" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteMusicPlaylist
      tags: [music]
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /music/playlists/{playlistId}/items:
    parameters:
      - $ref: "#/components/parameters/PlaylistId"
    put:
      operationId: setMusicPlaylistItems
      tags: [music]
      description: 整体设置里面的歌和顺序。重复的歌只留第一次出现的，不存在的歌回 400。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MusicTrackIds" }
      responses:
        "200":
          description: 更新后的播放列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicPlaylistDetail" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: addMusicPlaylistItems
      tags: [music]
      description: 往末尾加歌。已经在里面的歌跳过，不存在的歌回 400。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MusicTrackIds" }
      responses:
        "200":
          description: 更新后的播放列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicPlaylistDetail" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /music/pending:
    get:
      operationId: listMusicPending
      tags: [music]
      description: 在线匹配没法确定的歌，每首带最多 5 个候选，让用户选。选定用 POST /music/tracks/{trackId}/match，都不对用 POST /music/tracks/{trackId}/skip。
      responses:
        "200":
          description: 待确认的歌
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MusicPending" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /music/match:
    post:
      operationId: matchMusic
      tags: [music]
      description: 在后台给还没匹配过的歌匹配歌词和封面。retryFailed 为 true 时，以前匹配失败的也重试。进度用 music.match_progress 事件。
      parameters:
        - name: retryFailed
          in: query
          schema: { type: boolean }
      responses:
        "202":
          description: 已开始。已经在匹配时也回 202
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicScanStatus" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /music/tracks/{trackId}/match:
    parameters:
      - $ref: "#/components/parameters/TrackId"
    post:
      operationId: matchMusicTrack
      tags: [music]
      description: |
        手动匹配这首歌，等匹配完成再返回，最长约半分钟。
        不带 candidate：按自动匹配的规则找。overwrite 为 true 时，已经有的歌词和封面也换掉。
        带 candidate：用待确认列表里选的那个候选的歌词和封面，直接换掉现有的。
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MusicMatchRequest" }
      responses:
        "200":
          description: 匹配后的歌。matchState 是 matched、pending 或 failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicTrack" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /music/tracks/{trackId}/skip:
    parameters:
      - $ref: "#/components/parameters/TrackId"
    post:
      operationId: skipMusicMatch
      tags: [music]
      description: 待确认的候选都不对，跳过。matchState 变成 skipped，不再自动匹配。
      responses:
        "200":
          description: 更新后的歌
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicTrack" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /music/sleep:
    get:
      operationId: getMusicSleep
      tags: [music]
      description: 定时暂停的状态。放在服务端，换页面和设备都能看到。
      responses:
        "200":
          description: 当前状态，没有定时时 active 为 false
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicSleep" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    put:
      operationId: putMusicSleep
      tags: [music]
      description: |
        设定时。minutes、tracks、extendMinutes 三选一，同时传多个回 400。
        minutes：几分钟后暂停，到点服务端发 music.sleep_fired，所有打开的页面一起暂停。
        tracks：再播几首就停（播完当前这首是 1），由正在出声的页面数歌，每播完一首用它更新剩余数。
        extendMinutes：在已有的分钟定时上加时间，没有分钟定时时回 400。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MusicSleepInput" }
      responses:
        "200":
          description: 新状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicSleep" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteMusicSleep
      tags: [music]
      description: 取消定时。没有定时时也回 204。
      responses:
        "204":
          description: 已取消
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /music/playlists/{playlistId}/shares:
    parameters:
      - $ref: "#/components/parameters/PlaylistId"
    get:
      operationId: listMusicShares
      tags: [music]
      responses:
        "200":
          description: 这个播放列表的分享链接
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MusicShare" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: createMusicShare
      tags: [music]
      description: 创建公开链接。有密码时访问的人要先输密码。链接只能播这个播放列表里的歌。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MusicShareInput" }
      responses:
        "201":
          description: 新链接
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicShare" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /music/shares/{shareId}:
    delete:
      operationId: deleteMusicShare
      tags: [music]
      description: 撤销分享，链接立即失效。
      parameters:
        - name: shareId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204":
          description: 已撤销
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /public/music/{token}:
    parameters:
      - $ref: "#/components/parameters/ShareToken"
    get:
      operationId: getPublicMusicShare
      tags: [music]
      security: []
      description: 不用登录。分享的播放列表和里面的歌。有密码且 access 无效时回 401 share_code_required。
      parameters:
        - $ref: "#/components/parameters/ShareAccess"
      responses:
        "200":
          description: 播放列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicPublicPlaylist" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /public/music/{token}/unlock:
    parameters:
      - $ref: "#/components/parameters/ShareToken"
    post:
      operationId: unlockPublicMusicShare
      tags: [music]
      security: []
      description: 输密码换一个 1 小时有效的 access。同一个地址连续输错 5 次锁 15 分钟。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: 访问令牌
          content:
            application/json:
              schema:
                type: object
                required: [access, expiresAt]
                properties:
                  access: { type: string }
                  expiresAt: { type: string, format: date-time }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /public/music/{token}/tracks/{trackId}/stream:
    parameters:
      - $ref: "#/components/parameters/ShareToken"
      - $ref: "#/components/parameters/TrackId"
    get:
      operationId: streamPublicMusicTrack
      tags: [music]
      security: []
      description: 分享的歌曲内容，支持 Range。不在这个播放列表里的歌回 404。
      parameters:
        - $ref: "#/components/parameters/ShareAccess"
      responses:
        "200":
          description: 音频
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        "206":
          description: 部分内容
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /public/music/{token}/tracks/{trackId}/cover:
    parameters:
      - $ref: "#/components/parameters/ShareToken"
      - $ref: "#/components/parameters/TrackId"
    get:
      operationId: getPublicMusicTrackCover
      tags: [music]
      security: []
      parameters:
        - $ref: "#/components/parameters/ShareAccess"
        - name: size
          in: query
          schema: { type: integer, enum: [96, 256, 640] }
      responses:
        "200":
          description: JPEG 封面
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /public/music/{token}/tracks/{trackId}/lyrics:
    parameters:
      - $ref: "#/components/parameters/ShareToken"
      - $ref: "#/components/parameters/TrackId"
    get:
      operationId: getPublicMusicTrackLyrics
      tags: [music]
      security: []
      parameters:
        - $ref: "#/components/parameters/ShareAccess"
      responses:
        "200":
          description: 歌词
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicLyrics" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /music/stats:
    get:
      operationId: getMusicStats
      tags: [music]
      description: 听歌统计。一次播放指听满 30 秒或一半以上。专注期间的播放单独算。只给数字，不下结论。
      parameters:
        - name: days
          in: query
          description: 最近几天，含今天。默认 30，最多 365
          schema: { type: integer, minimum: 1, maximum: 365 }
      responses:
        "200":
          description: 统计
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicStats" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /music/settings:
    get:
      operationId: getMusicSettings
      tags: [music]
      responses:
        "200":
          description: 音乐设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicSettings" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    put:
      operationId: putMusicSettings
      tags: [music]
      description: 设置音乐目录。目录必须是云盘里存在、没有隐藏、不在回收站的文件夹。改完立即在后台重新扫描。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MusicSettingsInput" }
      responses:
        "200":
          description: 保存后的设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicSettings" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /music/scan:
    post:
      operationId: scanMusic
      tags: [music]
      description: 在后台重新扫描音乐目录。已经在扫描时也回 202。完成时发 music.library_changed 事件。
      responses:
        "202":
          description: 已开始
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicScanStatus" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
components:
  parameters:
    ShareToken:
      name: token
      in: path
      required: true
      schema: { type: string }
    ShareAccess:
      name: access
      in: query
      description: 输密码后拿到的访问令牌。没有密码的分享不用传
      schema: { type: string }
    TrackId:
      name: trackId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PlaylistId:
      name: playlistId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    MusicTrack:
      type: object
      required: [id, driveItemId, title, artist, album, albumArtist, trackNo, discNo, year, durationMs, bitrate, format, hasCover, coverSource, lyricsSource, lyricsSynced, favorite, playCount, matchState, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        driveItemId: { type: integer, format: int64, description: 云盘里的文件编号 }
        title: { type: string }
        artist: { type: string, description: 没有时为空字符串，界面显示“未知歌手” }
        album: { type: string }
        albumArtist: { type: string }
        trackNo: { type: integer, description: 没有时为 0 }
        discNo: { type: integer }
        year: { type: integer }
        durationMs: { type: integer }
        bitrate: { type: integer, description: 单位 kbps }
        format: { type: string, description: 小写扩展名，例如 mp3、flac }
        hasCover: { type: boolean }
        coverSource: { type: string, enum: [embedded, folder, online, none] }
        lyricsSource: { type: string, enum: [embedded, lrc, online, none] }
        lyricsSynced: { type: boolean, description: 歌词带时间轴 }
        favorite: { type: boolean }
        playCount: { type: integer }
        lastPlayedAt: { type: string, format: date-time }
        matchState: { type: string, enum: [none, matched, pending, failed, skipped], description: 在线匹配的状态，B148 起使用 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MusicTrackPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MusicTrack" }
        total: { type: integer, description: 符合条件的总数 }
        nextCursor: { type: string, description: 没有下一页时没有这个字段 }
    MusicTrackPatch:
      type: object
      properties:
        favorite: { type: boolean }
        title: { type: string }
        artist: { type: string }
        album: { type: string }
        albumArtist: { type: string }
    MusicLyricLine:
      type: object
      required: [text]
      properties:
        timeMs: { type: integer, description: 没有时间轴时没有这个字段 }
        text: { type: string }
    MusicLyrics:
      type: object
      required: [synced, source, lines]
      properties:
        synced: { type: boolean }
        source: { type: string, enum: [embedded, lrc, online, none] }
        lines:
          type: array
          items: { $ref: "#/components/schemas/MusicLyricLine" }
    MusicAlbum:
      type: object
      required: [album, albumArtist, year, trackCount, durationMs, coverTrackId]
      properties:
        album: { type: string }
        albumArtist: { type: string }
        year: { type: integer }
        trackCount: { type: integer }
        durationMs: { type: integer }
        coverTrackId: { type: integer, format: int64, description: 用它的封面做专辑封面，没有封面时为 0 }
    MusicArtist:
      type: object
      required: [artist, trackCount, albumCount, coverTrackId]
      properties:
        artist: { type: string }
        trackCount: { type: integer }
        albumCount: { type: integer }
        coverTrackId: { type: integer, format: int64 }
    MusicPlaylist:
      type: object
      required: [id, name, trackCount, durationMs, coverTrackIds, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        trackCount: { type: integer }
        durationMs: { type: integer }
        coverTrackIds:
          type: array
          description: 前 4 首有封面的歌，用来拼封面
          items: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MusicPlaylistDetail:
      allOf:
        - $ref: "#/components/schemas/MusicPlaylist"
        - type: object
          required: [tracks]
          properties:
            tracks:
              type: array
              items: { $ref: "#/components/schemas/MusicTrack" }
    MusicPlaylistCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        trackIds:
          type: array
          items: { type: integer, format: int64 }
    MusicTrackIds:
      type: object
      required: [trackIds]
      properties:
        trackIds:
          type: array
          items: { type: integer, format: int64 }
    MusicFolder:
      type: object
      required: [id, name, path]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        path: { type: string }
    MusicSettings:
      type: object
      required: [folders, autoMatch, writeBack, providers, focus]
      properties:
        focus: { $ref: "#/components/schemas/MusicFocusSettings" }
        folders:
          type: array
          description: 音乐目录。里面已经不存在的目录不会列出
          items: { $ref: "#/components/schemas/MusicFolder" }
        autoMatch: { type: boolean, description: 入库后自动在线匹配缺的歌词和封面。默认开 }
        writeBack: { type: boolean, description: 匹配到的歌词和封面写进歌曲文件，不保留旧版本。默认开 }
        providers:
          type: object
          description: 各个来源是否启用，键是 lrclib、netease、qqmusic、itunes、musicbrainz。默认全开
          additionalProperties: { type: boolean }
    MusicSettingsInput:
      type: object
      description: 只改传了的字段。providers 只改传了的来源，focus 里传了的字段才改
      properties:
        focus:
          type: object
          properties:
            autoPlay: { type: boolean }
            playlistId: { type: integer, format: int64 }
            autoPause: { type: boolean }
            onlyFocusList: { type: boolean }
        folders:
          type: array
          description: 云盘文件夹编号，最多 20 个。一个目录在另一个目录里时只保留外层的
          maxItems: 20
          items: { type: integer, format: int64 }
        autoMatch: { type: boolean }
        writeBack: { type: boolean }
        providers:
          type: object
          additionalProperties: { type: boolean }
    MusicCandidate:
      type: object
      required: [source, sourceId, title, artist, album, durationMs, lyrics, cover]
      properties:
        source: { type: string, enum: [lrclib, netease, qqmusic, itunes, musicbrainz] }
        sourceId: { type: string }
        title: { type: string }
        artist: { type: string }
        album: { type: string }
        durationMs: { type: integer, description: 来源没给时为 0 }
        lyrics: { type: boolean, description: 这个候选能提供歌词 }
        cover: { type: boolean, description: 这个候选能提供封面 }
    MusicPending:
      type: object
      required: [track, candidates]
      properties:
        track: { $ref: "#/components/schemas/MusicTrack" }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/MusicCandidate" }
    MusicMatchRequest:
      type: object
      properties:
        candidate:
          type: object
          required: [source, sourceId]
          properties:
            source: { type: string }
            sourceId: { type: string }
        overwrite: { type: boolean }
    MusicSleep:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
        mode: { type: string, enum: [time, tracks] }
        endsAt: { type: string, format: date-time, description: 分钟定时的结束时间 }
        tracksLeft: { type: integer, description: 按首数定时时还要播几首 }
    MusicSleepInput:
      type: object
      properties:
        minutes: { type: integer, minimum: 1, maximum: 720 }
        tracks: { type: integer, minimum: 1, maximum: 20 }
        extendMinutes: { type: integer, minimum: 1, maximum: 120 }
    MusicShare:
      type: object
      required: [id, playlistId, path, hasPassword, viewCount, createdAt]
      properties:
        id: { type: integer, format: int64 }
        playlistId: { type: integer, format: int64 }
        path: { type: string, description: 链接的路径，例如 /m/abc。前面接面板的地址就是完整链接 }
        hasPassword: { type: boolean }
        expiresAt: { type: string, format: date-time }
        viewCount: { type: integer }
        createdAt: { type: string, format: date-time }
    MusicShareInput:
      type: object
      properties:
        password: { type: string, minLength: 1, maxLength: 64 }
        expiresInDays: { type: integer, minimum: 1, maximum: 365, description: 不传表示不过期 }
    MusicPublicTrack:
      type: object
      required: [id, title, artist, album, durationMs, hasCover, hasLyrics]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        artist: { type: string }
        album: { type: string }
        durationMs: { type: integer }
        hasCover: { type: boolean }
        hasLyrics: { type: boolean }
    MusicPublicPlaylist:
      type: object
      required: [name, tracks]
      properties:
        name: { type: string }
        tracks:
          type: array
          items: { $ref: "#/components/schemas/MusicPublicTrack" }
    MusicFocusSettings:
      type: object
      required: [autoPlay, playlistId, autoPause, onlyFocusList]
      properties:
        autoPlay: { type: boolean, description: 专注开始时自动播放。默认关 }
        playlistId: { type: integer, format: int64, description: 自动播放用的播放列表，0 表示用当前队列 }
        autoPause: { type: boolean, description: 专注结束或停止时暂停。默认关 }
        onlyFocusList: { type: boolean, description: 专注期间队列只用上面的播放列表，结束后恢复原来的队列。默认关 }
    MusicPlayStat:
      type: object
      required: [title, artist, plays, seconds]
      properties:
        trackId: { type: integer, format: int64, description: 歌已经不在曲库时没有 }
        title: { type: string }
        artist: { type: string }
        plays: { type: integer }
        seconds: { type: integer }
    MusicArtistStat:
      type: object
      required: [artist, plays, seconds]
      properties:
        artist: { type: string }
        plays: { type: integer }
        seconds: { type: integer }
    MusicStats:
      type: object
      required: [days, totalSeconds, plays, focusSeconds, focusPlays, topTracks, topArtists, focusTopTracks]
      properties:
        days: { type: integer }
        totalSeconds: { type: integer }
        plays: { type: integer }
        focusSeconds: { type: integer, description: 专注期间听的秒数 }
        focusPlays: { type: integer }
        topTracks:
          type: array
          description: 播放次数最多的 10 首，次数相同按听的时长
          items: { $ref: "#/components/schemas/MusicPlayStat" }
        topArtists:
          type: array
          items: { $ref: "#/components/schemas/MusicArtistStat" }
        focusTopTracks:
          type: array
          description: 专注期间播放最多的 10 首
          items: { $ref: "#/components/schemas/MusicPlayStat" }
    MusicScanStatus:
      type: object
      required: [running]
      properties:
        running: { type: boolean }
