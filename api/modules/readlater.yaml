openapi: 3.0.3
info:
  title: X Console readlater (B117)
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /readlater:
    get:
      operationId: listReadItems
      tags: [readlater]
      description: |
        存过的链接，新的在前。列表里没有正文。数量不受 view、tag、q 的限制。
      parameters:
        - name: view
          in: query
          schema: { type: string, enum: [unread, read, all], default: unread }
        - name: tag
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: 在标题、网址、摘要、备注和正文里找
          schema: { type: string }
      responses:
        "200":
          description: 列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadList" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: createReadItem
      tags: [readlater]
      description: |
        存一个链接，马上返回，正文在后台抓。网址只收 http 和 https。
        已经存过的返回已有的那条，duplicate 为 true。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReadItemInput" }
      responses:
        "200":
          description: 已经存过
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadItemResult" }
        "201":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadItemResult" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /readlater/{itemId}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      operationId: getReadItem
      tags: [readlater]
      responses:
        "200":
          description: 详情，带正文（content）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadItem" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    patch:
      operationId: updateReadItem
      tags: [readlater]
      description: 只改给出的字段。read 为 true 标记已读，false 标记未读。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReadItemPatch" }
      responses:
        "200":
          description: 已修改
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadItem" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteReadItem
      tags: [readlater]
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /readlater/{itemId}/refetch:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      operationId: refetchReadItem
      tags: [readlater]
      description: 重新抓取网页。保留你改过的标题和标签，摘要为空时重新写。
      responses:
        "200":
          description: 已排队重新抓取
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadItem" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /readlater/{itemId}/summarize:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      operationId: summarizeReadItem
      tags: [readlater]
      description: 用 AI 重新写摘要和标签。AI 没配置回 409。正文还没抓到时回 409。
      responses:
        "200":
          description: 新的摘要和标签
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadItem" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /readlater/{itemId}/assets/{hash}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
      - name: hash
        in: path
        required: true
        schema: { type: string, pattern: "^[0-9a-f]{64}$" }
    get:
      operationId: getReadAsset
      tags: [readlater]
      description: 存档里的一张图片。需要登录。图片内容不会变，浏览器可以长期缓存。
      responses:
        "200":
          description: 图片
          content:
            image/*:
              schema: { type: string, format: binary }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /readlater/{itemId}/export:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      operationId: exportReadItem
      tags: [readlater]
      description: 下载单个 HTML 文件。图片内联成 data URI，断网也能打开。
      responses:
        "200":
          description: HTML 文件
          content:
            text/html:
              schema: { type: string, format: binary }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /readlater/x-auth:
    get:
      operationId: getReadXAuth
      tags: [readlater]
      description: 读取 X 推文用的设置。不返回 Cookie 内容。
      responses:
        "200":
          description: 当前设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XAuth" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    put:
      operationId: saveReadXAuth
      tags: [readlater]
      description: |
        保存 X 登录 Cookie 和相关设置，需要提权。authToken 和 ct0 要一起给，都不给就只改其他设置。
        Cookie 加密存储。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/XAuthInput" }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XAuth" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: clearReadXAuth
      tags: [readlater]
      description: 清除 X 登录 Cookie，需要提权。其他设置保留。
      responses:
        "200":
          description: 已清除
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XAuth" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /readlater/x-auth/test:
    post:
      operationId: testReadXAuth
      tags: [readlater]
      description: 用 Cookie 读一条固定的公开推文，成功就记下验证时间。
      responses:
        "200":
          description: 测试结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XAuth" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
components:
  parameters:
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    ReadStatus:
      type: string
      description: queued 等着抓，ready 抓好了，failed 抓取失败
      enum: [queued, ready, failed]
    ReadItem:
      type: object
      required: [id, url, title, site, excerpt, summary, tags, note, source, status, error, hasContent, hasHtml, kind, meta, read, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        url: { type: string }
        title: { type: string, description: 没抓到标题时是网址里的主机名 }
        site: { type: string }
        excerpt: { type: string, description: 网页自己写的描述 }
        summary: { type: string, description: AI 写的摘要，最多三行，没有为空字符串 }
        tags:
          type: array
          items: { type: string }
        note: { type: string }
        source: { type: string, enum: [web, share, telegram, ai] }
        status: { $ref: "#/components/schemas/ReadStatus" }
        error: { type: string, description: 抓取失败的原因 }
        hasContent: { type: boolean }
        hasHtml: { type: boolean, description: 有存档的图文 HTML }
        kind: { type: string, enum: [page, tweet] }
        meta:
          type: object
          description: 推文的作者、发布时间、用哪一步读到的、内容是否不完整等
          additionalProperties: true
        read: { type: boolean }
        content: { type: string, description: 存档的正文，纯文本。只有详情接口给，列表里没有 }
        contentHtml: { type: string, description: 存档的图文 HTML，已清理，图片是本站地址。只有详情接口给 }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        fetchedAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }
    ReadItemResult:
      type: object
      required: [item, duplicate]
      properties:
        item: { $ref: "#/components/schemas/ReadItem" }
        duplicate: { type: boolean }
    ReadCounts:
      type: object
      required: [unread, read, all, failed]
      properties:
        unread: { type: integer }
        read: { type: integer }
        all: { type: integer }
        failed: { type: integer }
    ReadTag:
      type: object
      required: [tag, count]
      properties:
        tag: { type: string }
        count: { type: integer }
    ReadList:
      type: object
      required: [items, counts, tags]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ReadItem" }
        counts: { $ref: "#/components/schemas/ReadCounts" }
        tags:
          type: array
          description: 用得最多的 30 个标签
          items: { $ref: "#/components/schemas/ReadTag" }
    ReadItemInput:
      type: object
      required: [url]
      properties:
        url: { type: string }
        note: { type: string }
        source: { type: string, enum: [web, share] }
    ReadItemPatch:
      type: object
      properties:
        title: { type: string }
        tags:
          type: array
          items: { type: string }
        note: { type: string }
        read: { type: boolean }
    XAuth:
      type: object
      required: [configured, status, fxtwitter, queryId]
      properties:
        configured: { type: boolean, description: 是否保存了 Cookie }
        status:
          type: string
          description: none 没配置，unverified 还没验证，ok 可用，expired Cookie 可能过期，error 上次测试失败
          enum: [none, unverified, ok, expired, error]
        message: { type: string, description: 上次测试或抓取失败的原因 }
        verifiedAt: { type: string, format: date-time, nullable: true }
        fxtwitter: { type: boolean, description: 前两步失败时是否用第三方转换服务 }
        queryId: { type: string, description: GraphQL 接口的 queryId，空表示用内置的 }
    XAuthInput:
      type: object
      properties:
        authToken: { type: string }
        ct0: { type: string }
        fxtwitter: { type: boolean }
        queryId: { type: string }
