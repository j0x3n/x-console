openapi: 3.0.3
info:
  title: X Console AI agents (B47 Agent management and Git connections)
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /ai-agents:
    get:
      operationId: listAiAgents
      tags: [aiagents]
      description: 全部 Agent，带本月费用和正在跑的任务数。
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AiAgent" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: createAiAgent
      tags: [aiagents]
      description: 新建 Agent。CLI 权限选 full 时要提升权限。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiAgentInput" }
      responses:
        "201":
          description: 新 Agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgent" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /ai-agents/{agentId}:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getAiAgent
      tags: [aiagents]
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgent" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    patch:
      operationId: updateAiAgent
      tags: [aiagents]
      description: 只改传了的字段。runnerAgentId、monthlyBudgetUsd 传 null 表示清空。改成 full 权限或改仓库范围要提升权限。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiAgentInput" }
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgent" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteAiAgent
      tags: [aiagents]
      description: 删除 Agent。有正在跑的任务时回 409。历史任务保留，不再关联这个 Agent。
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /ai-agents/{agentId}/assign:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: assignAiAgent
      tags: [aiagents]
      description: 把卡片分配给 Agent。CLI 类型建一个编码任务，内置类型直接在后台处理卡片。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issueKey]
              properties:
                issueKey: { type: string }
                repoId:
                  type: integer
                  format: int64
                  description: |
                    CLI 类型要在 Agent 允许的仓库里。B86：不传时用卡片所在看板绑定的仓库，
                    这台机器上还没有这个仓库就先 clone；看板也没绑定时回 409，code 是 board_repo_missing

                baseBranch: { type: string, description: 不传用仓库默认分支 }
                runnerAgentId: { type: string, description: 不传用 Agent 的默认机器 }
                note: { type: string, maxLength: 4000, description: 这次额外的要求 }
                openPr:
                  type: boolean
                  description: B86。CLI 类型做完（开了自动构建时要构建通过）后自动提交、推送并提 PR，PR 地址写回卡片。不传按 true
      responses:
        "202":
          description: 已开始
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskId: { type: integer, format: int64, description: 编码任务 id，内置类型没有 }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /ai-agents/runs:
    get:
      operationId: listAiAgentRuns
      tags: [aiagents]
      description: |
        B86。Agent 的执行记录，新的在前。两种类型都有：CLI 类型的一条记录对应一个编码任务（带 taskId，日志用编码任务的输出），
        内置类型的日志用 /ai-agents/runs/{runId}/events。
      parameters:
        - { name: agentId, in: query, schema: { type: integer, format: int64 } }
        - { name: issueKey, in: query, schema: { type: string } }
        - $ref: "../common.yaml#/components/parameters/Limit"
      responses:
        "200":
          description: 执行记录
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AiAgentRun" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /ai-agents/runs/{runId}/events:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: listAiAgentRunEvents
      tags: [aiagents]
      description: B86。一次执行的日志，按 seq 从小到大。after 传上次的最大 seq 只取新的。执行中有新日志时发 ai_agent.run_event 事件
      parameters:
        - { name: after, in: query, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: 日志
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AiAgentRunEvent" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /ai-agents/runs/{runId}/cancel:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: cancelAiAgentRun
      tags: [aiagents]
      description: B86。中断一次执行。CLI 类型等于取消对应的编码任务
      responses:
        "204":
          description: 已中断
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /ai-agents/decisions:
    get:
      operationId: listAiAgentDecisions
      tags: [aiagents]
      description: |
        B87。等你决定的事：Agent 的权限请求（要执行需要确认的操作）和问题（Agent 问你怎么做）。
        只返回还没处理的，旧的在前。也包括 AI 助手会话里等确认的动作（kind=permission，带 conversationId）
      responses:
        "200":
          description: 等你决定的事
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AiAgentDecision" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /ai-agents/decisions/{decisionId}:
    parameters:
      - { name: decisionId, in: path, required: true, schema: { type: string } }
    post:
      operationId: answerAiAgentDecision
      tags: [aiagents]
      description: B87。处理一条：权限请求传 approve；问题传 answer（选了某个选项就传选项原文）。处理后发 ai_agent.decision 事件
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approve: { type: boolean }
                answer: { type: string, maxLength: 4000 }
      responses:
        "204":
          description: 已处理
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /ai-agents/notify:
    get:
      operationId: getAiAgentNotify
      tags: [aiagents]
      description: B87。Agent 的通知开关。每类单独开关，发到哪里照“设置 → 通知”的规则
      responses:
        "200":
          description: 开关
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgentNotify" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    put:
      operationId: putAiAgentNotify
      tags: [aiagents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiAgentNotify" }
      responses:
        "200":
          description: 保存后的开关
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgentNotify" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /git-connections:
    get:
      operationId: listGitConnections
      tags: [aiagents]
      responses:
        "200":
          description: Git 连接，不含令牌
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GitConnection" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: createGitConnection
      tags: [aiagents]
      description: 新建连接，要求 5 分钟内验证过（不受二次验证设置影响）。保存时用令牌查一次用户名，失败也会保存并记下错误。回调密钥只在这次返回。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name]
              properties:
                kind: { $ref: "#/components/schemas/GitConnectionKind" }
                name: { type: string, minLength: 1, maxLength: 60 }
                baseUrl: { type: string, description: Forgejo 必填，比如 https://git.example.com；GitHub 不传用 https://api.github.com }
                token: { type: string, description: 访问令牌，useGithubModule 为 true 时不传 }
                useGithubModule:
                  type: boolean
                  deprecated: true
                  description: B62 起不用，下个版本删。令牌都填在 Git 账号里

      responses:
        "201":
          description: 新连接
          content:
            application/json:
              schema:
                type: object
                required: [connection, webhookSecret]
                properties:
                  connection: { $ref: "#/components/schemas/GitConnection" }
                  webhookSecret: { type: string }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /git-connections/{connectionId}:
    parameters:
      - { name: connectionId, in: path, required: true, schema: { type: integer, format: int64 } }
    patch:
      operationId: updateGitConnection
      tags: [aiagents]
      description: 改名字要提升权限，换令牌要求 5 分钟内验证过。换令牌后重新检查。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                token: { type: string }
      responses:
        "200":
          description: 连接
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitConnection" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteGitConnection
      tags: [aiagents]
      description: 删除连接，要提升权限。用它登记的仓库保留，但不能再 clone 和开 PR。
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /git-connections/{connectionId}/check:
    parameters:
      - { name: connectionId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: checkGitConnection
      tags: [aiagents]
      description: 用令牌查一次用户名。
      responses:
        "200":
          description: 检查后的连接，失败时 lastError 有内容
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitConnection" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /git-connections/{connectionId}/repos:
    parameters:
      - { name: connectionId, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: listRemoteRepos
      tags: [aiagents]
      description: 这个连接能访问的仓库，最近更新的在前，最多 100 个。
      parameters:
        - { name: q, in: query, schema: { type: string }, description: 按名字过滤 }
      responses:
        "200":
          description: 仓库
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RemoteRepo" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /git-connections/{connectionId}/webhook:
    parameters:
      - { name: connectionId, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getGitWebhook
      tags: [aiagents]
      description: 回调地址和签名密钥，要求 5 分钟内验证过。
      responses:
        "200":
          description: 回调设置
          content:
            application/json:
              schema:
                type: object
                required: [path, secret]
                properties:
                  path: { type: string, description: 完整地址 = 面板地址 + /api/v1 + path }
                  secret: { type: string }
        default:
          $ref: "../common.yaml#/components/responses/Error"
components:
  schemas:
    AiAgentKind:
      type: string
      enum: [claude_code, codex, builtin]
    AiAgentAccess:
      type: string
      enum: [read, write, write_delete]
    CliPermission:
      type: string
      enum: [workspace, full]
    AiAgent:
      type: object
      required: [id, name, avatar, color, kind, model, instructions, access, cliPermission, repoIds, hostIds, hostNames,
        maxParallel, autoBuild, buildRetries, enabled, createdAt, updatedAt, monthCostUsd, runningTasks, queuedTasks]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        avatar: { type: string }
        color: { type: string }
        kind: { $ref: "#/components/schemas/AiAgentKind" }
        model: { type: string }
        instructions: { type: string }
        runnerAgentId: { type: string, nullable: true }
        runnerName: { type: string, description: 默认机器的名字 }
        access: { $ref: "#/components/schemas/AiAgentAccess" }
        cliPermission: { $ref: "#/components/schemas/CliPermission" }
        repoIds:
          type: array
          items: { type: integer, format: int64 }
        hostIds:
          type: array
          items: { type: string }
          description: B60。这个 Agent 能操作的机器（代理 id）。面板 AI 只能通过勾选了这台机器的 Agent 操作它
        hostNames:
          type: array
          items: { type: string }
          description: hostIds 对应的机器名，顺序一样
        maxParallel: { type: integer }
        monthlyBudgetUsd: { type: number, format: double, nullable: true }
        autoBuild: { type: boolean }
        buildRetries: { type: integer }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        monthCostUsd: { type: number, format: double, description: 本月费用，按 AI 用量记录算 }
        runningTasks: { type: integer }
        queuedTasks: { type: integer }
        overBudget: { type: boolean }
    AiAgentInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        avatar: { type: string, maxLength: 16 }
        color: { type: string, maxLength: 16 }
        kind: { $ref: "#/components/schemas/AiAgentKind" }
        model: { type: string, maxLength: 200 }
        instructions: { type: string, maxLength: 20000 }
        runnerAgentId: { type: string, nullable: true }
        access: { $ref: "#/components/schemas/AiAgentAccess" }
        cliPermission: { $ref: "#/components/schemas/CliPermission" }
        repoIds:
          type: array
          items: { type: integer, format: int64 }
        hostIds:
          type: array
          maxItems: 50
          items: { type: string }
          description: B60。能操作的机器。增加机器要提升权限
        maxParallel: { type: integer, minimum: 1, maximum: 10 }
        monthlyBudgetUsd: { type: number, format: double, nullable: true, minimum: 0 }
        autoBuild: { type: boolean }
        buildRetries: { type: integer, minimum: 0, maximum: 5 }
        enabled: { type: boolean }
    AiAgentRunStatus:
      type: string
      description: B86。waiting 是在等你决定（权限请求或问题）
      enum: [queued, running, waiting, pr_opened, done, failed, canceled]
    AiAgentRun:
      type: object
      required: [id, agentId, agentName, kind, issueKey, issueTitle, status, createdAt]
      properties:
        id: { type: integer, format: int64 }
        agentId: { type: integer, format: int64 }
        agentName: { type: string }
        kind: { $ref: "#/components/schemas/AiAgentKind" }
        issueKey: { type: string, description: 卡片编号，可能为空 }
        issueTitle: { type: string }
        taskId: { type: integer, format: int64, description: CLI 类型对应的编码任务 }
        status: { $ref: "#/components/schemas/AiAgentRunStatus" }
        summary: { type: string, description: 做完后的说明，或失败原因 }
        prUrl: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    AiAgentRunEvent:
      type: object
      required: [seq, at, kind, text]
      properties:
        seq: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        kind:
          type: string
          description: status 状态变化；tool 调了一个工具（text 是工具名和参数摘要）；text Agent 的输出；decision 等你决定；error 出错
          enum: [status, tool, text, decision, error]
        text: { type: string }
        tool: { type: string, description: kind=tool 时的工具名 }
        ok: { type: boolean, description: kind=tool 时工具是否成功 }
    AiAgentDecision:
      type: object
      required: [id, kind, title, createdAt]
      properties:
        id: { type: string, description: 例如 run:12:3、action:45 }
        kind:
          type: string
          enum: [permission, question]
        agentId: { type: integer, format: int64, description: AI 助手会话里的动作没有 }
        agentName: { type: string }
        runId: { type: integer, format: int64 }
        issueKey: { type: string }
        conversationId: { type: integer, format: int64, description: AI 助手会话里的动作才有 }
        title: { type: string, description: 一句话，比如“要删除卡片 XC-12”“用哪个数据库？” }
        detail: { type: string, description: Markdown，命令、参数或问题的背景 }
        options:
          type: array
          description: kind=question 时可以直接点的选项，可以为空（只能自己写）
          items: { type: string }
        createdAt: { type: string, format: date-time }
    AiAgentNotify:
      type: object
      required: [received, started, decision, prOpened, done, failed]
      description: B87。每类 Agent 通知的开关，默认 received、started 关，其他开
      properties:
        received: { type: boolean, description: 收到任务（分配了卡片，排上队） }
        started: { type: boolean, description: 开始任务 }
        decision: { type: boolean, description: 需要你决定（权限请求、问题、编码任务做完等你审查） }
        prOpened: { type: boolean, description: 已提 PR }
        done: { type: boolean, description: 完成任务 }
        failed: { type: boolean, description: 失败或中断 }
    GitConnectionKind:
      type: string
      enum: [github, forgejo]
    GitConnection:
      type: object
      required: [id, kind, name, baseUrl, username, useGithubModule, hasToken, createdAt, lastError, webhookPath]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/GitConnectionKind" }
        name: { type: string }
        baseUrl: { type: string }
        username: { type: string }
        useGithubModule: { type: boolean, deprecated: true, description: B62 起不用，下个版本删 }
        hasToken: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastCheckedAt: { type: string, format: date-time, nullable: true }
        lastError: { type: string }
        webhookPath: { type: string }
    RemoteRepo:
      type: object
      required: [owner, name, fullName, cloneUrl, defaultBranch, private]
      properties:
        owner: { type: string }
        name: { type: string }
        fullName: { type: string }
        cloneUrl: { type: string }
        htmlUrl: { type: string }
        defaultBranch: { type: string }
        private: { type: boolean }
        description: { type: string }
