openapi: 3.0.3
info:
  title: X Console reminders and notification delivery (M7)
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /reminders:
    get:
      operationId: listReminders
      tags: [reminders]
      parameters:
        - name: range
          in: query
          description: today 今天要处理的（含已到点未完成的）；upcoming 今天以后的；done 已完成或已结束的（最近 100 条）
          schema:
            type: string
            enum: [today, upcoming, done]
      responses:
        "200":
          description: 提醒列表，按时间排序
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Reminder" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: createReminder
      tags: [reminders]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReminderInput" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reminder" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /reminders/{reminderId}:
    parameters:
      - $ref: "#/components/parameters/ReminderId"
    get:
      operationId: getReminder
      tags: [reminders]
      responses:
        "200":
          description: 提醒
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reminder" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    patch:
      operationId: updateReminder
      tags: [reminders]
      description: 改了时间或重复规则时，从现在起重新计算下次时间，并清掉完成和稍后状态。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReminderPatch" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reminder" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteReminder
      tags: [reminders]
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /reminders/{reminderId}/done:
    parameters:
      - $ref: "#/components/parameters/ReminderId"
    post:
      operationId: completeReminder
      tags: [reminders]
      description: 一次性提醒标为完成。重复提醒完成当前这一次：已经到点的算确认，还没到点的跳到下一次。
      responses:
        "200":
          description: 完成后的提醒
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reminder" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /reminders/{reminderId}/snooze:
    parameters:
      - $ref: "#/components/parameters/ReminderId"
    post:
      operationId: snoozeReminder
      tags: [reminders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes]
              properties:
                minutes: { type: integer, minimum: 1, maximum: 10080 }
      responses:
        "200":
          description: 稍后提醒
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reminder" }
        default:
          $ref: "../common.yaml#/components/responses/Error"

  /notify/channels:
    get:
      operationId: listNotifyChannels
      tags: [notify]
      responses:
        "200":
          description: 所有外部渠道的配置，令牌打码
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotifyChannel" }
  /notify/channels/{channel}:
    parameters:
      - $ref: "#/components/parameters/Channel"
    get:
      operationId: getNotifyChannel
      tags: [notify]
      responses:
        "200":
          description: 渠道配置，令牌打码
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotifyChannel" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    put:
      operationId: updateNotifyChannel
      tags: [notify]
      description: 只改传了的字段。令牌字段传空字符串表示删除；改令牌需要提升权限。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "200":
          description: 保存后的配置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotifyChannel" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /notify/channels/{channel}/test:
    parameters:
      - $ref: "#/components/parameters/Channel"
    post:
      operationId: testNotifyChannel
      tags: [notify]
      responses:
        "204":
          description: 测试消息已发出
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /notify/routes:
    get:
      operationId: listNotifyRoutes
      tags: [notify]
      responses:
        "200":
          description: 路由规则，按顺序匹配
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotifyRoute" }
    put:
      operationId: replaceNotifyRoutes
      tags: [notify]
      description: 整体替换。数组顺序就是匹配顺序。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/NotifyRoute" }
      responses:
        "200":
          description: 保存后的规则
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotifyRoute" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /notify/quiet-hours:
    get:
      operationId: getQuietHours
      tags: [notify]
      responses:
        "200":
          description: 免打扰时段
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuietHours" }
    put:
      operationId: updateQuietHours
      tags: [notify]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuietHours" }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuietHours" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /notify/actions:
    post:
      operationId: runNotifyAction
      tags: [notify]
      description: 通知按钮的回调，Web Push 的 service worker 用它。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actionId]
              properties:
                actionId: { type: string, minLength: 1 }
      responses:
        "204":
          description: 已处理
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /notify/webpush/vapid-public-key:
    get:
      operationId: getVapidPublicKey
      tags: [notify]
      responses:
        "200":
          description: 浏览器订阅时用的公钥
          content:
            application/json:
              schema:
                type: object
                required: [publicKey]
                properties:
                  publicKey: { type: string }
  /notify/webpush/subscriptions:
    post:
      operationId: addPushSubscription
      tags: [notify]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushSubscription" }
      responses:
        "204":
          description: 已保存
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deletePushSubscription
      tags: [notify]
      parameters:
        - name: endpoint
          in: query
          required: true
          schema: { type: string }
      responses:
        "204":
          description: 已删除
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /notify/telegram/register-webhook:
    post:
      operationId: registerTelegramWebhook
      tags: [notify]
      description: 用 XC_PUBLIC_URL 调 Telegram 的 setWebhook，并生成校验密钥。
      responses:
        "200":
          description: 已注册
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /integrations/telegram/webhook:
    post:
      operationId: telegramWebhook
      tags: [notify]
      security: []
      description: Telegram 回调入口，公开路径。用 X-Telegram-Bot-Api-Secret-Token 校验。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: 已接收
        default:
          $ref: "../common.yaml#/components/responses/Error"

components:
  parameters:
    ReminderId:
      name: reminderId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Channel:
      name: channel
      in: path
      required: true
      schema:
        type: string
        enum: [webpush, telegram, bark, serverchan]
  schemas:
    ReminderStatus:
      type: string
      description: scheduled 等待到点；pending 已到点未处理；snoozed 稍后提醒；done 已完成；ended 重复规则已结束
      enum: [scheduled, pending, snoozed, done, ended]
    Reminder:
      type: object
      required: [id, title, body, link, rrule, dtstart, enabled, status, createdAt]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        body: { type: string }
        link: { type: string }
        rrule:
          type: string
          description: 空表示一次性
        dtstart:
          type: string
          format: date-time
          description: 第一次的时间
        nextAt:
          type: string
          format: date-time
          description: 下一次按规则到点的时间
        dueAt:
          type: string
          format: date-time
          description: 下一次实际会提醒的时间（考虑了稍后提醒）
        lastFiredAt: { type: string, format: date-time }
        snoozedUntil: { type: string, format: date-time }
        doneAt: { type: string, format: date-time }
        enabled: { type: boolean }
        status: { $ref: "#/components/schemas/ReminderStatus" }
        createdAt: { type: string, format: date-time }
    ReminderInput:
      type: object
      required: [title, at]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string }
        link: { type: string }
        at:
          type: string
          format: date-time
          description: 第一次的时间
        rrule:
          type: string
          description: RRULE，例如 FREQ=DAILY 或 FREQ=WEEKLY;BYDAY=MO,WE。按用户时区计算
    ReminderPatch:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string }
        link: { type: string }
        at: { type: string, format: date-time }
        rrule: { type: string }
        enabled: { type: boolean }
    ChannelField:
      type: object
      required: [key, secret, required, set, value]
      properties:
        key: { type: string }
        secret: { type: boolean }
        required: { type: boolean }
        set:
          type: boolean
          description: 是否已经填过
        value:
          type: string
          description: 当前值。令牌字段只返回打码后的值
        placeholder: { type: string }
    NotifyChannel:
      type: object
      required: [name, configured, fields]
      properties:
        name: { type: string }
        configured:
          type: boolean
          description: 必填项都已填好，可以发送
        fields:
          type: array
          items: { $ref: "#/components/schemas/ChannelField" }
        webhookUrl:
          type: string
          description: Telegram 回调地址（需要 XC_PUBLIC_URL）
        subscriptions:
          type: integer
          description: Web Push 已订阅的浏览器数量
    NotifyPriority:
      type: string
      enum: [low, normal, high, urgent]
    NotifyRoute:
      type: object
      required: [kindPattern, minPriority, channels, enabled]
      properties:
        id: { type: integer, format: int64 }
        kindPattern:
          type: string
          minLength: 1
          description: 通知 kind 的匹配模式，* 匹配任意字符，例如 host.alert*、*
        minPriority: { $ref: "#/components/schemas/NotifyPriority" }
        channels:
          type: array
          items: { type: string }
        enabled: { type: boolean }
    QuietHours:
      type: object
      required: [enabled, start, end]
      properties:
        enabled: { type: boolean }
        start: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        end: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
    PushSubscription:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, minLength: 1 }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string }
            auth: { type: string }
        userAgent: { type: string }
