openapi: 3.0.3
info:
  title: X Console storage API (B24)
  version: 0.1.0
  description: |
    整站文件存储。所有模块的文件（云盘、笔记附件、项目图片、云盘历史版本……）
    都通过 internal/server/files.Store 读写，放在本机 data/files/ 或 S3。
    这里是存储位置的设置、切换和用量。取代云盘原来的“S3 同步”（/drive/s3*）。
servers:
  - url: /api/v1
paths:
  /storage:
    get:
      operationId: getStorage
      tags: [storage]
      responses:
        "200":
          description: 当前存储位置、S3 配置（不含密钥）、缓存、用量和切换进度
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageStatus" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /storage/s3:
    put:
      operationId: putStorageS3
      tags: [storage]
      description: 保存 S3 配置。要提升权限。secretAccessKey 不传表示不改，加密保存。正在用 S3 时改配置，先测试连接，失败回 400 不保存
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageS3Input" }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageStatus" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /storage/s3/test:
    post:
      operationId: testStorageS3
      tags: [storage]
      description: 写一个小文件、读回来、再删掉。传了请求体就用请求体里的配置（没传的字段用已保存的）
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageS3Input" }
      responses:
        "200":
          description: 测试结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestResult" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /storage/switch:
    post:
      operationId: switchStorage
      tags: [storage]
      description: |
        开始把全部文件搬到另一个位置。要提升权限。后台进行，进度看 GET /storage 的 migration。
        全部搬完并校验大小后才切换，失败时不切换、不删原文件，可以再次调用重试（已搬过的跳过）。
        已经在搬时回 409。目标和当前一样时回 400。切到 s3 但没配置时回 412
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: { $ref: "#/components/schemas/StorageBackend" }
                deleteSource:
                  type: boolean
                  description: 切换成功后删除原位置的文件。默认 false，保留一份
      responses:
        "202":
          description: 已开始
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /storage/switch/cancel:
    post:
      operationId: cancelStorageSwitch
      tags: [storage]
      description: 停止正在进行的搬迁。已经搬过去的文件留着，下次重试时跳过
      responses:
        "204":
          description: 已停止
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /storage/cache:
    put:
      operationId: putStorageCache
      tags: [storage]
      description: 用 S3 时本机缓存的上限。超出时按最久没读的顺序删
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [limitBytes]
              properties:
                limitBytes:
                  type: integer
                  format: int64
                  minimum: 0
                  description: 0 表示不缓存
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageStatus" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /storage/remotes:
    get:
      operationId: listStorageRemotes
      tags: [storage]
      description: |
        B69。网盘账号（WebDAV、Google Drive），备份和云盘页共用。
        drive=true 时只返回云盘页要显示的：打开了“在云盘页显示”、能连、锁定时没被隐藏的
      parameters:
        - name: drive
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: 账号列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/StorageRemote" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    post:
      operationId: createStorageRemote
      tags: [storage]
      description: 添加网盘账号。WebDAV 保存前先连一次。要提升权限
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageRemoteInput" }
      responses:
        "201":
          description: 添加好的账号
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageRemote" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /storage/remotes/test:
    post:
      operationId: testStorageRemote
      tags: [storage]
      description: 用请求里的设置连一次，不保存。传 id 时没填的密码用已保存的。要提升权限
      parameters:
        - name: id
          in: query
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageRemoteInput" }
      responses:
        "200":
          description: 结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestResult" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /storage/remotes/gdrive/callback:
    get:
      operationId: storageGdriveCallback
      tags: [storage]
      description: |
        Google 授权完跳回来的地址，不用登录，靠一次性 state 校验。
        然后跳到 /settings/storage?gdrive=ok，失败时跳到 /settings/storage?gdrive=error&message=原因
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302":
          description: 跳回设置页
  /storage/remotes/{remoteId}:
    parameters:
      - $ref: "#/components/parameters/RemoteId"
    patch:
      operationId: updateStorageRemote
      tags: [storage]
      description: 改账号。改了 Google 的客户端 ID 会清掉授权。要提升权限
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageRemoteInput" }
      responses:
        "200":
          description: 改好的账号
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageRemote" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: deleteStorageRemote
      tags: [storage]
      description: 删除账号。自动备份正在用它时回 409。要提升权限
      responses:
        "204": { description: 已删除 }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /storage/remotes/{remoteId}/gdrive/auth:
    parameters:
      - $ref: "#/components/parameters/RemoteId"
    get:
      operationId: startStorageGdriveAuth
      tags: [storage]
      description: 返回 Google 授权页的地址，前端跳过去。state 一次性，10 分钟内有效。要提升权限
      responses:
        "200":
          description: 授权地址
          content:
            application/json:
              schema:
                type: object
                required: [url, redirectUri]
                properties:
                  url: { type: string }
                  redirectUri: { type: string }
        default:
          $ref: "../common.yaml#/components/responses/Error"
    delete:
      operationId: revokeStorageGdriveAuth
      tags: [storage]
      description: 撤销 Google Drive 授权。要提升权限
      responses:
        "204": { description: 已撤销 }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /storage/remotes/{remoteId}/items:
    parameters:
      - $ref: "#/components/parameters/RemoteId"
    get:
      operationId: listStorageRemoteItems
      tags: [storage]
      description: 列网盘里的一个文件夹，文件夹在前。锁定时被隐藏的回 404
      parameters:
        - name: ref
          in: query
          description: 文件夹的位置。WebDAV 是路径，Google Drive 是文件夹 id，不传表示根目录
          schema: { type: string }
      responses:
        "200":
          description: 文件夹内容
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageRemoteListing" }
        default:
          $ref: "../common.yaml#/components/responses/Error"
  /storage/remotes/{remoteId}/download:
    parameters:
      - $ref: "#/components/parameters/RemoteId"
    get:
      operationId: downloadStorageRemoteFile
      tags: [storage]
      description: 下载网盘里的一个文件，服务端转发
      parameters:
        - name: ref
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 文件内容
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default:
          $ref: "../common.yaml#/components/responses/Error"
components:
  parameters:
    RemoteId:
      name: remoteId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    StorageRemoteKind:
      type: string
      enum: [webdav, gdrive]
    StorageRemote:
      type: object
      required: [id, kind, name, showInDrive, ready, usedByBackup, createdAt]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/StorageRemoteKind" }
        name: { type: string }
        showInDrive: { type: boolean, description: 在云盘页显示一个标签 }
        ready: { type: boolean, description: 能连。WebDAV 是填好了地址和密码，Google Drive 是已授权 }
        usedByBackup: { type: boolean, description: 自动备份正在用它，不能删 }
        webdav:
          type: object
          required: [url, username, passwordSet]
          properties:
            url: { type: string }
            username: { type: string }
            passwordSet: { type: boolean }
        gdrive:
          type: object
          required: [clientId, secretSet, authorized, limited, redirectUri]
          properties:
            clientId: { type: string }
            secretSet: { type: boolean }
            authorized: { type: boolean }
            account: { type: string, description: 授权的 Google 账号邮箱 }
            limited: { type: boolean, description: 授权里没有只读权限，只能看到面板自己建的文件，要重新授权 }
            redirectUri: { type: string, description: 要填到 Google 控制台的重定向地址。B63 时授权的账号继续用旧地址 }
        createdAt: { type: string, format: date-time }
    StorageRemoteInput:
      type: object
      properties:
        kind: { $ref: "#/components/schemas/StorageRemoteKind" }
        name: { type: string, maxLength: 50, description: 空时按类型取默认名，坚果云、主机名或 Google Drive }
        showInDrive: { type: boolean }
        webdav:
          type: object
          properties:
            url: { type: string, maxLength: 500, description: 比如 https://dav.jianguoyun.com/dav/ }
            username: { type: string, maxLength: 200 }
            password: { type: string, maxLength: 500, description: 不传或空表示不改 }
        gdrive:
          type: object
          properties:
            clientId: { type: string, maxLength: 300 }
            clientSecret: { type: string, maxLength: 300, description: 不传或空表示不改 }
    StorageRemoteEntry:
      type: object
      required: [ref, name, isDir, downloadable]
      properties:
        ref: { type: string }
        name: { type: string }
        isDir: { type: boolean }
        size: { type: integer, format: int64 }
        modifiedAt: { type: string, format: date-time }
        downloadable: { type: boolean, description: Google 文档这类在线文件是 false }
    StorageRemoteListing:
      type: object
      required: [ref, trail, items]
      properties:
        ref: { type: string }
        trail:
          type: array
          description: 从根目录下面一级到当前文件夹
          items:
            type: object
            required: [ref, name]
            properties:
              ref: { type: string }
              name: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/StorageRemoteEntry" }
    StorageBackend:
      type: string
      enum: [local, s3]
    StorageS3:
      type: object
      required: [endpoint, region, bucket, prefix, accessKeyId, hasSecret, pathStyle]
      properties:
        endpoint: { type: string, description: 例如 https://s3.amazonaws.com 或 https://<账号>.r2.cloudflarestorage.com }
        region: { type: string }
        bucket: { type: string }
        prefix: { type: string, description: 桶里的目录前缀，比如 x-console/ }
        accessKeyId: { type: string }
        hasSecret: { type: boolean }
        pathStyle: { type: boolean, description: MinIO 等自建服务通常要打开 }
    StorageS3Input:
      type: object
      properties:
        endpoint: { type: string }
        region: { type: string }
        bucket: { type: string }
        prefix: { type: string }
        accessKeyId: { type: string }
        secretAccessKey: { type: string, description: 只写。不传表示不改 }
        pathStyle: { type: boolean }
    ModuleUsage:
      type: object
      required: [module, files, bytes]
      properties:
        module:
          type: string
          description: files.Store 里 key 的第一段，比如 drive、notes、projects、drive-versions
        files: { type: integer, format: int64 }
        bytes: { type: integer, format: int64 }
    StorageMigration:
      type: object
      required: [state, target, totalFiles, doneFiles, totalBytes, doneBytes]
      properties:
        state:
          type: string
          enum: [idle, running, failed, done, canceled]
        target: { $ref: "#/components/schemas/StorageBackend" }
        totalFiles: { type: integer, format: int64 }
        doneFiles: { type: integer, format: int64 }
        totalBytes: { type: integer, format: int64 }
        doneBytes: { type: integer, format: int64 }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        error: { type: string, description: 失败时的原因，比如第一个出错的文件和错误 }
    StorageStatus:
      type: object
      required: [backend, localPath, cacheLimitBytes, cacheBytes, usage, migration]
      properties:
        backend: { $ref: "#/components/schemas/StorageBackend" }
        localPath: { type: string, description: 本机文件目录，比如 /data/files }
        s3: { $ref: "#/components/schemas/StorageS3" }
        cacheLimitBytes: { type: integer, format: int64 }
        cacheBytes: { type: integer, format: int64, description: 本机缓存现在占多少 }
        usage:
          type: array
          description: 按模块统计。统计结果缓存 10 分钟
          items: { $ref: "#/components/schemas/ModuleUsage" }
        migration: { $ref: "#/components/schemas/StorageMigration" }
    TestResult:
      type: object
      required: [ok, message]
      properties:
        ok: { type: boolean }
        message: { type: string }
