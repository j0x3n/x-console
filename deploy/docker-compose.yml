# 两种用法：
#   自动部署：GitHub Actions 构建好镜像，服务器上 docker compose pull && docker compose up -d
#   手动构建：cp .env.example .env，填好后 docker compose up -d --build
#
# 面板只监听服务器本机的 127.0.0.1:${XC_PORT}，由反向代理对外提供 HTTPS：
#   服务器上已经有 Caddy / Nginx：把域名反代到 127.0.0.1:${XC_PORT}，见 docs/06-deploy.md
#   服务器上没有反向代理：在 .env 里加 COMPOSE_PROFILES=caddy，使用下面自带的 Caddy
services:
  x-console:
    image: ${XC_IMAGE:-ghcr.io/j0x3n/x-console:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - xc-data:/data
    ports:
      - "127.0.0.1:${XC_PORT:-17380}:8080"

  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - XC_DOMAIN=${XC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - x-console

volumes:
  # 数据库在这个卷里。备份方法见 docs/06-deploy.md。
  xc-data:
  caddy-data:
