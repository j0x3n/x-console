# 两种用法：
#   自动部署：GitHub Actions 构建好镜像，服务器上 docker compose pull && docker compose up -d
#   手动构建：cp .env.example .env，填好后 docker compose up -d --build
services:
  x-console:
    image: ${XC_IMAGE:-ghcr.io/j0x3n/x-console:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - xc-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - XC_DOMAIN=${XC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - x-console

volumes:
  # 数据库在这个卷里。备份方法见 docs/06-deploy.md。
  xc-data:
  caddy-data:
