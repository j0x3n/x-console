<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="X Console" />
    <title>X Console</title>
    <script>
      let savedTheme = "system";
      let savedLanguage = "zh";
      try {
        savedTheme = localStorage.getItem("x-console-theme") || localStorage.getItem("xcc-theme") || "system";
        savedLanguage = localStorage.getItem("x-console-language") || localStorage.getItem("xcc-language") || "zh";
      } catch {
        // Use default preferences if browser storage is unavailable.
      }
      const dark =
        savedTheme === "dark" ||
        (savedTheme === "system" &&
          matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      // B98：主题色去掉了 ember 和 mint，旧值换成 indigo 和 teal
      let accent = "indigo";
      try {
        accent = localStorage.getItem("x-console-accent") || "indigo";
      } catch {
        // Use the default accent if browser storage is unavailable.
      }
      accent = { ember: "indigo", mint: "teal" }[accent] || accent;
      document.documentElement.dataset.accent = accent;
      document.documentElement.style.colorScheme = dark ? "dark" : "light";
      const mobile = matchMedia("(max-width: 720px)").matches;
      // 和 tokens.css 一致：桌面用内容区底色，手机用左栏底色
      const colors = dark ? ["#111113", "#0c0c0e"] : ["#ffffff", "#fafafa"];
      document.querySelector('meta[name="theme-color"]').content = colors[mobile ? 1 : 0];
      if (savedLanguage === "en") {
        document.documentElement.lang = "en";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
