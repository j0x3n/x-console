name: CI

# 除 main 以外的分支和所有 PR 都跑测试。main 的推送由 deploy.yml 调用本工作流。
# 只在 PR 上跑（只改文档时不跑），以及被 deploy.yml 调用、手动运行时跑。
# 平时推送到 develop 不跑，省构建额度。推送前在本地跑 AGENTS.md 里的全部检查。
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_call:
    inputs:
      race:
        description: 后端测试是否带 -race。不传或 true 都带上。部署传 false。
        type: boolean
        default: true
  workflow_dispatch:

permissions:
  contents: read
  actions: read # changes 任务要查上一次成功的部署

# 同一个分支连着推送几次时，取消还在跑的旧检查，只跑最新的。
# 被 deploy.yml 调用时 github.workflow 是 "Deploy"，分组不同，也不取消部署里的测试。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'CI' }}

jobs:
  backend-check:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      SQLC_VERSION: v1.31.1
      OAPI_CODEGEN_VERSION: v2.8.0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        id: go
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # 两个代码生成工具每次从源码编译要 1 分多钟。按版本缓存编好的程序。
      - name: Cache code generators
        id: codegen
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin/sqlc
            ~/go/bin/oapi-codegen
          key: codegen-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-sqlc-${{ env.SQLC_VERSION }}-oapi-${{ env.OAPI_CODEGEN_VERSION }}
      - name: Install code generators
        if: steps.codegen.outputs.cache-hit != 'true'
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@$SQLC_VERSION
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@$OAPI_CODEGEN_VERSION
      - name: Generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code -- .
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Local agent deploy script
        working-directory: deploy
        run: |
          sh -n remote-deploy.sh
          sh -n local-agent.sh
          sh local-agent_test.sh
      - name: Install scripts pass shellcheck
        run: shellcheck --shell=sh internal/server/core/agentinstall/install.sh.tmpl internal/server/core/agentinstall/uninstall.sh
      - name: Windows agent builds
        run: |
          GOOS=windows GOARCH=amd64 go vet ./internal/agent/... ./cmd/agent
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/agent

  # 八组同时跑。分组由 scripts/test-shard.py 按每个包的用时（scripts/test-weights.txt）自动分配，
  # 新增的包不用改这里。仓库是公开的，Actions 分钟数不收费，多分几组只是更快。
  # inputs.race 在 PR 和手动运行时是空的，只有明确传 false 才不带 -race。
  backend-test:
    needs: changes
    if: needs.changes.outputs.tests != 'none'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # 失败的测试自动重跑一次，过了就算过（日志里会留 "Re-running" 和测试名）。
      # 一次失败超过 5 个测试说明是真坏了，不重跑。
      - name: Cache gotestsum
        id: gotestsum
        uses: actions/cache@v4
        with:
          path: ~/go/bin/gotestsum
          key: gotestsum-${{ runner.os }}-v1.13.0
      - name: Install gotestsum
        if: steps.gotestsum.outputs.cache-hit != 'true'
        run: go install gotest.tools/gotestsum@v1.13.0
      - name: Test shard ${{ matrix.shard }} of 8
        env:
          RACE_INPUT: ${{ github.event_name != 'workflow_call' && 'true' || inputs.race }}
          SHARD: ${{ matrix.shard }}
          TESTS: ${{ needs.changes.outputs.tests }}
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          set -euo pipefail
          flags=()
          if [ "${RACE_INPUT:-}" != "false" ]; then
            flags+=(-race)
          fi
          if [ "$TESTS" = "some" ]; then
            # 只改了个别模块：只测改到的包和几个会碰到别的模块的包，规则见 scripts/ci-scope.sh
            read -r -a pkgs <<<"$PACKAGES"
          else
            mapfile -t pkgs < <(python3 ../scripts/test-shard.py "$SHARD" 8)
          fi
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "这一组没有分到包，检查 scripts/test-shard.py"
            exit 1
          fi
          printf '%s\n' "${pkgs[@]}"
          # -vet=off：vet 已经在 backend-check 里跑过。-ldflags="-s -w"：不写调试信息，
          # 每个包的测试程序都带着整个应用，链接最费时间，这样能省一截。
          ~/go/bin/gotestsum --format pkgname-and-test-fails --rerun-fails=1 --rerun-fails-max-failures=5 \
            --packages="${pkgs[*]}" -- -vet=off -ldflags="-s -w" "${flags[@]}"

  # 看上次部署成功以来改了什么（PR 也是和目标分支上次部署成功的提交比），决定跑哪些检查，
  # 规则在 scripts/ci-scope.sh。查不到上次部署、手动运行时全部都跑。
  # 端到端两边都跑，每次都跑。
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      web: ${{ steps.scope.outputs.web }}
      tests: ${{ steps.scope.outputs.tests }}
      shards: ${{ steps.scope.outputs.shards }}
      packages: ${{ steps.scope.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: base
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.base_ref || github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          base=""
          if [ "$EVENT" != "workflow_dispatch" ]; then
            base=$(gh run list --workflow deploy.yml --branch "$BRANCH" --status success --limit 1 --json headSha --jq '.[0].headSha // ""' || true)
            git cat-file -e "${base}^{commit}" 2>/dev/null || base=""
          fi
          echo "上次部署成功的提交：${base:-没有，全部都跑}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - id: scope
        run: bash scripts/ci-scope.sh "${{ steps.base.outputs.base }}" | tee -a "$GITHUB_OUTPUT"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/gen
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run lint:fonts
      # CI 上单元测试按 CPU 数开线程（vite.config.ts 里看 CI 环境变量）
      - run: npm test

  # 构建和端到端单独一个任务，和上面的检查同时跑。
  # 不装浏览器：GitHub 的 ubuntu-latest 自带 Google Chrome。端到端脚本自己用 vite build 打包，不再重复 typecheck。
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm run e2e
        env:
          XC_SHOTS_BROWSER: /usr/bin/google-chrome
      - name: Upload failed test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: web/e2e-artifacts/
          if-no-files-found: ignore
