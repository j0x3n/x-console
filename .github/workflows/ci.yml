name: CI

# 除 main 以外的分支和所有 PR 都跑测试。main 的推送由 deploy.yml 调用本工作流。
# 只在 PR 上跑（只改文档时不跑），以及被 deploy.yml 调用、手动运行时跑。
# 平时推送到 develop 不跑，省构建额度。推送前在本地跑 AGENTS.md 里的全部检查。
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_call:
    inputs:
      race:
        description: 后端测试是否带 -race。不传或 true 都带上。部署传 false。
        type: boolean
        default: true
  workflow_dispatch:

permissions:
  contents: read

# 同一个分支连着推送几次时，取消还在跑的旧检查，只跑最新的。
# 被 deploy.yml 调用时 github.workflow 是 "Deploy"，分组不同，也不取消部署里的测试。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'CI' }}

jobs:
  backend-check:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      SQLC_VERSION: v1.31.1
      OAPI_CODEGEN_VERSION: v2.8.0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        id: go
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # 两个代码生成工具每次从源码编译要 1 分多钟。按版本缓存编好的程序。
      - name: Cache code generators
        id: codegen
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin/sqlc
            ~/go/bin/oapi-codegen
          key: codegen-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-sqlc-${{ env.SQLC_VERSION }}-oapi-${{ env.OAPI_CODEGEN_VERSION }}
      - name: Install code generators
        if: steps.codegen.outputs.cache-hit != 'true'
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@$SQLC_VERSION
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@$OAPI_CODEGEN_VERSION
      - name: Generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code -- .
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Local agent deploy script
        working-directory: deploy
        run: |
          sh -n remote-deploy.sh
          sh -n local-agent.sh
          sh local-agent_test.sh
      - name: Install scripts pass shellcheck
        run: shellcheck --shell=sh internal/server/core/agentinstall/install.sh.tmpl internal/server/core/agentinstall/uninstall.sh
      - name: Windows agent builds
        run: |
          GOOS=windows GOARCH=amd64 go vet ./internal/agent/... ./cmd/agent
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/agent

  # 三组同时跑。分组按 2026-10-01 带 -race 的包用时摊开，第三组是剩下的全部包，新包不会漏。
  # inputs.race 在 PR 和手动运行时是空的，只有明确传 false 才不带 -race。
  backend-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: drive-hosts-ai
            packages: ./internal/server/modules/drive/... ./internal/server/modules/hosts/... ./internal/server/modules/ai/... ./internal/server/modules/github/... ./internal/server/modules/monitoring/... ./internal/server/modules/homeassistant/... ./internal/server/modules/reminders/...
          - name: app-coding-notes-projects
            packages: ./internal/server/app/... ./internal/server/modules/backup/... ./internal/server/modules/coding/... ./internal/server/modules/notes/... ./internal/server/modules/projects/... ./internal/server/store/...
          - name: rest
            packages: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test ${{ matrix.name }}
        env:
          RACE_INPUT: ${{ github.event_name != 'workflow_call' && 'true' || inputs.race }}
          PACKAGES: ${{ matrix.packages }}
        run: |
          set -euo pipefail
          flags=()
          if [ "${RACE_INPUT:-}" != "false" ]; then
            flags+=(-race)
          fi
          if [ -n "$PACKAGES" ]; then
            go test "${flags[@]}" $PACKAGES
            exit 0
          fi
          all=$(go list ./...)
          mapfile -t pkgs < <(printf '%s\n' "$all" | grep -v -E '/internal/server/(app|store|modules/(backup|coding|drive|github|homeassistant|hosts|monitoring|notes|projects|reminders|ai))(/|$)' || true)
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "剩余的包是空的，分组表达式把所有包都排除了"
            exit 1
          fi
          printf '%s\n' "${pkgs[@]}"
          go test "${flags[@]}" "${pkgs[@]}"

  # B78：PR 上看改了哪边。只改后端时跳过前端检查，只改前端时跳过后端；端到端两边都跑。
  # 被 deploy.yml 调用和手动运行时全部都跑。PR 检出的是合并提交，第一个父提交就是目标分支。
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name != 'pull_request' || steps.diff.outputs.backend == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.diff.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: diff
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only HEAD^1 HEAD)
          printf '%s\n' "$files"
          # api/ 下的接口定义两边都会生成代码
          if printf '%s\n' "$files" | grep -qE '^(backend/|api/|deploy/|\.github/)'; then echo backend=true >> "$GITHUB_OUTPUT"; fi
          if printf '%s\n' "$files" | grep -qE '^(web/|api/|\.github/)'; then echo web=true >> "$GITHUB_OUTPUT"; fi

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/gen
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run lint:fonts
      # CI 上单元测试按 CPU 数开线程（vite.config.ts 里看 CI 环境变量）
      - run: npm test

  # 构建和端到端单独一个任务，和上面的检查同时跑。
  # 不装浏览器：GitHub 的 ubuntu-latest 自带 Google Chrome。端到端脚本自己用 vite build 打包，不再重复 typecheck。
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm run e2e
        env:
          XC_SHOTS_BROWSER: /usr/bin/google-chrome
      - name: Upload failed test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: web/e2e-artifacts/
          if-no-files-found: ignore
